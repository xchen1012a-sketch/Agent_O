        prompt_template:
        - id: normalize-system
          role: system
          text: "你是一个问题归一化助手。\n\n任务：\n1. 阅读当前问题 question。\n2. 结合 conversation_history，补全代词、省略主语、省略对象。\n\
            3. 输出一个完整、独立、自然的中文问题。\n\n要求：\n- 只做补全，不要扩写成长答案。\n- 不要添加不存在的事实。\n- 如果当前问题已经完整，原样返回。\n\
            - 不要把知识问答改写成数据查询。\n- 结果必须是一句完整中文问题。\n- 只输出 JSON，不要解释，不要代码块。\n\n输出 Schema：\n\
            {\n  \"normalized_question\": \"\"\n}"
        - id: normalize-user
          role: user
          text: '请归一化下面的问题。


            【当前问题】

            {{#start_node.question#}}


            【多轮上下文】

            {{#start_node.conversation_history#}}'
        selected: false
        title: 问题归一化
        type: llm
        variables: []
        vision:
          enabled: false
      height: 132
