    - data:
        code: "import json\nimport re\n\ndef _extract_json(text: str):\n    raw =\
          \ str(text or '').strip()\n    raw = re.sub(r'^```json\\s*', '', raw, flags=re.I)\n\
          \    raw = re.sub(r'^```\\s*', '', raw)\n    raw = re.sub(r'\\s*```$', '',\
          \ raw)\n    if not raw:\n        return {}\n    try:\n        data = json.loads(raw)\n\
          \        return data if isinstance(data, dict) else {}\n    except Exception:\n\
          \        pass\n    m = re.search(r'\\{[\\s\\S]*\\}', raw)\n    if m:\n \
          \       try:\n            data = json.loads(m.group(0))\n            return\
          \ data if isinstance(data, dict) else {}\n        except Exception:\n  \
          \          pass\n    return {}\n\ndef main(llm_text: str = '') -> dict:\n\
          \    data = _extract_json(llm_text)\n    answer_text = re.sub(r'\\s+', '\
          \ ', str(data.get('answer_text') or '')).strip()\n    related = data.get('related_questions')\
          \ or []\n    if not isinstance(related, list):\n        related = []\n \
          \   out = []\n    for item in related:\n        q = re.sub(r'\\s+', ' ',\
          \ str(item or '')).strip()\n        if q and q not in out:\n           \
          \ out.append(q)\n        if len(out) >= 3:\n            break\n    if not\
          \ answer_text:\n        answer_text = '这个问题暂时缺少足够的知识依据，我不能直接给出可靠结论。你可以换一种更具体的问法，或者改问相关的产品知识、销售话术、合规边界说明。'\n\
          \    answer_mode = str(data.get('answer_mode') or '').strip().lower()\n\
          \    risk_tag = str(data.get('risk_tag') or '').strip().lower()\n    confidence_level\
          \ = str(data.get('confidence_level') or '').strip().lower()\n    matched_topics\
          \ = re.sub(r'\\s+', ' ', str(data.get('matched_topics') or '')).strip()\n\
          \    refuse_reason = re.sub(r'\\s+', ' ', str(data.get('refuse_reason')\
          \ or '')).strip()\n\n    if answer_mode not in {'knowledge_answer', 'cannot_answer'}:\n\
          \        answer_mode = 'knowledge_answer' if risk_tag == 'safe' and answer_text\
          \ else 'cannot_answer'\n    if answer_mode == 'knowledge_answer':\n    \
          \    risk_tag = 'safe'\n        confidence_level = confidence_level if confidence_level\
          \ in {'medium', 'low'} else 'medium'\n        matched_topics = matched_topics\
          \ or '通用知识兜底'\n        refuse_reason = ''\n    else:\n        risk_tag =\
          \ 'boundary'\n        confidence_level = 'low'\n        refuse_reason = refuse_reason\
          \ or '知识依据不足'\n        matched_topics = ''\n\n    return {\n        'answer_text':\
          \ answer_text,\n        'related_questions': out,\n        'answer_mode':\
          \ answer_mode,\n        'matched_topics': matched_topics,\n        'risk_tag':\
          \ risk_tag,\n        'confidence_level': confidence_level,\n        'refuse_reason':\
          \ refuse_reason,\n    }\n"
