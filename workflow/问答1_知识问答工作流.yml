          \      content = _clean(metadata.get('content') or metadata.get('segment')\
          \ or '')\n        else:\n            content = _clean(doc)\n\n        if\
          \ content:\n            effective_count += 1\n            total_len += len(content)\n\
          \            if title:\n                titles.append(title)\n         \
          \   prefix = f'片段{idx}'\n            if title:\n                prefix +=\
