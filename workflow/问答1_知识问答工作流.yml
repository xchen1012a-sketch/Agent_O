    - data:
        code: "import json\nimport re\n\ndef _extract_json(text: str) -> dict:\n \
          \   raw = str(text or '').strip()\n    raw = re.sub(r'^```json\\s*', '',\
          \ raw, flags=re.I)\n    raw = re.sub(r'^```\\s*', '', raw)\n    raw = re.sub(r'\\\
          s*```$', '', raw)\n    if not raw:\n        return {}\n    try:\n      \
          \  data = json.loads(raw)\n        return data if isinstance(data, dict)\
          \ else {}\n    except Exception:\n        pass\n    m = re.search(r'\\{[\\\
          s\\S]*\\}', raw)\n    if m:\n        try:\n            data = json.loads(m.group(0))\n\
          \            return data if isinstance(data, dict) else {}\n        except\
          \ Exception:\n            pass\n    return {}\n\nALLOW_EDGE_PATTERNS = [\n\
          \    r'合规', r'规范', r'标准话术', r'拒绝话术', r'怎么说', r'如何说', r'怎么回应', r'如何回答',\n\
          \    r'怎么解释', r'如何解释', r'哪些.*风险', r'哪些.*高风险', r'避免.*误导', r'避免.*隐瞒',\n\
          \    r'不要.*承诺', r'不能.*承诺', r'保值吗', r'升值吗', r'能保值', r'能升值', r'顾客问',\n\
          \    r'真假.*怎么看', r'真伪.*怎么看', r'证书.*怎么看', r'怎么看.*证书', r'边界', r'培训', r'引导.*正规机构', r'建议.*鉴定机构',\n\
          ]\n\nREDLINE_PATTERNS = [\n\
          \    r'(帮我|直接|替我|给我|能不能|是否可以).*(鉴定|判断|确认).*(真假|真伪|是真是假|真的假的|真|假)',\n\
          \    r'(这颗|这件|这个|这个货|这个产品).*(一定|肯定|确定).*(真|假)',\n\
          \    r'(承诺|保证|告诉顾客|跟顾客说).*(保值|升值|收益|稳赚|稳赚不赔)',\n\
          \    r'(伪造|造假|编造|编一个|做一个|P一个).*(证书|证明|鉴定书|检测报告|话术)',\n\
          \    r'(欺骗|骗|忽悠).*(顾客|客户)', r'(刻意|故意).*(隐瞒|不说).*(风险|瑕疵|问题)',\n\
          \    r'(规避|绕过).*(监管|审核|权限)', r'(删库|改库|写库|篡改.*数据|修改后台数据|绕过权限|越权)',\n\
          ]\n\ndef main(llm_text: str = '', normalized_question:\
          \ str = '', conversation_history: str = '') -> dict:\n    data = _extract_json(llm_text)\n\
          \    route = str(data.get('route_decision') or '').strip().lower()\n   \
          \ reason = str(data.get('precheck_reason') or '').strip()\n\n    current_text\
          \ = normalized_question or ''\n    hit_by_allow = any(re.search(p, current_text,\
          \ flags=re.I) for p in ALLOW_EDGE_PATTERNS)\n    hit_by_rule = any(re.search(p,\
          \ current_text, flags=re.I) for p in REDLINE_PATTERNS)\n\n    if hit_by_rule:\n\
          \        route = 'redline'\n        reason = reason or '当前问题明确要求执行鉴定结论、收益承诺、伪造欺骗或数据篡改等红线行为'\n\
          \    elif hit_by_allow:\n        route = 'proceed'\n        reason = '边缘命中但属于合规咨询或规范话术，可进入知识检索'\n\
          \    elif route not in {'proceed', 'redline'}:\n\
          \        route = 'proceed'\n        reason = reason or '未触发红线，可进入知识检索'\n\
          \n    if not reason:\n        reason = '触发红线边界，需拒绝回答' if route == 'redline'\
