    - data:
        code: "import json\nimport re\n\ndef _extract_json(text: str) -> dict:\n \
          \   raw = str(text or '').strip()\n    raw = re.sub(r'^```json\\s*', '',\
          \ raw, flags=re.I)\n    raw = re.sub(r'^```\\s*', '', raw)\n    raw = re.sub(r'\\\
          s*```$', '', raw)\n    if not raw:\n        return {}\n    try:\n      \
          \  data = json.loads(raw)\n        return data if isinstance(data, dict)\
          \ else {}\n    except Exception:\n        pass\n    m = re.search(r'\\{[\\\
          s\\S]*\\}', raw)\n    if m:\n        try:\n            data = json.loads(m.group(0))\n\
          \            return data if isinstance(data, dict) else {}\n        except\
          \ Exception:\n            pass\n    return {}\n\n\ndef main(llm_text: str\
          \ = '', question: str = '') -> dict:\n    data = _extract_json(llm_text)\n\
          \    normalized_question = str(data.get('normalized_question') or '').strip()\n\
          \    if not normalized_question:\n        normalized_question = str(question\
          \ or '').strip()\n    normalized_question = re.sub(r'\\s+', ' ', normalized_question).strip()\n\
          \    if not normalized_question:\n        normalized_question = '当前问题表述不完整，请补充具体产品知识、销售话术或系统使用问题。'\n\
          \    return {'normalized_question': normalized_question}"
        code_language: python3
        desc: 解析归一化结果，保证输出字段稳定。
        outputs:
