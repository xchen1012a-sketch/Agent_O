    - data:
        code: "import re\n\ndef _clean(text: str) -> str:\n    t = str(text or '').strip()\n\
          \    t = re.sub(r'[\\s\\u3000]+', '', t)\n    t = re.sub(r'[。！？!?，,、~～…\\\
          .]+$', '', t)\n    return t.lower()\n\ndef main(normalized_question: str\
          \ = '', question: str = '') -> dict:\n    raw = _clean(normalized_question\
          \ or question)\n    if not raw:\n        return {'is_light_interaction':\
          \ 'no', 'interaction_type': 'none'}\n\n    greeting = {\n        '你好', '您好',\
          \ '哈喽', 'hello', 'hi', '嗨', '在吗', '在嘛', '在么', '有人吗', '在不在', '早上好', '下午好',\
          \ '晚上好'\n    }\n    thanks = {'谢谢', '多谢', '感谢', '谢了', '辛苦了', '麻烦了'}\n  \
          \  ack = {'好的', '好的收到', '收到', '明白了', '懂了', '知道了', 'ok', 'okay', '嗯嗯', '好滴'}\n\
          \    closing = {'再见', '拜拜', '先这样', '没有了', '没事了', '先到这', '先这样吧'}\n\n    interaction_type\
          \ = 'none'\n    if raw in greeting:\n        interaction_type = 'greeting'\n\
          \    elif raw in thanks:\n        interaction_type = 'thanks'\n    elif\
          \ raw in ack:\n        interaction_type = 'ack'\n    elif raw in closing:\n\
          \        interaction_type = 'closing'\n    elif len(raw) <= 8 and re.fullmatch(r'(你好啊|您好呀|哈喽呀|谢谢你|谢谢啦|好的呢|收到啦|拜拜啦)',\
          \ raw):\n        if '谢' in raw:\n            interaction_type = 'thanks'\n\
          \        elif '拜' in raw or '再见' in raw:\n            interaction_type =\
          \ 'closing'\n        elif '好' in raw or '收到' in raw:\n            interaction_type\
          \ = 'ack'\n        else:\n            interaction_type = 'greeting'\n\n\
          \    return {\n        'is_light_interaction': 'yes' if interaction_type\
          \ != 'none' else 'no',\n        'interaction_type': interaction_type\n \
          \   }"
        code_language: python3
        desc: 识别问候、致谢、简单确认、结束语等轻交互；只放宽这些，不放宽红线和数据边界。
        outputs:
