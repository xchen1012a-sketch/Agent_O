      source: invalid_result_builder
      sourceHandle: source
      target: end_invalid
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 接收 FastAPI 已查询完成的结构化结果，用于生成一句话总结、管理建议与前端展示文案
        selected: false
        title: 开始
        type: start
        variables:
        - label: 门店ID
          max_length: 64
          options: []
          required: true
          type: text-input
          variable: store_id
        - label: 查询类型（支持中文测试，后端也可直接传英文枚举）
          max_length: 64
          options:
          - 本月新人培训未完成
          - 培训未完成员工
          - 考试未完成员工
          - 低合规分员工
          - 陪练成绩下降员工
          - 最近高风险员工
          - 重点跟进员工
          - 高频提问某类知识点员工
          - 自定义数据查询
          required: true
          type: select
          variable: query_type
        - label: 原始用户问题（可选）
          max_length: 2000
          options: []
          required: false
          type: paragraph
          variable: user_query
        - label: 查询参数 JSON（后端传入，可选）
          max_length: 5000
          options: []
          required: false
          type: paragraph
          variable: params_json
        - label: 查询状态（支持中文测试，后端也可直接传英文状态）
