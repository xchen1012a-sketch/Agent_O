    - data:
        code: "import json\n\ndef main(\n    invalid_reason: str = \"\",\n    query_type:\
          \ str = \"\",\n    query_status: str = \"\"\n) -> dict:\n    invalid_reason\
          \ = str(invalid_reason or \"\").strip() or \"输入不完整，暂时无法生成稳定总结。\"\n    query_type\
          \ = str(query_type or \"\").strip()\n    query_status = str(query_status\
          \ or \"\").strip()\n\n    summary = \"当前查询结果输入无效，未进入总结生成。\"\n    manager_advice\
          \ = \"请检查 FastAPI 返回字段是否完整，至少保证 query_type、query_status、result_count、result_json\
          \ 正确。\"\n    user_visible_output = f\"{summary} 原因：{invalid_reason}\"\n\n\
          \    safe_output = {\n        \"workflow_status\": \"failed\",\n       \
          \ \"query_type\": query_type,\n        \"result_count\": 0,\n        \"\
          summary\": summary,\n        \"manager_advice\": manager_advice,\n     \
          \   \"focus_names\": [],\n        \"display_tags\": [\"输入无效\", \"需检查接口\"\
          ],\n        \"user_visible_output\": user_visible_output,\n        \"query_status\"\
          : query_status\n    }\n\n    return {\n        \"workflow_status\": \"failed\"\
          ,\n        \"query_type\": query_type,\n        \"result_count\": 0,\n \
          \       \"summary\": summary,\n        \"manager_advice\": manager_advice,\n\
          \        \"focus_names_json\": \"[]\",\n        \"display_tags_json\": json.dumps([\"\
          输入无效\", \"需检查接口\"], ensure_ascii=False),\n        \"user_visible_output\"\
          : user_visible_output,\n        \"confidence_level\": \"high\",\n      \
          \  \"raw_output\": \"\",\n        \"safe_output_json\": json.dumps(safe_output,\
          \ ensure_ascii=False)\n    }"
