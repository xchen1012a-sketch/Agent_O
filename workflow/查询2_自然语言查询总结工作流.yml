          type: select
          variable: query_status
        - label: 结果数量（可选，未传时可自动估算）
          max_length: 32
          options: []
          required: false
          type: number
          variable: result_count
        - label: 查询结果 JSON（后端传入，可选）
          max_length: 12000
          options: []
          required: false
          type: paragraph
          variable: result_json
        - label: 异常信息（可选，query_status=异常 时建议传入）
          max_length: 2000
          options: []
          required: false
          type: paragraph
          variable: error_message
