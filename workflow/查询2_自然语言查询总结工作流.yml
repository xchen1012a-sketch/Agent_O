    - data:
        code: "import json\nimport re\n\ndef _extract_json(text: str) -> dict:\n \
          \   raw = str(text or \"\").strip()\n    if not raw:\n        return {}\n\
          \    raw = re.sub(r\"<think>[\\s\\S]*?</think>\", \"\", raw, flags=re.I)\n\
          \    raw = re.sub(r\"^```json\\s*\", \"\", raw, flags=re.I)\n    raw = re.sub(r\"\
          ^```\\s*\", \"\", raw)\n    raw = re.sub(r\"\\s*```$\", \"\", raw)\n   \
          \ raw = raw.strip()\n    try:\n        data = json.loads(raw)\n        return\
          \ data if isinstance(data, dict) else {}\n    except Exception:\n      \
          \  pass\n    m = re.search(r\"\\{[\\s\\S]*\\}\", raw)\n    if m:\n     \
          \   try:\n            data = json.loads(m.group(0))\n            return\
          \ data if isinstance(data, dict) else {}\n        except Exception:\n  \
          \          pass\n    return {}\n\ndef _ensure_list(v):\n    if isinstance(v,\
          \ list):\n        return [str(x).strip() for x in v if str(x).strip()]\n\
          \    if isinstance(v, str) and v.strip():\n        return [v.strip()]\n\
          \    return []\n\ndef _safe_text(v, default=\"\"):\n    if v is None:\n\
          \        return default\n    s = str(v).strip()\n    return s if s else\
          \ default\n\ndef main(\n    query_type: str = \"\",\n    query_status: str\
          \ = \"success\",\n    result_count = 0,\n    raw_output: str = \"\"\n) ->\
          \ dict:\n    data = _extract_json(raw_output)\n    try:\n        result_count\
          \ = int(round(float(result_count)))\n    except Exception:\n        result_count\
          \ = 0\n    result_count = max(0, result_count)\n    query_status = str(query_status\
          \ or \"success\").strip().lower()\n    if query_status not in {\"success\"\
          , \"empty\", \"error\"}:\n        query_status = \"success\"\n\n    default_summary_map\
          \ = {\n        \"success\": \"已完成查询结果总结。\",\n        \"empty\": \"当前条件下没有查到匹配结果。\"\
          ,\n        \"error\": \"当前没有拿到稳定结果。\",\n    }\n    default_advice_map =\
          \ {\n        \"success\": \"建议管理者结合结果继续跟进。\",\n        \"empty\": \"建议调整时间范围、门店或指标后重试。\"\
          ,\n        \"error\": \"建议稍后重试，或换个更具体的问法。\",\n    }\n\n    summary = _safe_text(data.get(\"\
          summary\"), default_summary_map.get(query_status, \"已完成查询结果总结。\"))\n   \
          \ manager_advice = _safe_text(data.get(\"manager_advice\"), default_advice_map.get(query_status,\
          \ \"建议管理者结合结果继续跟进。\"))\n    focus_names = _ensure_list(data.get(\"focus_names\"\
          ))\n    display_tags = _ensure_list(data.get(\"display_tags\"))\n    user_visible_output\
          \ = _safe_text(data.get(\"user_visible_output\"), summary)\n    confidence\
          \ = _safe_text(data.get(\"confidence\"), \"medium\").lower()\n    if confidence\
          \ not in {\"high\", \"medium\", \"low\"}:\n        confidence = \"medium\"\
          \n\n    safe_output = {\n        \"workflow_status\": query_status,\n  \
          \      \"query_type\": query_type,\n        \"result_count\": result_count,\n\
          \        \"summary\": summary,\n        \"manager_advice\": manager_advice,\n\
          \        \"focus_names\": focus_names,\n        \"display_tags\": display_tags,\n\
          \        \"user_visible_output\": user_visible_output,\n        \"confidence\"\
          : confidence\n    }\n\n    return {\n        \"workflow_status\": query_status,\n\
          \        \"query_type\": query_type,\n        \"result_count\": result_count,\n\
          \        \"summary\": summary,\n        \"manager_advice\": manager_advice,\n\
          \        \"focus_names_json\": json.dumps(focus_names, ensure_ascii=False),\n\
          \        \"display_tags_json\": json.dumps(display_tags, ensure_ascii=False),\n\
          \        \"user_visible_output\": user_visible_output,\n        \"confidence_level\"\
          : confidence,\n        \"raw_output\": str(raw_output or \"\"),\n      \
          \  \"safe_output_json\": json.dumps(safe_output, ensure_ascii=False)\n \
          \   }"
