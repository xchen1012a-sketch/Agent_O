    - data:
        code: "import json\nimport re\n\nALLOWED_QUERY_TYPES = {\n    \"training_unfinished_newcomer\"\
          ,\n    \"training_incomplete_staff\",\n    \"assessment_incomplete_staff\",\n    \"generic_sql\",\n    \"low_compliance_staff\",\n    \"practice_decline_staff\",\n    \"\
          recent_high_risk_staff\",\n    \"followup_priority_staff\",\n    \"high_freq_knowledge_tag_staff\"\
          ,\n}\n\nQUERY_TYPE_MAP = {\n    \"training_unfinished_newcomer\": \"training_unfinished_newcomer\"\
          ,\n    \"本月新人培训未完成\": \"training_unfinished_newcomer\",\n    \"新人培训未完成\"\
          : \"training_unfinished_newcomer\",\n    \"training_incomplete_staff\": \"training_incomplete_staff\",\n    \"培训未完成员工\": \"training_incomplete_staff\",\n    \"员工培训未完成\": \"training_incomplete_staff\",\n    \"assessment_incomplete_staff\": \"assessment_incomplete_staff\",\n    \"考试未完成员工\": \"assessment_incomplete_staff\",\n    \"考核未完成员工\": \"assessment_incomplete_staff\",\n    \"待考试员工\": \"assessment_incomplete_staff\",\n    \"待补考员工\": \"assessment_incomplete_staff\",\n    \"generic_sql\": \"generic_sql\",\n    \"自定义数据查询\": \"generic_sql\",\n    \"通用数据查询\": \"generic_sql\",\n\n    \"low_compliance_staff\": \"\
          low_compliance_staff\",\n    \"低合规分员工\": \"low_compliance_staff\",\n   \
          \ \"合规分低员工\": \"low_compliance_staff\",\n\n    \"practice_decline_staff\"\
          : \"practice_decline_staff\",\n    \"陪练成绩下降员工\": \"practice_decline_staff\"\
          ,\n    \"陪练下降员工\": \"practice_decline_staff\",\n\n    \"recent_high_risk_staff\"\
          : \"recent_high_risk_staff\",\n    \"最近高风险员工\": \"recent_high_risk_staff\"\
          ,\n    \"高风险员工\": \"recent_high_risk_staff\",\n\n    \"followup_priority_staff\"\
          : \"followup_priority_staff\",\n    \"重点跟进员工\": \"followup_priority_staff\"\
          ,\n    \"需要重点跟进员工\": \"followup_priority_staff\",\n\n    \"high_freq_knowledge_tag_staff\"\
          : \"high_freq_knowledge_tag_staff\",\n    \"高频提问某类知识点员工\": \"high_freq_knowledge_tag_staff\"\
          ,\n    \"高频提问知识点员工\": \"high_freq_knowledge_tag_staff\",\n}\n\nQUERY_STATUS_MAP\
          \ = {\n    \"success\": \"success\",\n    \"成功\": \"success\",\n    \"ok\"\
          : \"success\",\n\n    \"empty\": \"empty\",\n    \"空结果\": \"empty\",\n \
          \   \"无结果\": \"empty\",\n\n    \"error\": \"error\",\n    \"异常\": \"error\"\
          ,\n    \"失败\": \"error\",\n}\n\ndef _clean(v):\n    return str(v or \"\"\
          ).strip()\n\ndef _extract_json(text: str):\n    raw = _clean(text)\n   \
          \ if not raw:\n        return None\n\n    raw = re.sub(r\"<think>[\\s\\\
          S]*?</think>\", \"\", raw, flags=re.I)\n    raw = re.sub(r\"^```json\\s*\"\
          , \"\", raw, flags=re.I)\n    raw = re.sub(r\"^```\\s*\", \"\", raw)\n \
          \   raw = re.sub(r\"\\s*```$\", \"\", raw)\n    raw = raw.strip()\n\n  \
          \  if not raw:\n        return None\n\n    try:\n        return json.loads(raw)\n\
          \    except Exception:\n        pass\n\n    m = re.search(r\"(\\{[\\s\\\
          S]*\\}|\\[[\\s\\S]*\\])\", raw)\n    if m:\n        try:\n            return\
          \ json.loads(m.group(1))\n        except Exception:\n            pass\n\n\
          \    return None\n\ndef _safe_int(v, default=0):\n    try:\n        return\
          \ int(round(float(v)))\n    except Exception:\n        return default\n\n\
          def _extract_result_list(obj):\n    if obj is None:\n        return []\n\
          \    if isinstance(obj, list):\n        return obj\n    if isinstance(obj,\
          \ dict):\n        for k in [\"rows\", \"items\", \"records\", \"data\",\
          \ \"list\"]:\n            val = obj.get(k)\n            if isinstance(val,\
          \ list):\n                return val\n        return [obj] if obj else []\n\
          \    return []\n\ndef _preview_json(obj, limit=10):\n    try:\n        if\
          \ isinstance(obj, list):\n            return json.dumps(obj[:limit], ensure_ascii=False)\n\
          \        if isinstance(obj, dict):\n            clipped = obj.copy()\n \
          \           for k in [\"rows\", \"items\", \"records\", \"data\", \"list\"\
          ]:\n                if isinstance(clipped.get(k), list):\n             \
          \       clipped[k] = clipped[k][:limit]\n            return json.dumps(clipped,\
          \ ensure_ascii=False)\n        return json.dumps(obj, ensure_ascii=False)\n\
          \    except Exception:\n        return \"[]\"\n\ndef main(\n    store_id:\
          \ str = \"\",\n    query_type: str = \"\",\n    user_query: str = \"\",\n\
          \    params_json: str = \"\",\n    query_status: str = \"\",\n    result_count\
          \ = 0,\n    result_json: str = \"\",\n    error_message: str = \"\"\n) ->\
          \ dict:\n    store_id = _clean(store_id)\n    query_type_raw = _clean(query_type)\n\
          \    user_query = _clean(user_query)\n    query_status_raw = _clean(query_status)\n\
          \    error_message = _clean(error_message)\n\n    params_obj = _extract_json(params_json)\n\
          \    result_obj = _extract_json(result_json)\n\n    query_type = QUERY_TYPE_MAP.get(query_type_raw,\
          \ query_type_raw)\n    query_status = QUERY_STATUS_MAP.get(\n        query_status_raw.lower(),\n\
          \        QUERY_STATUS_MAP.get(query_status_raw, query_status_raw.lower())\n\
          \    )\n    if query_status not in {\"success\", \"empty\", \"error\"}:\n\
          \        query_status = \"success\"\n\n    if params_obj is None:\n    \
          \    params_obj = {}\n    if not isinstance(params_obj, dict):\n       \
          \ params_obj = {\"原始参数\": params_obj}\n\n    result_list = _extract_result_list(result_obj)\n\
          \    actual_count = len(result_list)\n    declared_count = _safe_int(result_count,\
          \ -1)\n\n    if query_status == \"empty\":\n        normalized_result_count\
          \ = 0\n        result_list = []\n    elif result_obj is not None:\n    \
          \    normalized_result_count = actual_count\n    else:\n        normalized_result_count\
          \ = max(0, declared_count)\n\n    has_result = 1 if normalized_result_count\
          \ > 0 else 0\n\n    input_valid = 1\n    invalid_reason = \"\"\n\n    if\
          \ not store_id:\n        input_valid = 0\n        invalid_reason = \"缺少门店ID。\"\
          \n    elif query_type not in ALLOWED_QUERY_TYPES:\n        input_valid =\
          \ 0\n        invalid_reason = \"查询类型不在模块5支持范围内。\"\n\n    query_type_label_map\
          \ = {\n        \"training_unfinished_newcomer\": \"本月新人培训未完成\",\n      \
          \  \"training_incomplete_staff\": \"培训未完成员工\",\n        \"assessment_incomplete_staff\": \"考试未完成员工\",\n        \"generic_sql\": \"自定义数据查询\",\n        \"low_compliance_staff\": \"低合规分员工\",\n        \"practice_decline_staff\"\
          : \"陪练成绩下降员工\",\n        \"recent_high_risk_staff\": \"最近高风险员工\",\n    \
          \    \"followup_priority_staff\": \"重点跟进员工\",\n        \"high_freq_knowledge_tag_staff\"\
          : \"高频提问某类知识点员工\"\n    }\n    query_status_label_map = {\n        \"success\"\
          : \"成功\",\n        \"empty\": \"空结果\",\n        \"error\": \"异常\"\n    }\n\
          \n    query_type_label = query_type_label_map.get(query_type, query_type_raw\
          \ or query_type)\n    query_status_label = query_status_label_map.get(query_status,\
          \ query_status_raw or query_status)\n\n    normalized_result_list_json =\
          \ json.dumps(result_list, ensure_ascii=False)\n    normalized_result_preview_json\
          \ = _preview_json(result_list)\n\n    normalized_card = f\"\"\"【查询基础信息】\n\
          门店ID：{store_id or '未提供'}\n查询类型枚举：{query_type}\n查询类型说明：{query_type_label}\n\
          原始用户问题：{user_query or '未提供'}\n查询状态：{query_status_label}\n\n【查询参数】\n{json.dumps(params_obj,\
          \ ensure_ascii=False)}\n\n【查询结果】\n结果数量：{normalized_result_count}\n是否有结果：{'是'\
          \ if has_result == 1 else '否'}\n结果明细：{normalized_result_preview_json}\n\n\
          【异常信息】\n{error_message or '无'}\"\"\"\n\n    return {\n        \"input_valid\"\
          : input_valid,\n        \"invalid_reason\": invalid_reason,\n        \"\
          normalized_query_type\": query_type,\n        \"normalized_query_type_label\"\
          : query_type_label,\n        \"normalized_user_query\": user_query,\n  \
          \      \"normalized_query_status\": query_status,\n        \"normalized_query_status_label\"\
          : query_status_label,\n        \"normalized_result_count\": normalized_result_count,\n\
          \        \"has_result\": has_result,\n        \"normalized_result_list_json\"\
          : normalized_result_list_json,\n        \"normalized_result_json\": normalized_result_preview_json,\n\
          \        \"normalized_params_json\": json.dumps(params_obj, ensure_ascii=False),\n\
          \        \"normalized_card\": normalized_card\n    }\n"
        code_language: python3
        desc: 解析 FastAPI 返回内容，兼容中文/英文输入，统一标准化字段
