    - data:
        code: "import json\nimport re\n\ndef _strip_code_fence(text: str) -> str:\n\
          \    text = str(text or \"\").strip()\n    text = re.sub(r\"^```json\\s*\"\
          , \"\", text, flags=re.IGNORECASE)\n    text = re.sub(r\"^```\\s*\", \"\"\
          , text)\n    text = re.sub(r\"\\s*```$\", \"\", text)\n    return text.strip()\n\
          \ndef _extract_json(text: str) -> dict:\n    cleaned = _strip_code_fence(text)\n\
          \    try:\n        return json.loads(cleaned)\n    except Exception:\n \
          \       pass\n\n    match = re.search(r\"\\{[\\s\\S]*\\}\", cleaned)\n \
          \   if match:\n        try:\n            return json.loads(match.group(0))\n\
          \        except Exception:\n            pass\n    return {}\n\ndef _to_str(value,\
          \ default=\"\"):\n    if value is None:\n        return default\n    if\
          \ isinstance(value, (dict, list)):\n        try:\n            return json.dumps(value,\
          \ ensure_ascii=False)\n        except Exception:\n            return default\n\
          \    value = str(value).strip()\n    return value if value else default\n\
          \ndef _to_list_str(value):\n    if value is None:\n        return []\n \
          \   if isinstance(value, list):\n        arr = []\n        for item in value:\n\
          \            s = str(item).strip()\n            if s:\n                arr.append(s)\n\
          \        return arr\n\n    text = str(value).strip()\n    if not text:\n\
          \        return []\n    parts = re.split(r\"[,\\n，；;|]+\", text)\n    arr\
          \ = []\n    for item in parts:\n        item = item.strip()\n        if\
          \ item:\n            arr.append(item)\n    return arr\n\ndef _to_bool(value,\
          \ default=False):\n    if isinstance(value, bool):\n        return value\n\
          \    if value is None:\n        return default\n    text = str(value).strip().lower()\n\
          \    if text in {\"true\", \"1\", \"yes\", \"y\", \"是\"}:\n        return\
          \ True\n    if text in {\"false\", \"0\", \"no\", \"n\", \"否\"}:\n     \
          \   return False\n    return default\n\ndef _to_int(value, default=0):\n\
          \    try:\n        return int(float(value))\n    except Exception:\n   \
          \     return default\n\ndef _clamp(n, low, high):\n    return max(low, min(high,\
          \ n))\n\ndef main(text: str) -> dict:\n    data = _extract_json(text)\n\n\
          \    allowed_question_type = {\"咨询型\", \"异议型\", \"比较型\", \"犹豫型\", \"风险型\"\
          , \"售后型\", \"其他\"}\n    allowed_customer_intent = {\"想了解\", \"想比价\", \"\
          想确认真假\", \"想压价\", \"想拖延决策\", \"想确认适配\", \"想了解售后\", \"想建立信任\", \"其他\"}\n\
          \    allowed_knowledge_tag = {\"材质真假\", \"价格异议\", \"证书鉴定\", \"工艺卖点\", \"\
          保养售后\", \"保值收藏\", \"款式推荐\", \"赠礼送礼\", \"尺寸佩戴\", \"活动促销\", \"品牌信任\", \"其他\"\
          }\n    allowed_scene_stage = {\"需求沟通\", \"产品介绍\", \"异议处理\", \"信任建立\", \"\
          成交推进\", \"售后解释\", \"其他\"}\n    allowed_strength = {\"low\", \"medium\",\
          \ \"high\"}\n    allowed_risk = {\"low\", \"medium\", \"high\"}\n    allowed_compliance\
          \ = {\"safe\", \"caution\", \"high_risk\"}\n    allowed_weak_dimension =\
          \ {\"产品知识\", \"价格应对\", \"需求挖掘\", \"信任建立\", \"合规表达\", \"成交推进\", \"售后说明\"\
          , \"服务礼仪\"}\n    allowed_weak_severity = {\"low\", \"medium\", \"high\"\
          }\n    allowed_action = {\"加强知识补学\", \"增加陪练次数\", \"加强合规训练\", \"增加异议处理训练\"\
          , \"增加成交推进训练\", \"持续观察\"}\n\n    question_type = _to_str(data.get(\"question_type\"\
          ), \"其他\")\n    if question_type not in allowed_question_type:\n       \
          \ question_type = \"其他\"\n\n    customer_intent = _to_str(data.get(\"customer_intent\"\
          ), \"其他\")\n    if customer_intent not in allowed_customer_intent:\n   \
          \     customer_intent = \"其他\"\n\n    knowledge_tag = _to_str(data.get(\"\
          knowledge_tag\"), \"其他\")\n    if knowledge_tag not in allowed_knowledge_tag:\n\
          \        knowledge_tag = \"其他\"\n\n    knowledge_subtag = _to_str(data.get(\"\
          knowledge_subtag\"), \"未细分\")\n\n    scene_stage = _to_str(data.get(\"scene_stage\"\
          ), \"其他\")\n    if scene_stage not in allowed_scene_stage:\n        scene_stage\
          \ = \"其他\"\n\n    objection_strength = _to_str(data.get(\"objection_strength\"\
          ), \"low\")\n    if objection_strength not in allowed_strength:\n      \
          \  objection_strength = \"low\"\n\n    risk_level = _to_str(data.get(\"\
          risk_level\"), \"low\")\n    if risk_level not in allowed_risk:\n      \
          \  risk_level = \"low\"\n\n    compliance_tag = _to_str(data.get(\"compliance_tag\"\
          ), \"safe\")\n    if compliance_tag not in allowed_compliance:\n       \
          \ compliance_tag = \"safe\"\n\n    risk_points = _to_list_str(data.get(\"\
          risk_points\"))\n\n    weak_dimension = _to_str(data.get(\"weak_dimension\"\
          ), \"产品知识\")\n    if weak_dimension not in allowed_weak_dimension:\n   \
          \     weak_dimension = \"产品知识\"\n\n    weak_severity = _to_str(data.get(\"\
          weak_severity\"), \"low\")\n    if weak_severity not in allowed_weak_severity:\n\
          \        weak_severity = \"low\"\n\n    weak_reason = _to_str(data.get(\"\
          weak_reason\"), \"需继续观察具体薄弱原因。\")\n    followup_training_topic = _to_str(data.get(\"\
          followup_training_topic\"), \"通用接待训练\")\n    followup_training_advice =\
          \ _to_str(\n        data.get(\"followup_training_advice\"),\n        \"\
          建议围绕该问题对应知识点进行补学，并补充一次针对性场景陪练。\"\n    )\n\n    recommended_action = _to_str(data.get(\"\
          recommended_action\"), \"持续观察\")\n    if recommended_action not in allowed_action:\n\
          \        recommended_action = \"持续观察\"\n\n    internal_tags = _to_list_str(data.get(\"\
          internal_tags\"))\n    manager_attention_needed = _to_bool(data.get(\"manager_attention_needed\"\
          ), False)\n    training_priority_score = _to_int(data.get(\"training_priority_score\"\
          ), 0)\n    ability_update_hint = _to_str(\n        data.get(\"ability_update_hint\"\
          ),\n        \"建议将本次问题记录为后续训练依据，并持续观察对应能力维度。\"\n    )\n    record_summary\
          \ = _to_str(\n        data.get(\"record_summary\"),\n        \"已记录本次客户问题，待纳入训练分析。\"\
          \n    )\n\n    if not internal_tags:\n        internal_tags = [\"在岗助手\"\
          , knowledge_tag, weak_dimension, risk_level]\n\n    internal_tags = [x for\
          \ x in internal_tags if x][:8]\n\n    # 若模型未给出合理分数，则自动估算训练优先级\n    if training_priority_score\
          \ <= 0:\n        base = 20\n        if weak_severity == \"medium\":\n  \
          \          base += 20\n        elif weak_severity == \"high\":\n       \
          \     base += 35\n\n        if risk_level == \"medium\":\n            base\
          \ += 15\n        elif risk_level == \"high\":\n            base += 30\n\n\
          \        if compliance_tag == \"caution\":\n            base += 10\n   \
          \     elif compliance_tag == \"high_risk\":\n            base += 20\n\n\
          \        if question_type in {\"异议型\", \"风险型\", \"比较型\"}:\n            base\
          \ += 10\n\n        training_priority_score = _clamp(base, 0, 100)\n\n  \
          \  # 风险高时自动提升管理关注\n    if risk_level == \"high\" or compliance_tag == \"\
          high_risk\" or weak_severity == \"high\":\n        manager_attention_needed\
          \ = True\n\n    result = {\n        \"question_type\": question_type,\n\
          \        \"customer_intent\": customer_intent,\n        \"knowledge_tag\"\
          : knowledge_tag,\n        \"knowledge_subtag\": knowledge_subtag,\n    \
          \    \"scene_stage\": scene_stage,\n        \"objection_strength\": objection_strength,\n\
          \        \"risk_level\": risk_level,\n        \"compliance_tag\": compliance_tag,\n\
          \        \"risk_points\": risk_points,\n        \"weak_dimension\": weak_dimension,\n\
          \        \"weak_severity\": weak_severity,\n        \"weak_reason\": weak_reason,\n\
          \        \"followup_training_topic\": followup_training_topic,\n       \
          \ \"followup_training_advice\": followup_training_advice,\n        \"recommended_action\"\
          : recommended_action,\n        \"internal_tags\": internal_tags,\n     \
          \   \"manager_attention_needed\": manager_attention_needed,\n        \"\
          training_priority_score\": training_priority_score,\n        \"ability_update_hint\"\
          : ability_update_hint,\n        \"record_summary\": record_summary\n   \
          \ }\n\n    return {\n        **result,\n        \"analysis_json\": json.dumps(result,\
          \ ensure_ascii=False)\n    }\n"
        code_language: python3
        desc: 解析 LLM JSON，做值域规范化、优先级兜底、布尔值纠正、标签补全
