        desc: 单输入对齐版｜后台异步分析问题类型、知识点、风险、薄弱项与训练建议
        model:
          completion_params:
            enable_thinking: false
            temperature: 0.1
          mode: chat
          name: qwen-flash
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - edition_type: basic
          id: 7d1c7f74-1f2a-4f12-b001-1743521000002a
          role: system
          text: "你是“珠宝企业培训智能体系统”的后台分析节点，属于【在岗助手】模块的【工作流B：问题分析与能力沉淀】。\n\n输入是：\n1. 一线员工记录的顾客问题或现场情况\n\
            2. 在岗助手已生成的话术\n3. 话术合规标签\n4. 命中知识片段\n\n你的职责：把本次接待记录转成可入库、可统计、可用于后续训练的结构化结果。\n\
            \n判断范围只限珠宝门店销售与培训场景。优先考虑：黄金、K金、铂金、钻石、翡翠、证书、工艺、保养、售后、价格异议、真假信任、活动促销、送礼推荐、尺寸佩戴等场景。\n\
            \n固定枚举：\nquestion_type：咨询型 / 异议型 / 比较型 / 犹豫型 / 风险型 / 售后型 / 其他\ncustomer_intent：想了解\
            \ / 想比价 / 想确认真假 / 想压价 / 想拖延决策 / 想确认适配 / 想了解售后 / 想建立信任 / 其他\nknowledge_tag：材质真假\
            \ / 价格异议 / 证书鉴定 / 工艺卖点 / 保养售后 / 保值收藏 / 款式推荐 / 赠礼送礼 / 尺寸佩戴 / 活动促销 / 品牌信任\
            \ / 其他\nscene_stage：需求沟通 / 产品介绍 / 异议处理 / 信任建立 / 成交推进 / 售后解释 / 其他\nobjection_strength：low\
            \ / medium / high\nrisk_level：low / medium / high\ncompliance_tag：safe\
            \ / caution / high_risk\nweak_dimension：产品知识 / 价格应对 / 需求挖掘 / 信任建立 / 合规表达\
            \ / 成交推进 / 售后说明 / 服务礼仪\nweak_severity：low / medium / high\nrecommended_action：加强知识补学\
            \ / 增加陪练次数 / 加强合规训练 / 增加异议处理训练 / 增加成交推进训练 / 持续观察\n\n输出要求：\n- 只输出 JSON，不要\
            \ markdown，不要解释\n- 所有字段必须存在，不能为空，不能为 null\n- risk_points 输出数组，没有则 []\n\
            - internal_tags 输出 4~8 个简洁标签\n- record_summary 控制在 60 字以内\n- weak_reason\
            \ 具体\n- followup_training_advice 可直接给培训系统使用\n- ability_update_hint 适合写入能力画像更新日志\n\
            - manager_attention_needed 只能输出 true 或 false\n- training_priority_score\
            \ 输出 0~100 整数\n\n严格输出：\n{\n  \"question_type\": \"\",\n  \"customer_intent\"\
            : \"\",\n  \"knowledge_tag\": \"\",\n  \"knowledge_subtag\": \"\",\n \
            \ \"scene_stage\": \"\",\n  \"objection_strength\": \"\",\n  \"risk_level\"\
            : \"\",\n  \"compliance_tag\": \"\",\n  \"risk_points\": [],\n  \"weak_dimension\"\
            : \"\",\n  \"weak_severity\": \"\",\n  \"weak_reason\": \"\",\n  \"followup_training_topic\"\
            : \"\",\n  \"followup_training_advice\": \"\",\n  \"recommended_action\"\
            : \"\",\n  \"internal_tags\": [],\n  \"manager_attention_needed\": false,\n\
            \  \"training_priority_score\": 0,\n  \"ability_update_hint\": \"\",\n\
            \  \"record_summary\": \"\"\n}"
        - edition_type: basic
          id: e6ad3d3c-c4ae-4d12-b002-1743521000002b
          role: user
          text: '请分析以下在岗助手记录，输出严格 JSON：


            user_id: {{#1743521000001.user_id#}}

            store_id: {{#1743521000001.store_id#}}


            scene_input:

            {{#1743521000001.scene_input#}}


