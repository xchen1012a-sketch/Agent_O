            {{#1743521000001.assistant_reply#}}


            reply_compliance_tag:

            {{#1743521000001.reply_compliance_tag#}}


            matched_knowledge:

            {{#1743521000001.matched_knowledge#}}'
        selected: true
        title: 问题分析与能力沉淀
        type: llm
        variables: []
        vision:
          enabled: false
      height: 132
      id: '1743521000002'
