          \ or \"\").strip()\n\n    params = _parse_json(final_params_json, {})\n\
          \    if not isinstance(params, dict):\n        params = {}\n\n    payload\
          \ = _parse_json(fastapi_payload_json, {})\n    if not isinstance(payload,\
          \ dict):\n        payload = {}\n\n    normalized = {\n        \"time_range\"\
          : str(params.get(\"time_range\") or \"unspecified\"),\n        \"threshold_op\"\
          : str(params.get(\"threshold_op\") or \"unspecified\"),\n        \"threshold_value\"\
          : int(params.get(\"threshold_value\") or 0),\n        \"trend_direction\"\
