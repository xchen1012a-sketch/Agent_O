          \n    if \"最近\" in q or \"近期\" in q:\n        return \"recent_30d\"\n  \
          \  return \"unspecified\"\n\ndef main(final_query_type: str = \"\",\n  \
          \       final_params_json: str = \"{}\",\n         fastapi_payload_json:\
