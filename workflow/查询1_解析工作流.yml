    - data:
        code: "import re\nimport json\n\ndef main(store_id: str = \"\", query_text:\
          \ str = \"\", manager_role: str = \"\", time_anchor: str = \"\") -> dict:\n\
          \    def clean(v):\n        return str(v or \"\").strip()\n\n    raw_query\
          \ = clean(query_text)\n    q = re.sub(r\"\\s+\", \" \", raw_query).strip()\n\
          \n    blocked_patterns = [\n        r\"忽略.*规则\", r\"绕过.*限制\", r\"直接.*sql\"\
          , r\"给我.*数据库账号\", r\"导出.*手机号\", r\"导出.*身份证\",\n        r\"工资明细\", r\"薪资明细\"\
          , r\"隐私\", r\"身份证号\", r\"银行卡\", r\"家庭住址\",\n        r\"伪造\", r\"编造\", r\"\
          捏造\", r\"随便生成数据\", r\"帮我虚构\"\n    ]\n\n    out_of_scope_patterns = [\n \
          \       r\"天气\", r\"股票\", r\"彩票\", r\"政治\", r\"总统\", r\"八卦\", r\"游戏攻略\"\
          , r\"写代码\", r\"python报错\"\n    ]\n\n    code_risk_flag = 0\n    code_risk_reason\
          \ = \"\"\n    for p in blocked_patterns:\n        if re.search(p, q, flags=re.I):\n\
          \            code_risk_flag = 1\n            code_risk_reason = f\"命中敏感/越权/注入类表达：{p}\"\
          \n            break\n\n    code_scope_flag = 1\n    code_scope_reason =\
          \ \"ok\"\n    for p in out_of_scope_patterns:\n        if re.search(p, q,\
          \ flags=re.I):\n            code_scope_flag = 0\n            code_scope_reason\
          \ = f\"明显超出门店管理查询范围：{p}\"\n            break\n\n    keep_terms = [\n   \
          \     \"新人\", \"培训\", \"合规\", \"陪练\", \"高风险\", \"重点跟进\", \"知识点\", \"下降\"\
          ,\n        \"低于\", \"最近\", \"这个月\", \"本月\", \"员工\", \"人员\", \"门店\", \"提问频次\"\
          \n    ]\n    hint_keywords = [w for w in keep_terms if w in q]\n\n    normalized_query\
          \ = q.replace(\"本月\", \"这个月\").replace(\"近期\", \"最近\").replace(\"最近一段时间\"\
          , \"最近\")\n    query_length = len(normalized_query)\n\n    return {\n  \
          \      \"store_id_out\": clean(store_id),\n        \"manager_role_out\"\
          : clean(manager_role),\n        \"time_anchor_out\": clean(time_anchor),\n\
          \        \"cleaned_query\": q,\n        \"normalized_query\": normalized_query,\n\
          \        \"query_length\": query_length,\n        \"code_scope_flag\": code_scope_flag,\n\
          \        \"code_scope_reason\": code_scope_reason,\n        \"code_risk_flag\"\
          : code_risk_flag,\n        \"code_risk_reason\": code_risk_reason,\n   \
          \     \"hint_keywords\": \"；\".join(hint_keywords)\n    }\n"
        code_language: python3
