          target_group\"] == \"unspecified\":\n            normalized[\"target_group\"\
          ] = \"all_staff\"\n\n    elif query_type == \"recent_high_risk_staff\":\n\
          \        if normalized[\"time_range\"] == \"unspecified\":\n           \
