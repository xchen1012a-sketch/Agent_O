          : str(params.get(\"risk_level\") or \"unspecified\"),\n        \"knowledge_tag\"\
          : str(params.get(\"knowledge_tag\") or \"\").strip(),\n        \"target_group\"\
          : str(params.get(\"target_group\") or \"unspecified\")\n    }\n\n    normalized[\"\
          time_range\"] = _infer_time_range(rewritten_query, normalized[\"time_range\"\
          ])\n\n    if query_type == \"training_unfinished_newcomer\":\n        if\
          \ normalized[\"time_range\"] == \"unspecified\":\n            normalized[\"\
          time_range\"] = \"this_month\"\n        normalized[\"target_group\"] = \"\
          newcomer\"\n\n    elif query_type == \"low_compliance_staff\":\n       \
          \ if normalized[\"threshold_op\"] == \"unspecified\":\n            normalized[\"\
          threshold_op\"] = \"lt\"\n        if normalized[\"threshold_value\"] <=\
          \ 0:\n            extracted = _extract_threshold(rewritten_query)\n    \
          \        normalized[\"threshold_value\"] = extracted if extracted > 0 else\
          \ 60\n        if normalized[\"target_group\"] == \"unspecified\":\n    \
          \        normalized[\"target_group\"] = \"all_staff\"\n\n    elif query_type\
          \ == \"practice_decline_staff\":\n        if normalized[\"time_range\"]\
          \ == \"unspecified\":\n            normalized[\"time_range\"] = \"recent_30d\"\
          \n        if normalized[\"trend_direction\"] == \"unspecified\":\n     \
