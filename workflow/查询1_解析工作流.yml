    - data:
        code: "import json\nimport re\n\ndef _parse_json(text: str, default):\n  \
          \  try:\n        obj = json.loads(str(text or \"\").strip())\n        return\
          \ obj\n    except Exception:\n        return default\n\ndef _extract_threshold(query:\
          \ str):\n    q = str(query or \"\")\n    m = re.search(r'低于\\s*(\\d{1,3})',\
