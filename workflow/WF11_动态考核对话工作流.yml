    - data:
        code: "def main(\n    task_id=\"\",\n    assessment_record_id=\"\",\n    user_id=\"\",\n    task_name=\"\",\n    customer_persona=\"\",\n    pass_score=85,\n    exam_mode=\"\",\n    duration_minutes=0,\n    score_visibility=\"\",\n    started_notice_text=\"\",\n    submitted_notice_text=\"\",\n    user_query=\"\",\n    **kwargs\n):\n    import re\n    import json\n\n    def clean(v):\n        return str(v or \"\").replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").strip()\n\n    def safe_int(v, default=0):\n        try:\n            return int(round(float(v)))\n        except Exception:\n            return default\n\n    def normalize_enum(v, allowed, default):\n        low = clean(v).lower()\n        return low if low in allowed else default\n\n    task_label = clean(task_name) or \"珠宝门店正式考核\"\n    persona_text = clean(customer_persona) or \"你是珠宝门店正式考试中的高要求顾客/考官。\"\n    normalized_query = re.sub(r\"\\s+\", \" \", clean(user_query)).strip()\n\n    task_id_out = clean(task_id)\n\
          \    assessment_record_id_out = clean(assessment_record_id)\n    user_id_out = clean(user_id)\n    started_notice_text_out = clean(started_notice_text)\n    submitted_notice_text_out = clean(submitted_notice_text)\n\n    pass_score_num = max(0, min(100, safe_int(pass_score, 85)))\n    duration_minutes_out = max(0, min(300, safe_int(duration_minutes, 60)))\n    if duration_minutes_out == 0:\n        duration_minutes_out = 60\n\n    exam_mode_out = normalize_enum(exam_mode, {\"ai_blind_box_exam\", \"paper_exam\"}, \"ai_blind_box_exam\")\n    score_visibility_out = normalize_enum(score_visibility, {\"public\", \"hidden\"}, \"public\")\n\n    opening_patterns = [\n        r\"^$\",\n        r\"^开始$\",\n        r\"^开始考试$\",\n        r\"^开始考核$\",\n        r\"^准备好了$\",\n        r\"^可以开始了$\",\n        r\"^开始吧$\",\n        r\"^来吧$\",\n        r\"^ok$\",\n        r\"^好的$\",\n    ]\n    current_input_type = \"answer\"\n    for p in opening_patterns:\n        if re.search(p, normalized_query,\
          \ flags=re.I):\n            current_input_type = \"opening\"\n            break\n\n    strict_finish_phrases = {\n        \"结束考试\",\n        \"提交试卷\",\n        \"交卷\",\n        \"结束考核\",\n    }\n\n    finish_flag = 0\n    finish_reason = \"\"\n    if normalized_query in strict_finish_phrases:\n        finish_flag = 1\n        finish_reason = \"命中明确交卷指令\"\n\n    if finish_flag == 0:\n        strong_intent_patterns = [\n            r\"^(我要)?结束考试[。！! ]*$\",\n            r\"^(我要)?提交试卷[。！! ]*$\",\n            r\"^(我要)?交卷[。！! ]*$\",\n            r\"^(我要)?结束考核[。！! ]*$\",\n        ]\n        for p in strong_intent_patterns:\n            if re.search(p, normalized_query):\n                finish_flag = 1\n                finish_reason = \"命中强结束意图\"\n                break\n\n    redline_patterns = [\n        (r\"保值|升值|一定升值|绝对保值|包你升值\", \"保值升值承诺\"),\n        (r\"全国最低价|全网最低价|最低价\", \"最低价承诺\"),\n        (r\"100%真|绝对保真|百分百真\", \"绝对保真\"),\n        (r\"假一赔十\", \"夸大售后承诺\"),\n        (r\"闭眼买\",\
          \ \"绝对化推荐\"),\n        (r\"稳赚不赔|稳赚\", \"收益承诺\"),\n        (r\"永不褪色|绝不会褪色\", \"绝对化质量承诺\"),\n        (r\"国家级证书|官方内部渠道保证\", \"无法核实背书\"),\n    ]\n\n    hit_tags = []\n    for pattern, label in redline_patterns:\n        if re.search(pattern, normalized_query):\n            hit_tags.append(label)\n\n    emotion_flag = 1 if re.search(r\"别买了|爱买不买|随便你|不买拉倒|你有病\", normalized_query) else 0\n    off_topic_flag = 1 if re.search(r\"写代码|做网站|股票|赌博|彩票|政治|总统|明星八卦\", normalized_query, flags=re.I) else 0\n\n    redline_flag = 1 if hit_tags else 0\n    redline_hits = json.dumps(hit_tags, ensure_ascii=False)\n\n    workflow_mode_hint = \"blind_box_supported\"\n    if exam_mode_out != \"ai_blind_box_exam\":\n        workflow_mode_hint = \"wf11_is_for_blind_box_exam_only\"\n\n    return {\n        \"task_id_out\": task_id_out,\n        \"assessment_record_id_out\": assessment_record_id_out,\n        \"user_id_out\": user_id_out,\n        \"task_label\": task_label,\n        \"persona_text\": persona_text,\n\
          \        \"normalized_query\": normalized_query,\n        \"current_input_type\": current_input_type,\n        \"finish_flag\": finish_flag,\n        \"finish_reason\": finish_reason,\n        \"pass_score_num\": pass_score_num,\n        \"exam_mode_out\": exam_mode_out,\n        \"duration_minutes_out\": duration_minutes_out,\n        \"score_visibility_out\": score_visibility_out,\n        \"started_notice_text_out\": started_notice_text_out,\n        \"submitted_notice_text_out\": submitted_notice_text_out,\n        \"redline_flag\": redline_flag,\n        \"redline_hits\": redline_hits,\n        \"emotion_flag\": emotion_flag,\n        \"off_topic_flag\": off_topic_flag,\n        \"workflow_mode_hint\": workflow_mode_hint,\n    }\n"
        code_language: python3
        desc: 标准化考试输入与后端元数据，严格识别结束词，并补充红线/跑题/情绪化表达识别。
