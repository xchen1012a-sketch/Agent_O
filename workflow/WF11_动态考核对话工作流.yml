    - data:
        code: "import json\nimport re\n\ndef _strip_code_fence(text: str) -> str:\n    raw = str(text or \"\").strip()\n    raw = re.sub(r\"<think>[\\s\\S]*?</think>\", \"\", raw, flags=re.I)\n    raw = re.sub(r\"^```json\\s*\", \"\", raw, flags=re.I)\n    raw = re.sub(r\"^```\\s*\", \"\", raw)\n    raw = re.sub(r\"\\s*```$\", \"\", raw)\n    return raw.strip()\n\ndef _extract_json(text: str) -> dict:\n    raw = _strip_code_fence(text)\n    if not raw:\n        return {}\n    try:\n        data = json.loads(raw)\n        return data if isinstance(data, dict) else {}\n    except Exception:\n        pass\n    m = re.search(r\"\\{[\\s\\S]*\\}\", raw)\n    if m:\n        try:\n            data = json.loads(m.group(0))\n            return data if isinstance(data, dict) else {}\n        except Exception:\n            pass\n    return {}\n\ndef _safe_int(v, default=0, low=None, high=None):\n    try:\n        n = int(round(float(v)))\n    except Exception:\n        n = default\n    if low is not\
          \ None:\n        n = max(low, n)\n    if high is not None:\n        n = min(high, n)\n    return n\n\ndef _safe_text(v, default=\"\"):\n    s = str(v or \"\").strip()\n    return s if s else default\n\ndef _safe_list(v):\n    if isinstance(v, list):\n        return [str(x).strip() for x in v if str(x).strip()]\n    if isinstance(v, str) and v.strip():\n        return [v.strip()]\n    return []\n\ndef _parse_redline_hits(v):\n    raw = str(v or \"\").strip()\n    if not raw:\n        return []\n    try:\n        data = json.loads(raw)\n        if isinstance(data, list):\n            return [str(x).strip() for x in data if str(x).strip()]\n    except Exception:\n        pass\n    return [raw]\n\ndef _normalize_risk_level(v):\n    s = str(v or \"\").strip().lower()\n    return s if s in {\"low\", \"medium\", \"high\"} else \"medium\"\n\ndef _normalize_dimension_scores(v):\n    default_keys = [\"需求洞察\", \"专业准确\", \"异议处理\", \"成交推进\", \"表达自然\", \"合规安全\"]\n    data = v if isinstance(v,\
          \ dict) else {}\n    out = {}\n    for k in default_keys:\n        out[k] = _safe_int(data.get(k, 60), 60, 0, 100)\n    return out\n\ndef main(\n    llm_text=\"\",\n    pass_score_num=85,\n    redline_flag=0,\n    redline_hits=\"\",\n    finish_reason=\"\",\n    exam_mode_out=\"ai_blind_box_exam\",\n    duration_minutes_out=60,\n    score_visibility_out=\"public\",\n    task_id_out=\"\",\n    assessment_record_id_out=\"\",\n    user_id_out=\"\",\n    submitted_notice_text_out=\"\",\n    started_notice_text_out=\"\",\n    dialogue_count=0\n) -> dict:\n    pass_line = _safe_int(pass_score_num, 85, 0, 100)\n    redline_flag = 1 if _safe_int(redline_flag, 0) >= 1 else 0\n    parsed_redline_hits = _parse_redline_hits(redline_hits)\n    data = _extract_json(llm_text)\n\n    score = _safe_int(data.get(\"score\"), 60, 0, 100)\n    is_pass = 1 if score >= pass_line else 0\n    risk_level = _normalize_risk_level(data.get(\"risk_level\"))\n    weak_dimension = _safe_text(data.get(\"weak_dimension\"\
          ), \"综合表达\")\n    problem_points = _safe_list(data.get(\"problem_points\"))[:5]\n    risk_tags = _safe_list(data.get(\"risk_tags\"))[:5]\n    improvement_advice = _safe_text(data.get(\"improvement_advice\"), \"建议补强异议处理、合规表达与成交推进。\")\n    dimension_scores = _normalize_dimension_scores(data.get(\"dimension_scores\"))\n\n    if redline_flag == 1:\n        if risk_level == \"low\":\n            risk_level = \"medium\"\n        if weak_dimension in {\"\", \"综合表达\"}:\n            weak_dimension = \"合规表达\"\n        for item in parsed_redline_hits:\n            if item and item not in problem_points:\n                problem_points.append(item)\n            if item and item not in risk_tags:\n                risk_tags.append(item)\n        problem_points = problem_points[:5]\n        risk_tags = risk_tags[:5]\n        if \"合规\" not in improvement_advice:\n            improvement_advice = \"建议专项补训合规表达、风险话术识别与高压异议处理。\"\n        dimension_scores[\"合规安全\"] = min(dimension_scores[\"合规安全\"],\
          \ 65)\n\n    reason = _safe_text(data.get(\"reason\"), \"评分结果已生成。\")\n    examiner_comment = _safe_text(\n        data.get(\"examiner_comment\") or data.get(\"comment\") or data.get(\"message\"),\n        \"本次考试已结束，请结合得分与评语做后续复盘。\"\n    )\n    if len(examiner_comment) < 20:\n        examiner_comment = f\"本次盲盒考试得分为{score}分，整体风险等级为{risk_level}，主要薄弱项为{weak_dimension}，建议结合问题点进行复盘与针对性补训。\"\n\n    payload = {\n        \"is_finished\": True,\n        \"submit_action\": \"finish_blind_box_exam\",\n        \"submit_status\": \"submitted\",\n        \"score\": score,\n        \"is_pass\": is_pass,\n        \"reason\": reason,\n        \"examiner_comment\": examiner_comment,\n        \"pass_flag\": is_pass,\n        \"pass_score_line\": pass_line,\n        \"risk_level\": risk_level,\n        \"weak_dimension\": weak_dimension,\n        \"problem_points\": problem_points,\n        \"improvement_advice\": improvement_advice,\n        \"risk_tags\": risk_tags,\n        \"dimension_scores\"\
          : dimension_scores,\n        \"finish_reason\": _safe_text(finish_reason, \"考试结束\"),\n        \"exam_mode\": _safe_text(exam_mode_out, \"ai_blind_box_exam\"),\n        \"duration_minutes\": _safe_int(duration_minutes_out, 60, 1, 300),\n        \"score_visibility\": _safe_text(score_visibility_out, \"public\"),\n        \"task_id\": _safe_text(task_id_out, \"\"),\n        \"assessment_record_id\": _safe_text(assessment_record_id_out, \"\"),\n        \"user_id\": _safe_text(user_id_out, \"\"),\n        \"started_notice_text\": _safe_text(started_notice_text_out, \"\"),\n        \"submitted_notice_text\": _safe_text(submitted_notice_text_out, \"\"),\n        \"redline_flag\": redline_flag,\n        \"redline_hits\": parsed_redline_hits,\n        \"dialogue_rounds_estimate\": _safe_int(dialogue_count, 0, 0, 999)\n    }\n\n    normalized_json = json.dumps(payload, ensure_ascii=False)\n    return {\"normalized_json\": normalized_json}\n"
