    - data:
        code: |
          def main(
              customer_text: str,
              user_query: str = "",
              current_round_count: int = 0,
              current_risk_hit_count: int = 0
          ) -> dict:
              import re

              text = (customer_text or "").strip()
              query = (user_query or "").strip()

              text = re.sub(
                  r"<(?:think|thinking|reasoning)>[\s\S]*?</(?:think|thinking|reasoning)>",
                  "",
                  text,
                  flags=re.IGNORECASE,
              )
              text = re.sub(
                  r"^\s*(?:思考(?:过程|如下)?|分析(?:如下)?|推理(?:过程|如下)?|内部思考|解题思路|思路|策略|计划|判断依据|回应策略|输出说明|说明|备注|reasoning|analysis|thought(?: process)?|internal(?: reasoning| thought)?|plan|strategy|note|notes)\s*[:：-].*$",
                  "",
                  text,
                  flags=re.IGNORECASE | re.MULTILINE,
              )
              text = re.sub(
                  r"^\s*(?:顾客|客户|客人|买家|消费者|Customer|Client)\s*[:：]\s*",
                  "",
                  text,
                  count=1,
                  flags=re.IGNORECASE,
              )
              text = "\n".join(line.strip() for line in text.splitlines() if line.strip()).strip()

              has_end = 1 if "[PRACTICE_END]" in text else 0

              risk_keywords = [
                  "保证升值", "一定升值", "绝对", "全国最低价", "最低价",
                  "绝对保真", "假一赔十", "永不褪色", "不会坏", "百分百"
              ]
              risk_hit = 1 if any(k in query for k in risk_keywords) else 0

              next_round_count = int(current_round_count or 0) + 1
              next_risk_hit_count = int(current_risk_hit_count or 0) + risk_hit
              next_opening_sent = 1
              next_stage = "finished" if has_end == 1 else "in_progress"
              next_end_flag = has_end

              return {
                  "reply_text": text,
                  "next_round_count": next_round_count,
                  "next_risk_hit_count": next_risk_hit_count,
                  "next_opening_sent": next_opening_sent,
                  "next_stage": next_stage,
                  "next_end_flag": next_end_flag,
                  "risk_hit_this_turn": risk_hit
              }
        code_language: python3
        desc: ''
        outputs:
          next_end_flag:
            type: number
          next_opening_sent:
            type: number
          next_risk_hit_count:
            type: number
          next_round_count:
            type: number
          next_stage:
            type: string
          reply_text:
            type: string
          risk_hit_this_turn:
            type: number
        selected: false
        title: 回合状态更新器
