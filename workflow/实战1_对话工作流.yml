    - data:
        code: |-
          def main(
              clean_query: str = "",
              module_code_out: str = "",
              module_name_out: str = "",
              module_missing_flag: int = 0,
              module_missing_reason: str = "",
              scenario_type_out: str = "",
              code_is_redline: int = 0,
              code_redline_types: str = "",
              code_redline_hits: str = "",
              code_off_topic: int = 0,
              is_end_command: int = 0,
              opening_sent: int = 0,
              end_flag: int = 0,
              current_round_count: int = 0,
              current_risk_hit_count: int = 0,
              llm_text: str = ""
          ) -> dict:
              import json
              import re

              def to_int(v, default=0):
                  try:
                      return int(v)
                  except Exception:
                      return default

              def clean(v):
                  return str(v or "").strip()

              def parse_json(text: str):
                  raw = clean(text)
                  if not raw:
                      return {}
                  match = re.search(r"\{[\s\S]*\}", raw)
                  raw = match.group(0) if match else raw
                  try:
                      data = json.loads(raw)
                      return data if isinstance(data, dict) else {}
                  except Exception:
                      return {}

              query = clean(clean_query)
              module_code = clean(module_code_out)
              module_name = clean(module_name_out)
              scenario = clean(scenario_type_out)
              round_count = to_int(current_round_count, 0)
              risk_hit_count = to_int(current_risk_hit_count, 0)

              parsed = parse_json(llm_text)
              llm_redline = to_int(parsed.get("llm_redline"), 0)
              llm_off_topic = to_int(parsed.get("llm_off_topic"), 0)
              llm_reason = clean(parsed.get("reason"))
              llm_confidence = clean(parsed.get("confidence")) or "medium"

              redline_types = []
              raw_types = clean(code_redline_types)
              if raw_types:
                  redline_types.extend([x.strip() for x in raw_types.split("；") if x.strip()])

              llm_types = parsed.get("risk_types") or []
              if isinstance(llm_types, list):
                  for item in llm_types:
                      s = str(item).strip()
                      if s and s not in redline_types:
                          redline_types.append(s)

              redline_hit = 1 if to_int(code_is_redline, 0) == 1 or llm_redline == 1 else 0
              off_topic_hit = 1 if to_int(code_off_topic, 0) == 1 or llm_off_topic == 1 else 0
              module_missing = 1 if to_int(module_missing_flag, 0) == 1 else 0

              should_continue = 1
              guard_reason = "allow"
              guard_reply = ""
              guard_stage = "in_progress"
              guard_end_flag = 0
              guard_opening_sent = to_int(opening_sent, 0)
              guard_round_count = round_count
              guard_risk_hit_count = risk_hit_count

              if module_missing == 1:
                  should_continue = 0
                  guard_reason = "module_missing"
                  guard_reply = module_missing_reason or "请先选择训练模块后再开始陪练。"
                  guard_stage = "init"
                  guard_end_flag = 0
              elif redline_hit == 1:
                  should_continue = 0
                  guard_reason = "redline_blocked"
                  joined_types = "、".join(redline_types) if redline_types else "红线表达"
                  guard_reply = f"这句话我不能按真实顾客陪你继续演练，因为已触发{joined_types}。你可以改成合规表达后继续，我会按顾客身份接着往下练。"
                  guard_stage = "guarded"
                  guard_risk_hit_count = risk_hit_count + 1
              elif off_topic_hit == 1:
                  should_continue = 0
                  guard_reason = "off_topic_redirect"
                  guard_reply = "当前是珠宝门店销售陪练，请围绕顾客接待、产品介绍、异议处理或成交推进继续练习。"
                  guard_stage = "in_progress"
              elif to_int(end_flag, 0) == 1:
                  should_continue = 0
                  guard_reason = "already_finished"
                  guard_reply = "本场陪练已结束，请重新选择模块和场景开始新一轮训练。"
                  guard_stage = "finished"
                  guard_end_flag = 1
              elif to_int(is_end_command, 0) == 1:
                  should_continue = 1
                  guard_reason = "natural_finish"
              else:
                  should_continue = 1
                  guard_reason = "allow"

              return {
                  "should_continue": should_continue,
                  "guard_reason": guard_reason,
                  "guard_reply": guard_reply,
                  "guard_stage": guard_stage,
                  "guard_end_flag": guard_end_flag,
                  "guard_opening_sent": guard_opening_sent,
                  "guard_round_count": guard_round_count,
                  "guard_risk_hit_count": guard_risk_hit_count,
                  "redline_hit": redline_hit,
                  "redline_types": "；".join(redline_types),
                  "llm_reason": llm_reason,
                  "llm_confidence": llm_confidence,
                  "last_customer_reply_safe": query
              }
        code_language: python3
        desc: 融合代码与 LLM 风险判断，并把“未选择训练模块”作为最高优先级拦截。
        outputs:
