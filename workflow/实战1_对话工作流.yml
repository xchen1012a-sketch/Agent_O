    - data:
        code: |-
          def main(
              user_query: str = "",
              module_code: str = "",
              module_name: str = "",
              scenario_type: str = "",
              opening_sent: int = 0,
              end_flag: int = 0,
              current_round_count: int = 0,
              current_risk_hit_count: int = 0,
              last_customer_reply: str = ""
          ) -> dict:
              def clean(v):
                  return str(v or "").strip()

              query = clean(user_query)
              module_code = clean(module_code)
              module_name = clean(module_name)
              scenario = clean(scenario_type)
              normalized_query = query.lower()

              allowed_modules = {
                  "product_basics", "compliance_expression", "customer_opening", "needs_discovery",
                  "objection_handling", "combo_recommendation", "closing_conversion",
                  "independent_service", "final_review"
              }

              module_missing_flag = 0
              module_missing_reason = ""
              if not module_code:
                  module_missing_flag = 1
                  module_missing_reason = "未选择训练模块，请先选择模块再开始陪练。"
              elif module_code not in allowed_modules:
                  module_missing_flag = 1
                  module_missing_reason = "训练模块编码不在允许范围内，请传 training_constants 中定义的模块 code。"

              hard_redline_map = {
                  "违法违规": ["伪造证书", "假证书", "造假", "骗客户", "诈骗", "洗钱", "偷税", "逃税", "虚开发票"],
                  "保值升值承诺": ["保证升值", "一定升值", "绝对保值", "稳赚不赔", "包你升值", "收益保证"],
                  "绝对化宣传": ["100%真", "绝对真", "全国最低价", "全网最低", "永不褪色", "绝不会坏", "百分百"],
                  "隐私敏感": ["银行卡号", "支付密码", "身份证号", "客户隐私", "导出手机号"],
              }

              soft_offtopic_keywords = [
                  "天气", "股票", "彩票", "贷款", "移民", "编程作业", "写论文", "政治", "色情", "暴力", "外挂", "破解"
              ]

              end_words = ["结束陪练", "结束", "停止"]

              redline_hits = []
              redline_types = []
              for category, keywords in hard_redline_map.items():
                  for kw in keywords:
                      if kw.lower() in normalized_query:
                          redline_hits.append(kw)
                          if category not in redline_types:
                              redline_types.append(category)

              code_is_redline = 1 if redline_types else 0
              code_off_topic = 1 if any(kw in normalized_query for kw in soft_offtopic_keywords) else 0
              is_end_command = 1 if query in end_words else 0

              return {
                  "clean_query": query,
                  "module_code_out": module_code,
                  "module_name_out": module_name,
                  "scenario_type_out": scenario,
                  "opening_sent": int(opening_sent or 0),
                  "end_flag": int(end_flag or 0),
                  "current_round_count": int(current_round_count or 0),
                  "current_risk_hit_count": int(current_risk_hit_count or 0),
                  "last_customer_reply_safe": clean(last_customer_reply),
                  "module_missing_flag": module_missing_flag,
                  "module_missing_reason": module_missing_reason,
                  "code_is_redline": code_is_redline,
                  "code_redline_types": "；".join(redline_types),
                  "code_redline_hits": "；".join(redline_hits),
                  "code_off_topic": code_off_topic,
                  "is_end_command": is_end_command,
              }
        code_language: python3
