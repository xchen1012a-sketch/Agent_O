      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - label: 用户ID
          max_length: 64
          options: []
          required: false
          type: text-input
          variable: user_id
        - label: 训练模块编码（必填，建议传 training_constants 中的模块 code）
          max_length: 64
          options:
          - product_basics
          - compliance_expression
          - customer_opening
          - needs_discovery
          - objection_handling
          - combo_recommendation
          - closing_conversion
          - independent_service
          - final_review
          required: true
          type: text-input
          variable: module_code
        - label: 训练模块名称（可选，不传时自动按模块编码回填）
          max_length: 64
          options: []
          required: false
          type: text-input
          variable: module_name
        - label: 训练周期ID（可选）
          max_length: 64
          options: []
          required: false
          type: text-input
          variable: cycle_id
        - label: 阶段号（可选）
          max_length: 32
          options: []
          required: false
          type: number
          variable: stage_no
        - label: 场景类型（下拉）
          max_length: 64
          options:
          - 顾客嫌贵
          - 顾客质疑材质真假
          - 顾客犹豫不决不下单
          - 其他（手动输入）
          required: false
          type: select
          variable: scenario_type_select
        - label: 自定义场景
          max_length: 256
          options: []
          required: false
          type: text-input
          variable: scenario_type_custom
        - label: 陪练难度
          max_length: 32
          options:
          - 初级
          - 标准
          - 进阶
          required: false
          type: select
          variable: difficulty
        - label: 学员身份
          max_length: 64
          options: []
          required: false
          type: text-input
          variable: trainee_role
        height: 381
      height: 213
      id: start
      position:
        x: 0
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: |-
          def main(
              start_user_id: str = "",
              start_module_code: str = "",
              start_module_name: str = "",
              start_cycle_id: str = "",
              start_stage_no = 0,
              start_scenario_type_select: str = "",
              start_scenario_type_custom: str = "",
              start_difficulty: str = "",
              start_trainee_role: str = "",
              cv_user_id: str = "",
              cv_module_code: str = "",
              cv_module_name: str = "",
              cv_cycle_id: str = "",
              cv_stage_no = 0,
              cv_scenario_type: str = "",
              cv_difficulty: str = "",
              cv_trainee_role: str = "",
              cv_scenario_card: str = "",
              cv_stage: str = "",
              cv_round_count: int = 0,
              cv_opening_sent: int = 0,
              cv_end_flag: int = 0,
              cv_risk_hit_count: int = 0,
              dialogue_count: int = 1
          ) -> dict:
              def pick(*vals, default=""):
                  for v in vals:
                      if v is None:
                          continue
                      s = str(v).strip()
                      if s != "":
                          return s
                  return default

              def pick_int(*vals, default=0):
                  for v in vals:
                      try:
                          if v is None or str(v).strip() == "":
                              continue
                          return int(round(float(v)))
                      except Exception:
                          continue
                  return default

              module_name_map = {
                  "product_basics": "产品基础",
                  "compliance_expression": "合规表达",
                  "customer_opening": "接待开场",
                  "needs_discovery": "需求挖掘",
                  "objection_handling": "异议处理",
                  "combo_recommendation": "搭配推荐",
                  "closing_conversion": "成交推进",
                  "independent_service": "独立上岗",
                  "final_review": "综合复盘"
              }

              module_focus_map = {
                  "product_basics": "重点看学员是否能把黄金、K金、铂金、钻石、翡翠等基础概念讲清楚，遇到材质、证书、工艺类问题时不能乱说。",
                  "compliance_expression": "重点看学员是否避免绝对化、保值升值、最低价、无法核实保证等红线表达，并能用稳妥说法接住顾客。",
                  "customer_opening": "重点看学员是否能自然开场、快速建立信任、不过度推销，并通过首轮追问识别顾客来意。",
                  "needs_discovery": "重点看学员是否主动问预算、用途、送礼对象、佩戴场景与偏好，逐步把需求问清楚。",
                  "objection_handling": "重点看学员是否能正面回应嫌贵、真假、犹豫等异议，而不是回避或硬碰硬。",
                  "combo_recommendation": "重点看学员是否能基于主品自然延伸搭配推荐，说明搭配逻辑、场景和价值，不生硬加购。",
                  "closing_conversion": "重点看学员是否能识别成交信号，做轻推进、给选择、引导试戴或下单，不逼单。",
                  "independent_service": "重点看学员能否把开场、需求、介绍、异议、推进串成完整接待过程，表现出基本独立上岗能力。",
                  "final_review": "重点看学员在综合场景下是否能兼顾专业度、合规、安全、成交推进和服务体验。"
              }

              effective_user_id = pick(cv_user_id, start_user_id, default="")
              effective_difficulty = pick(cv_difficulty, start_difficulty, default="标准")
              effective_trainee_role = pick(cv_trainee_role, start_trainee_role, default="珠宝门店销售")
              effective_stage = pick(cv_stage, default="init")

              effective_module_code = pick(cv_module_code, start_module_code, default="")
              effective_module_name = pick(cv_module_name, start_module_name, default="")
              effective_cycle_id = pick(cv_cycle_id, start_cycle_id, default="")
              effective_stage_no = pick_int(cv_stage_no, start_stage_no, default=0)

              module_required_ok = 1
              module_required_reason = ""
              if not effective_module_code:
                  module_required_ok = 0
                  module_required_reason = "缺少训练模块编码，请先从前端模块下拉中选择本次练习模块。"
              elif effective_module_code not in module_name_map:
                  module_required_ok = 0
                  module_required_reason = "训练模块编码不在系统允许范围内，请传 training_constants 中定义的模块 code。"

              if not effective_module_name:
                  effective_module_name = module_name_map.get(effective_module_code, "")

              module_focus = module_focus_map.get(
                  effective_module_code,
                  "重点看学员是否围绕当前模块目标完成真实门店接待表达。"
              )

              current_conversation_scene = pick(cv_scenario_type, default="")
              current_start_select = pick(start_scenario_type_select, default="")
              current_start_custom = pick(start_scenario_type_custom, default="")

              if current_conversation_scene:
                  final_scenario_type = current_conversation_scene
              else:
                  if current_start_custom:
                      final_scenario_type = current_start_custom
                  elif current_start_select and current_start_select != "其他（手动输入）":
                      final_scenario_type = current_start_select
                  else:
                      final_scenario_type = "顾客嫌贵"

              alias_map = {
                  "嫌贵": "顾客嫌贵",
                  "太贵": "顾客嫌贵",
                  "价格高": "顾客嫌贵",
                  "真假": "顾客质疑材质真假",
                  "质疑真假": "顾客质疑材质真假",
                  "材质真假": "顾客质疑材质真假",
                  "犹豫": "顾客犹豫不决不下单",
                  "不下单": "顾客犹豫不决不下单",
                  "犹豫不决": "顾客犹豫不决不下单"
              }

              normalized = alias_map.get(final_scenario_type, final_scenario_type)

              presets = {
                  "顾客嫌贵": {
                      "scene_name": "顾客嫌贵",
                      "customer_role": "预算敏感型顾客",
                      "customer_goal": "想买，但会持续比较价格，希望听到更有说服力的价值说明或替代方案",
                      "hidden_objection": "担心买贵、担心被硬推、担心性价比不高",
                      "opening": "你这款看着还行，就是价格有点高了，有没有更划算一点的？",
                      "success_signal": "学员先共情，再解释价值，并能提出合理替代方案、活动说明或购买建议，让顾客愿意继续了解。"
                  },
                  "顾客质疑材质真假": {
                      "scene_name": "顾客质疑材质真假",
                      "customer_role": "谨慎求证型顾客",
                      "customer_goal": "确认材质、证书、工艺与售后说明是否可信",
                      "hidden_objection": "担心买到假货、担心销售讲不清楚、担心售后没保障",
                      "opening": "你怎么证明这个材质是真的？不会只是说得好听吧？",
                      "success_signal": "学员能清楚说明材质依据、证书/标签/检测逻辑与售后保障，不夸大、不含糊，让顾客降低疑虑。"
                  },
                  "顾客犹豫不决不下单": {
                      "scene_name": "顾客犹豫不决不下单",
                      "customer_role": "反复比较型顾客",
                      "customer_goal": "迟迟下不了决定，需要更多购买理由或决策推动",
                      "hidden_objection": "担心冲动消费、担心不适合、担心买完后后悔",
                      "opening": "我再看看吧，感觉还不错，但现在还没想好要不要买。",
                      "success_signal": "学员能识别顾客犹豫点，做出针对性澄清和轻推进，让顾客愿意继续比较、试戴或进入下一步。"
                  }
              }

              if normalized in presets:
                  preset = presets[normalized]
              else:
                  preset = {
                      "scene_name": normalized,
                      "customer_role": "真实门店顾客",
                      "customer_goal": "围绕当前自定义场景提出问题、异议或犹豫点",
                      "hidden_objection": "对价格、材质、售后、款式、活动或购买决策存在顾虑",
                      "opening": f"我这边现在主要想咨询一下“{normalized}”这个情况，你帮我看看？",
                      "success_signal": "学员能识别顾客核心顾虑，给出自然、合理、不过度承诺的回应，让顾客愿意继续交流。"
                  }

              scenario_card = f"""场景名称：{preset['scene_name']}
          训练模块编码：{effective_module_code or '未选择'}
          训练模块名称：{effective_module_name or '未选择'}
          模块训练重点：{module_focus}
          训练周期ID：{effective_cycle_id or '未提供'}
          阶段号：{effective_stage_no}
          学员身份：{effective_trainee_role}
          陪练难度：{effective_difficulty}
          顾客画像：{preset['customer_role']}
          顾客目标：{preset['customer_goal']}
          隐藏顾虑：{preset['hidden_objection']}
          本场成功信号：{preset['success_signal']}"""

              customer_reply_rules = """1. 你只能扮演顾客，不能扮演老师、评分器、系统管理员或旁白。
          2. 回复必须像真实门店顾客，口语化、自然、克制，每轮只说 1~3 句。
          3. 不要一次性说完全部顾虑，每轮最多抛出 1 个核心异议、问题或态度变化。
          4. 要优先围绕“训练模块重点”给学员出题、施压和追问，让本次对话能体现该模块训练价值。
          5. 如果学员出现夸大宣传、绝对化承诺、保值升值保证、虚假最低价等表述，你要继续以顾客身份质疑。
          6. 当学员已经基本完成异议处理、达到成交推进条件时，你在最后一轮另起一行单独输出 [PRACTICE_END]。
          7. 如果用户输入“结束陪练”“结束”“停止”，你也要自然收尾，并在最后一行单独输出 [PRACTICE_END]。
          8. 不输出评分、不输出建议、不输出解析、不输出 JSON。
          9. 严禁输出思考过程、推理过程、分析说明、隐藏策略、内部备注，严禁输出 <think>、<thinking>、<reasoning> 标签。
          10. 你最终只能输出“顾客真的会说出口的话”，除最后一行可单独输出 [PRACTICE_END] 外，不允许任何角色前缀、解释、标题或旁白。"""

              return {
                  "effective_user_id": effective_user_id,
                  "effective_module_code": effective_module_code,
                  "effective_module_name": effective_module_name,
                  "effective_cycle_id": effective_cycle_id,
                  "effective_stage_no": effective_stage_no,
