app:
  description: 在岗助手对话模式 - 支持对话上下文和逐轮教练反馈的实时数字人反馈工作流
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: 在岗助手_对话工作流
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.1.32@20a545408fa017b72490e1cbaeebff21094d11b13e41197591734d1c08cdbb5
  version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    # ===== start → prepare =====
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: ac_start-ac_prepare
      source: ac_start
      sourceHandle: source
      target: ac_prepare
      targetHandle: target
      type: custom
      zIndex: 0
    # ===== prepare → if_redline =====
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: if-else
      id: ac_prepare-ac_if_redline
      source: ac_prepare
      sourceHandle: source
      target: ac_if_redline
      targetHandle: target
      type: custom
      zIndex: 0
    # ===== if_redline(true) → refusal =====
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: code
      id: ac_if_redline-true-ac_refusal
      source: ac_if_redline
      sourceHandle: 'true'
      target: ac_refusal
      targetHandle: target
      type: custom
      zIndex: 0
    # ===== refusal → refusal_answer =====
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: answer
      id: ac_refusal-ac_refusal_answer
      source: ac_refusal
      sourceHandle: source
      target: ac_refusal_answer
      targetHandle: target
      type: custom
      zIndex: 0
    # ===== if_redline(false) → knowledge =====
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: knowledge-retrieval
      id: ac_if_redline-false-ac_knowledge
      source: ac_if_redline
      sourceHandle: 'false'
      target: ac_knowledge
      targetHandle: target
      type: custom
      zIndex: 0
    # ===== knowledge → context =====
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: knowledge-retrieval
        targetType: code
      id: ac_knowledge-ac_context
      source: ac_knowledge
      sourceHandle: source
      target: ac_context
      targetHandle: target
      type: custom
      zIndex: 0
    # ===== context → llm =====
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: llm
      id: ac_context-ac_llm
      source: ac_context
      sourceHandle: source
      target: ac_llm
      targetHandle: target
      type: custom
      zIndex: 0
    # ===== llm → answer =====
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
      id: ac_llm-ac_answer
      source: ac_llm
      sourceHandle: source
      target: ac_answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    # ========== 节点1: 开始 ==========
    - data:
        desc: 接收顾客问题或现场情况
        selected: false
        title: 开始
        type: start
        variables:
        - label: 顾客问题或现场情况
          max_length: 3000
          options: []
          required: true
          type: paragraph
          variable: scene_input
        - label: 用户ID
          max_length: 64
          options: []
          required: false
          type: text-input
          variable: user_id
      height: 153
      id: ac_start
      position:
        x: 80
        y: 250
      positionAbsolute:
        x: 80
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    # ========== 节点2: 输入处理与红线检测 ==========
    - data:
        code: "def main(scene_input: str = \"\") -> dict:\n    import re\n\n    def\
          \ clean(v):\n        return str(v or \"\").replace(\"\\r\\n\", \"\\n\"\
          ).replace(\"\\r\", \"\\n\").strip()\n\n    text = clean(scene_input)\n\
          \    text = re.sub(r\"\\s+\", \" \", text).strip()\n\n    if not text:\n\
          \        text = \"顾客没有明确说明问题，请给一个稳妥的接待开场与追问话术。\"\n\n    lower_text = text.lower()\n\
          \n    safe_training_patterns = [\n        r\"不能说\", r\"合规\", r\"违规\"\
          , r\"红线\", r\"禁语\", r\"这样说可以吗\", r\"这话术行吗\"\n    ]\n    is_training_question\
          \ = any(re.search(p, text, flags=re.I) for p in safe_training_patterns)\n\
          \n    redline_patterns = [\n        r\"帮我编\", r\"帮我造\", r\"伪造\", r\"\
          假的证书\", r\"随便说是真的\", r\"保证保值\", r\"保证升值\",\n        r\"稳赚\", r\"稳赚不赔\"\
          , r\"100%真\", r\"绝对保真\", r\"全国最低价\", r\"闭眼买\", r\"假一赔十\",\n        r\"\
          怎么说顾客才会相信.*保值\", r\"怎么忽悠\", r\"怎么误导\", r\"掩盖事实\"\n    ]\n\n    hit_terms\
          \ = []\n    if not is_training_question:\n        for p in redline_patterns:\n\
          \            if re.search(p, text, flags=re.I):\n                hit_terms.append(p)\n\
          \n    code_redline_flag = 1 if hit_terms else 0\n    code_redline_reason\
          \ = \"涉及违规承诺、编造信息或误导顾客的诉求。\" if hit_terms else \"\"\n\n    question_type\
          \ = \"通用咨询\"\n    scene_tag = \"门店接待\"\n\n    if re.search(r\"贵|便宜|打折|优惠|活动|比价|价格\"\
          , text):\n        question_type = \"价格异议\"\n        scene_tag = \"异议处理\"\
          \n    elif re.search(r\"真假|真的吗|保真|材质|纯度|是不是金|钻石|翡翠|证书|鉴定\", text):\n\
          \        question_type = \"真假/证书\"\n        scene_tag = \"信任建立\"\n  \
          \  elif re.search(r\"售后|保养|退换|维修|改圈|清洗\", text):\n        question_type\
          \ = \"售后咨询\"\n        scene_tag = \"售后解释\"\n    elif re.search(r\"送人|送礼|适合|佩戴|款式|怎么选\"\
          , text):\n        question_type = \"推荐咨询\"\n        scene_tag = \"产品推荐\"\
          \n    elif re.search(r\"犹豫|再看看|考虑一下|不想买|下次再来\", text):\n        question_type\
          \ = \"犹豫不决\"\n        scene_tag = \"成交推进\"\n\n    retrieval_query = f\"\
          珠宝门店 {question_type} {scene_tag} {text}\"\n\n    return {\n        \"\
          cleaned_input\": text,\n        \"user_context\": f\"顾客问题或现场情况：{text}\"\
          ,\n        \"question_type\": question_type,\n        \"scene_tag\": scene_tag,\n\
          \        \"retrieval_query\": retrieval_query,\n        \"code_redline_flag\"\
          : code_redline_flag,\n        \"code_redline_reason\": code_redline_reason,\n\
          \    }\n"
        code_language: python3
        desc: 单输入清洗、红线检测与粗分类
        outputs:
          cleaned_input:
            type: string
          code_redline_flag:
            type: number
          code_redline_reason:
            type: string
          question_type:
            type: string
          retrieval_query:
            type: string
          scene_tag:
            type: string
          user_context:
            type: string
        selected: false
        title: 输入处理与红线检测
        type: code
        variables:
        - value_selector:
          - ac_start
          - scene_input
          variable: scene_input
      height: 96
      id: ac_prepare
      position:
        x: 380
        y: 250
      positionAbsolute:
        x: 380
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    # ========== 节点3: 是否命中红线 ==========
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: '='
            id: ac-redline-cond-1
            value: '1'
            varType: number
            variable_selector:
            - ac_prepare
            - code_redline_flag
          id: 'true'
          logical_operator: and
        desc: 命中违规诉求时直接固定拒答
        selected: false
        title: 是否命中红线
        type: if-else
      height: 192
      id: ac_if_redline
      position:
        x: 680
        y: 250
      positionAbsolute:
        x: 680
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    # ========== 节点4: 红线拒答构造 ==========
    - data:
        code: "def main(cleaned_input: str = \"\", question_type: str = \"\", code_redline_reason:\
          \ str = \"\") -> dict:\n    reply_text = \"这个说法我不能直接帮你这么表达。更稳妥的做法是回到材质依据、证书信息、门店规则和真实卖点上，我可以马上帮你改成合规又自然的话术。\"\
          \n    return {\n        \"refusal_text\": reply_text,\n    }\n"
        code_language: python3
        desc: 固定拒答输出
        outputs:
          refusal_text:
            type: string
        selected: false
        title: 红线拒答构造
        type: code
        variables:
        - value_selector:
          - ac_prepare
          - cleaned_input
          variable: cleaned_input
        - value_selector:
          - ac_prepare
          - question_type
          variable: question_type
        - value_selector:
          - ac_prepare
          - code_redline_reason
          variable: code_redline_reason
      height: 96
      id: ac_refusal
      position:
        x: 980
        y: 100
      positionAbsolute:
        x: 980
        y: 100
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    # ========== 节点5: 红线拒答回复 ==========
    - data:
        answer: '{{#ac_refusal.refusal_text#}}'
        desc: ''
        selected: false
        title: 红线拒答回复
        type: answer
        variables: []
      height: 103
      id: ac_refusal_answer
      position:
        x: 1280
        y: 100
      positionAbsolute:
        x: 1280
        y: 100
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    # ========== 节点6: 知识检索 ==========
    # 注意：dataset_ids 需要替换为你自己的 Dify 知识库 ID
    # 获取方式：Dify 后台 → 知识 → 点击知识库 → URL 中 /datasets/{id}/
    - data:
        dataset_ids:
        - J3feDEiEmkB+GBiKZO8R//BmAAyH2m2FzEaE1FTYz4nfkghitO6iGOqrsfs2Bsle
        desc: 使用检索 query 做短上下文检索
        multiple_retrieval_config:
          reranking_enable: true
          reranking_mode: reranking_model
          reranking_model:
            model: gte-rerank
            provider: langgenius/tongyi/tongyi
          top_k: 2
        query_attachment_selector: []
        query_variable_selector:
        - ac_prepare
        - retrieval_query
        retrieval_mode: multiple
        selected: false
        title: 知识检索
        type: knowledge-retrieval
      height: 134
      id: ac_knowledge
      position:
        x: 980
        y: 450
      positionAbsolute:
        x: 980
        y: 450
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    # ========== 节点7: 知识结果整理 ==========
    - data:
        code: "def main(user_context: str = \"\", cleaned_input: str = \"\", question_type:\
          \ str = \"\", retrieved_docs=None) -> dict:\n    docs = retrieved_docs or\
          \ []\n    blocks = []\n    points = []\n\n    for idx, doc in enumerate(docs[:2],\
          \ 1):\n        title = \"\"\n        content = \"\"\n        try:\n     \
          \       if isinstance(doc, dict):\n                title = str(doc.get(\"\
          title\") or doc.get(\"name\") or \"\").strip()\n                content\
          \ = str(doc.get(\"content\") or doc.get(\"segment\") or doc.get(\"text\"\
          ) or \"\").strip()\n                if not content:\n                    metadata\
          \ = doc.get(\"metadata\") or {}\n                    doc_metadata = metadata.get(\"\
          doc_metadata\") or {}\n                    content = str(doc_metadata.get(\"\
          content\") or \"\").strip()\n            else:\n                content\
          \ = str(doc).strip()\n        except Exception:\n            content = str(doc).strip()\n\
          \n        if content:\n            brief = content[:180]\n            block\
          \ = f\"[知识片段{idx}]\"\n            if title:\n                block +=\
          \ f\"\\n标题：{title}\"\n                points.append(title)\n         \
          \   block += f\"\\n内容：{brief}\"\n            blocks.append(block)\n\n  \
          \  knowledge_hit = \"yes\" if blocks else \"no\"\n    kb_context = \"\\\
          n\\n\".join(blocks)\n    if not kb_context:\n        kb_context = \"未检索到强相关知识片段，请按珠宝门店通用稳妥说法生成。\"\
          \n\n    return {\n        \"user_context_out\": user_context,\n        \"\
          cleaned_input_out\": cleaned_input,\n        \"question_type_out\": question_type,\n\
          \        \"knowledge_hit\": knowledge_hit,\n        \"kb_context\": kb_context,\n\
          \    }\n"
        code_language: python3
        desc: 把检索结果压缩成 LLM 上下文
        outputs:
          cleaned_input_out:
            type: string
          kb_context:
            type: string
          knowledge_hit:
            type: string
          question_type_out:
            type: string
          user_context_out:
            type: string
        selected: false
        title: 知识结果整理
        type: code
        variables:
        - value_selector:
          - ac_prepare
          - user_context
          variable: user_context
        - value_selector:
          - ac_prepare
          - cleaned_input
          variable: cleaned_input
        - value_selector:
          - ac_prepare
          - question_type
          variable: question_type
        - value_selector:
          - ac_knowledge
          - result
          variable: retrieved_docs
      height: 96
      id: ac_context
      position:
        x: 1280
        y: 450
      positionAbsolute:
        x: 1280
        y: 450
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    # ========== 节点8: 主LLM - 话术 + 逐轮反馈 ==========
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 分析顾客意图，生成话术与逐轮反馈
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 8
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: kimi-k2.5
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: ac-system-prompt
          role: system
          text: "你是珠宝门店销售教练。根据顾客说的话，快速判断意图，给出话术和教练反馈。\n\n## 意图类型\n价格试探 / 材质对比\
            / 真假确认 / 场景匹配 / 犹豫观望 / 需求确认 / 售后确认 / 成交推进\n\n## 话术要求\n- 你是导购本人，直接说给顾客听\n\
            - 35~80字，口语化，自然\n- 先接住顾虑，再轻推进\n- 禁止培训口吻（\"建议你\"、\"可以先\"、\"针对\"）\n- 严禁绝对化承诺、保值升值、虚假最低价\n\
            - 结合对话历史连贯推进，不重复\n- 知识命中时吸收有效信息\n\n## 输出格式\n\n话术文字\n\n---TF---\n{\"intent_label\"\
            :\"意图\",\"intent_reason\":\"一句话原因\",\"customer_state\":\"情绪\",\"mentor_comment\"\
            :\"30字内点评，直说问题\",\"next_action\":\"下一步做什么\",\"next_question\":\"问顾客一句\"\
            ,\"voice_advice\":\"15字内播报\"}\n\n## 示例\n\n这款用的是18K金工艺，日常佩戴不褪色，设计感也强。您要不要试戴看看？\n\
            \n---TF---\n{\"intent_label\":\"价格试探\",\"intent_reason\":\"比较价格，评估值不值\",\"customer_state\"\
            :\"谨慎\",\"mentor_comment\":\"别急着让价，先把材质工艺价值讲透。\",\"next_action\":\"用工艺和佩戴效果解释价格\"\
            ,\"next_question\":\"您之前了解过同类款式吗？\",\"voice_advice\":\"先别降价，讲清楚贵在哪里。\"}\n"
        - id: ac-user-prompt
          role: user
          text: "【顾客原话】\n{{#ac_context.cleaned_input_out#}}\n\n【问题类型】{{#ac_context.question_type_out#}}\n\
            【知识命中】{{#ac_context.knowledge_hit#}}\n【可用知识】\n{{#ac_context.kb_context#}}\n\
            \n分析意图，输出话术和反馈。"
        selected: false
        title: 话术与反馈生成
        type: llm
        variables: []
        vision:
          enabled: false
      height: 132
      id: ac_llm
      position:
        x: 1580
        y: 450
      positionAbsolute:
        x: 1580
        y: 450
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    # ========== 节点9: 正常回复 ==========
    - data:
        answer: '{{#ac_llm.text#}}'
        desc: 输出话术和逐轮反馈（后端通过 ---TF--- 分隔符解析）
        selected: false
        title: 导购回复
        type: answer
        variables: []
      height: 103
      id: ac_answer
      position:
        x: 1880
        y: 450
      positionAbsolute:
        x: 1880
        y: 450
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport:
      x: 0
      y: 200
      zoom: 0.7
  rag_pipeline_variables: []
