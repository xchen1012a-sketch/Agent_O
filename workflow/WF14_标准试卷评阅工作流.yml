                  if risks: comment += " 建议重点复盘：" + "、".join([x for x in risks if x][:2]) + "。"
              detail={"question_results":results,"strengths":[x for x in strengths if x][:3],"risks":[x for x in risks if x][:3],"objective_gained_score":round(f(objective_gained_score,0),2),"objective_full_score":round(f(objective_full_score,0),2),"subjective_gained_score":round(sg,2),"subjective_full_score":round(sf,2)}
              result={"score":total_score,"is_pass":is_pass,"comment":comment,"grading_detail":detail,"weak_points":weak,"recommended_actions":actions}
