              for x in sub:
                  if not isinstance(x,dict): continue
                  qid=t(x.get("question_id")); full=round(f(x.get("full_score"),0),2); sf+=full; ll=smap.get(qid,{})
                  fb_score, fb_hit, fb_miss=fallback(x); score=clamp(ll.get("score",fb_score),0.0,full); sg+=score
                  hit=ll.get("hit_keywords") if isinstance(ll.get("hit_keywords"),list) else fb_hit
                  miss=ll.get("missing_keywords") if isinstance(ll.get("missing_keywords"),list) else fb_miss
                  comment=t(ll.get("comment")) or ("简答题得分较好" if score>=full*0.7 else "简答题仍需补充关键点")
                  results.append({"sort_order":int(f(x.get("sort_order"),999)),"question_id":qid,"type":"short","title":t(x.get("title")) or qid,"full_score":full,"gained_score":round(score,2),"is_correct":1 if score>=full*0.7 and full>0 else 0,"user_answer":t(x.get("user_answer")),"hit_keywords":hit,"missing_keywords":miss,"comment":comment})
                  (strengths if score>=full*0.7 else risks).append(t(x.get("title")) or qid)
              results=sorted(results,key=lambda x:int(f(x.get("sort_order"),999)))
              full_total=round(f(objective_full_score,0)+sf,2); gained_total=round(f(objective_gained_score,0)+sg,2); total_score=round((gained_total/full_total)*100,2) if full_total>0 else 0.0
              pass_line=round(f(pass_score_out,85),1); is_pass=1 if total_score>=pass_line else 0
              weak=[str(x).strip() for x in (llm.get("weak_points") if isinstance(llm,dict) and isinstance(llm.get("weak_points"),list) else []) if str(x).strip()][:3] or [x for x in risks if x][:3]
              actions=[str(x).strip() for x in (llm.get("recommended_actions") if isinstance(llm,dict) and isinstance(llm.get("recommended_actions"),list) else []) if str(x).strip()][:3] or ([f"复盘题目：{x}" for x in weak[:3]] if weak else ["继续巩固高频考点"])
              comment=t(llm.get("summary_comment")) if isinstance(llm,dict) else ""
