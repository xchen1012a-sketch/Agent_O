    - data:
        code: |-
          import json, re
          def t(v,d=""): s=str(v or "").strip(); return s if s else d
          def f(v,d=0.0):
              try: return float(v)
              except: return float(d)
          def j(raw):
              if isinstance(raw,(dict,list)): return raw
              s=t(raw)
              s=re.sub(r"<think>[\s\S]*?</think>","",s,flags=re.I)
              s=re.sub(r"^```json\s*","",s,flags=re.I); s=re.sub(r"^```\s*","",s); s=re.sub(r"\s*```$","",s)
              if not s: return {}
              try: return json.loads(s)
              except:
                  m=re.search(r"(\{[\s\S]*\}|\[[\s\S]*\])",s)
                  if not m: return {}
                  try: return json.loads(m.group(1))
                  except: return {}
          def clamp(v,lo,hi): n=f(v,lo); return max(lo,min(hi,n))
          def fallback(item):
              full=f(item.get("full_score"),0); ans=t(item.get("user_answer")).lower(); kws=[str(x).strip().lower() for x in (item.get("keywords") or []) if str(x).strip()]
              if not ans: return 0.0,[],kws
              if not kws: return round(full*0.7,2),[],[]
              hit=[k for k in kws if k in ans]; miss=[k for k in kws if k not in ans]; return round(full*min(len(hit)/len(kws),1.0),2),hit,miss
          def main(record_id_out="", task_id_out="", exam_title_out="", pass_score_out=85, question_count=0, objective_gained_score=0, objective_full_score=0, objective_results_json="", subjective_items_json="", raw_output="") -> dict:
              obj=j(objective_results_json); obj=obj if isinstance(obj,list) else []
              sub=j(subjective_items_json); sub=sub if isinstance(sub,list) else []
              llm=j(raw_output); scores=llm.get("subjective_scores") if isinstance(llm,dict) and isinstance(llm.get("subjective_scores"),list) else []
              smap={t(x.get("question_id")):x for x in scores if isinstance(x,dict) and t(x.get("question_id"))}
              results=[]; strengths=[]; risks=[]; sg=0.0; sf=0.0
              for x in obj:
