    - data:
        code: |-
          import json, re
          def t(v,d=""): s=str(v or "").strip(); return s if s else d
          def f(v,d=0.0):
              try: return float(v)
              except: return float(d)
          def j(raw):
              if isinstance(raw,(dict,list)): return raw
              s=t(raw)
              s=re.sub(r"<think>[\s\S]*?</think>","",s,flags=re.I)
              s=re.sub(r"^```json\s*","",s,flags=re.I); s=re.sub(r"^```\s*","",s); s=re.sub(r"\s*```$","",s)
              if not s: return {}
              try: return json.loads(s)
              except:
                  m=re.search(r"(\{[\s\S]*\}|\[[\s\S]*\])",s)
                  if not m: return {}
                  try: return json.loads(m.group(1))
                  except: return {}
          def a(raw):
              obj=j(raw)
              if isinstance(obj,dict) and isinstance(obj.get("answers"),(dict,list)): obj=obj["answers"]
              if isinstance(obj,list): return {f"q{i}":v for i,v in enumerate(obj,1)}
              return obj if isinstance(obj,dict) else {}
          def norm_multi(v):
              if isinstance(v,list): arr=v
              else: arr=re.split(r"[,，/\s]+", t(v)) if t(v) else []
              out=[]
              for x in arr:
                  x=t(x).upper()
                  if x and x not in out: out.append(x)
              return out
          def main(record_id="", task_id="", exam_title="", paper_config_json="", answers_json="", pass_score=85):
              paper=j(paper_config_json); answers=a(answers_json)
              qs=paper.get("questions") if isinstance(paper,dict) and isinstance(paper.get("questions"),list) else []
              if not qs:
                  return {"is_valid":0,"invalid_reason":"paper_config_json 中缺少 questions，无法阅卷。","record_id_out":t(record_id),"task_id_out":t(task_id),"exam_title_out":t(exam_title),"pass_score_out":round(f(pass_score,85),1),"question_count":0,"objective_gained_score":0.0,"objective_full_score":0.0,"objective_results_json":"[]","subjective_items_json":"[]"}
              title=t(exam_title) or t(paper.get("exam_title")) or "标准考试"
              pass_line=round(f(paper.get("pass_score"),f(pass_score,85)),1)
              score_default=round(100.0/max(len(qs),1),2)
              obj=[]; sub=[]; og=0.0; of=0.0
              for i,q in enumerate(qs,1):
                  qid=t(q.get("id")) or f"q{i}"
                  qtype=t(q.get("type"),"single").lower()
                  if qtype not in {"single","multiple","judge","short"}: qtype="single"
                  qscore=round(f(q.get("score"),score_default),2)
                  ans=answers.get(qid, answers.get(str(i), answers.get(f"q{i}","")))
                  if qtype in {"single","judge"}:
                      exp=t(q.get("answer")).upper(); act=t(ans).upper(); ok=1 if act and act==exp else 0; got=qscore if ok else 0.0; og+=got; of+=qscore
                      obj.append({"sort_order":i,"question_id":qid,"type":qtype,"title":t(q.get("title")) or qid,"full_score":qscore,"gained_score":round(got,2),"is_correct":ok,"user_answer":act,"expected_answer":exp,"comment":"正确" if ok else "错误"})
                  elif qtype=="multiple":
                      exp=sorted(norm_multi(q.get("answer"))); act=sorted(norm_multi(ans)); ok=1 if exp and act==exp else 0; got=qscore if ok else 0.0; og+=got; of+=qscore
                      obj.append({"sort_order":i,"question_id":qid,"type":qtype,"title":t(q.get("title")) or qid,"full_score":qscore,"gained_score":round(got,2),"is_correct":ok,"user_answer":act,"expected_answer":exp,"comment":"正确" if ok else "错误"})
                  else:
                      sub.append({"sort_order":i,"question_id":qid,"type":"short","title":t(q.get("title")) or qid,"full_score":qscore,"user_answer":t(ans),"keywords":[str(x).strip() for x in (q.get("keywords") or []) if str(x).strip()]})
              return {"is_valid":1,"invalid_reason":"","record_id_out":t(record_id),"task_id_out":t(task_id),"exam_title_out":title,"pass_score_out":pass_line,"question_count":len(qs),"objective_gained_score":round(og,2),"objective_full_score":round(of,2),"objective_results_json":json.dumps(obj,ensure_ascii=False),"subjective_items_json":json.dumps(sub,ensure_ascii=False)}
        code_language: python3
        desc: 规则判分客观题并抽取简答题
        outputs:
          exam_title_out: {type: string}
          invalid_reason: {type: string}
          is_valid: {type: number}
          objective_full_score: {type: number}
          objective_gained_score: {type: number}
          objective_results_json: {type: string}
