        - {value_selector: [unlock_start, review_score], variable: review_score}
        - {value_selector: [unlock_start, is_pass], variable: is_pass}
        - {value_selector: [unlock_start, stage_status], variable: stage_status}
        - {value_selector: [unlock_start, has_growth_plan], variable: has_growth_plan}
        - {value_selector: [unlock_start, passed_stage1], variable: passed_stage1}
        - {value_selector: [unlock_start, passed_stage2], variable: passed_stage2}
        - {value_selector: [unlock_start, next_cycle_id], variable: next_cycle_id}
        - {value_selector: [unlock_start, retry_task_count], variable: retry_task_count}
