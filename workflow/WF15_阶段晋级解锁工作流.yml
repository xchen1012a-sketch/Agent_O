    - data:
        code: |-
          import json, re
          def t(v, d=""):
              s = str(v or "").strip()
              return s if s else d
          def n(v, d=0):
              try:
                  if v is None or str(v).strip() == "":
                      return int(d)
                  return int(float(v))
              except:
                  return int(d)
          def f(v, d=0.0):
              try:
                  if v is None or str(v).strip() == "":
                      return float(d)
                  return float(v)
              except:
                  return float(d)
          def b(v, d=0):
              if isinstance(v, bool):
                  return 1 if v else 0
              s = str(v or "").strip().lower()
              if s in {"1","true","yes","y","on","是"}:
                  return 1
              if s in {"0","false","no","n","off","否"}:
                  return 0
              return int(d)
          def j(raw, default):
              if isinstance(raw, (dict, list)):
                  return raw
              s = t(raw)
              s = re.sub(r"<think>[\s\S]*?</think>", "", s, flags=re.I)
              s = re.sub(r"^```json\s*", "", s, flags=re.I)
              s = re.sub(r"^```\s*", "", s)
              s = re.sub(r"\s*```$", "", s)
              if not s:
                  return default
              try:
                  obj = json.loads(s)
                  return obj
              except:
                  return default
          def main(user_id="", cycle_id="", cycle_type="", stage_no=0, stage_name="", review_score=0, is_pass="", stage_status="", has_growth_plan="", passed_stage1="", passed_stage2="", next_cycle_id="", retry_task_count=0, trigger_source="", unlock_matrix_version="", current_unlocks_json=""):
              user_id = t(user_id)
              cycle_id = t(cycle_id)
              cycle_type = t(cycle_type, "onboarding")
              stage_name = t(stage_name)
              stage_status = t(stage_status, "active")
              next_cycle_id = t(next_cycle_id)
              trigger_source = t(trigger_source, "review_stage")
              unlock_matrix_version = t(unlock_matrix_version, "v1")
              stage_no = n(stage_no, 0)
              review_score = round(f(review_score, 0), 2)
              is_pass = b(is_pass, 0)
              has_growth_plan = b(has_growth_plan, 1)
              passed_stage1 = b(passed_stage1, 0)
              passed_stage2 = b(passed_stage2, 0)
              retry_task_count = n(retry_task_count, 0)
              current_unlocks = j(current_unlocks_json, {})
              if not isinstance(current_unlocks, dict):
                  current_unlocks = {}

              if stage_no >= 1 and is_pass == 1:
                  passed_stage1_final = 1 if stage_no >= 1 else passed_stage1
                  passed_stage2_final = 1 if stage_no >= 2 else passed_stage2
              else:
                  passed_stage1_final = 1 if passed_stage1 else 0
                  passed_stage2_final = 1 if passed_stage2 else 0

              facts_valid = 1
              invalid_reason = ""
              if not user_id:
                  facts_valid = 0
                  invalid_reason = "缺少 user_id"
              elif not cycle_id:
                  facts_valid = 0
                  invalid_reason = "缺少 cycle_id"
              elif stage_no <= 0:
                  facts_valid = 0
                  invalid_reason = "stage_no 必须大于 0"
              elif stage_status not in {"active", "waiting_review", "passed", "failed", "completed"}:
                  facts_valid = 0
                  invalid_reason = "stage_status 非法"
              elif trigger_source not in {"review_stage", "onboarding_status", "manual_check"}:
                  facts_valid = 0
                  invalid_reason = "trigger_source 非法"
              elif is_pass not in {0, 1}:
                  facts_valid = 0
                  invalid_reason = "is_pass 非法"

              snapshot = {
                  "user_id": user_id,
                  "cycle_id": cycle_id,
                  "cycle_type": cycle_type,
                  "stage_no": stage_no,
                  "stage_name": stage_name,
                  "review_score": review_score,
                  "is_pass": is_pass,
                  "stage_status": stage_status,
                  "has_growth_plan": has_growth_plan,
                  "passed_stage1": passed_stage1,
                  "passed_stage2": passed_stage2,
                  "passed_stage1_final": passed_stage1_final,
                  "passed_stage2_final": passed_stage2_final,
                  "next_cycle_id": next_cycle_id,
                  "retry_task_count": retry_task_count,
                  "trigger_source": trigger_source,
                  "unlock_matrix_version": unlock_matrix_version,
                  "current_unlocks": current_unlocks,
              }

              return {
                  "facts_valid": facts_valid,
                  "invalid_reason": invalid_reason,
                  "user_id_out": user_id,
                  "cycle_id_out": cycle_id,
                  "cycle_type_out": cycle_type,
                  "stage_no_out": stage_no,
                  "stage_name_out": stage_name,
                  "review_score_out": review_score,
                  "is_pass_out": is_pass,
                  "stage_status_out": stage_status,
                  "has_growth_plan_out": has_growth_plan,
                  "passed_stage1_final": passed_stage1_final,
                  "passed_stage2_final": passed_stage2_final,
                  "next_cycle_id_out": next_cycle_id,
                  "retry_task_count_out": retry_task_count,
                  "trigger_source_out": trigger_source,
                  "unlock_matrix_version_out": unlock_matrix_version,
                  "current_unlocks_out": json.dumps(current_unlocks, ensure_ascii=False),
                  "normalized_snapshot_json": json.dumps(snapshot, ensure_ascii=False),
              }
        code_language: python3
        desc: 清洗输入并标准化为后续规则引擎可消费的事实快照
        outputs:
          current_unlocks_out: {type: string}
          cycle_id_out: {type: string}
          cycle_type_out: {type: string}
          facts_valid: {type: number}
          has_growth_plan_out: {type: number}
          invalid_reason: {type: string}
          is_pass_out: {type: number}
