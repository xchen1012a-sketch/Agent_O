    - data:
        code: |-
          import json
          def t(v, d=""):
              s = str(v or "").strip()
              return s if s else d
          def main(user_id_out="", cycle_id_out="", invalid_reason=""):
              reason = t(invalid_reason, "输入无效，无法生成自动晋级解锁结果。")
              payload = {
                  "workflow_status": "invalid_input",
                  "unlock_scope": "invalid_input",
                  "module_unlocks_json": json.dumps({
                      "growth_plan": False,
                      "daily_tasks": False,
                      "free_practice": False,
                      "exam_center": False,
                      "on_job_assistant": False,
                      "competition_dashboard": False,
                      "business_workspace": False,
                  }, ensure_ascii=False),
                  "next_route": "/frontend/#/growth-plan",
                  "next_action": "check_input",
                  "user_message": reason,
                  "manager_message": reason,
                  "recommended_actions_json": json.dumps(["检查工作流输入字段"], ensure_ascii=False),
                  "unlock_diff_json": json.dumps({}, ensure_ascii=False),
                  "should_notify_user": 0,
                  "should_notify_manager": 0,
                  "invalid_reason": reason,
              }
              payload["safe_output_json"] = json.dumps({
                  "user_id": t(user_id_out),
                  "cycle_id": t(cycle_id_out),
                  **payload,
              }, ensure_ascii=False)
              return payload
        code_language: python3
        desc: 无效输入兜底
        outputs:
          invalid_reason: {type: string}
          manager_message: {type: string}
          module_unlocks_json: {type: string}
