          stage_no_out: {type: number}
          stage_status_out: {type: string}
          trigger_source_out: {type: string}
          unlock_matrix_version_out: {type: string}
          user_id_out: {type: string}
        selected: false
        title: 输入校验与标准化
        type: code
        variables:
        - {value_selector: [unlock_start, user_id], variable: user_id}
        - {value_selector: [unlock_start, cycle_id], variable: cycle_id}
        - {value_selector: [unlock_start, cycle_type], variable: cycle_type}
        - {value_selector: [unlock_start, stage_no], variable: stage_no}
