    - data:
        code: |-
          import json, re
          def t(v, d=""):
              s = str(v or "").strip()
              return s if s else d
          def n(v, d=0):
              try:
                  if v is None or str(v).strip() == "":
                      return int(d)
                  return int(float(v))
              except:
                  return int(d)
          def j(raw, default):
              if isinstance(raw, (dict, list)):
                  return raw
              s = t(raw)
              s = re.sub(r"<think>[\s\S]*?</think>", "", s, flags=re.I)
              s = re.sub(r"^```json\s*", "", s, flags=re.I)
              s = re.sub(r"^```\s*", "", s)
              s = re.sub(r"\s*```$", "", s)
              if not s:
                  return default
              try:
                  obj = json.loads(s)
                  return obj
              except:
                  m = re.search(r"(\{[\s\S]*\}|\[[\s\S]*\])", s)
                  if not m:
                      return default
                  try:
                      return json.loads(m.group(1))
                  except:
                      return default
          def main(user_id_out="", cycle_id_out="", workflow_status="success", unlock_scope="", module_unlocks_json="{}", next_route="", next_action="", rule_reason="", recommended_actions_json="[]", unlock_diff_json="{}", should_notify_user=0, should_notify_manager=0, normalized_snapshot_json_out="{}", policy_snapshot_json="{}", raw_output=""):
              llm = j(raw_output, {})
              if not isinstance(llm, dict):
                  llm = {}

              user_message = t(llm.get("user_message"))
              manager_message = t(llm.get("manager_message"))
              panel_summary = t(llm.get("panel_summary"))
              recommended_actions = llm.get("recommended_actions") if isinstance(llm.get("recommended_actions"), list) else j(recommended_actions_json, [])
              if not isinstance(recommended_actions, list):
                  recommended_actions = []
              recommended_actions = [str(x).strip() for x in recommended_actions if str(x).strip()][:3]
              if not recommended_actions:
                  recommended_actions = j(recommended_actions_json, []) if isinstance(j(recommended_actions_json, []), list) else []
                  recommended_actions = [str(x).strip() for x in recommended_actions if str(x).strip()][:3]

              if not user_message:
                  if unlock_scope == "onboarding_only":
                      user_message = "请先生成成长计划，生成后再开始后续训练。"
                  elif unlock_scope == "stage1_locked":
                      user_message = "你当前可继续完成成长计划和当日任务，通过阶段1后会解锁更多功能。"
                  elif unlock_scope == "stage1_passed":
                      user_message = "你已通过阶段1，现已解锁自由练习和在岗助手。"
                  elif unlock_scope == "stage2_passed":
                      user_message = "你已通过阶段2，考试中心、竞赛看板和完整业务工作区已解锁。"
                  elif unlock_scope == "retry_required":
                      user_message = "本次阶段评审未通过，请先完成补训任务后再重新评审。"
                  else:
                      user_message = "已完成自动解锁判断。"

              if not manager_message:
                  manager_message = f"当前解锁范围：{unlock_scope}；建议动作：{next_action}；规则原因：{rule_reason}"

              if not panel_summary:
                  panel_summary = f"解锁范围 {unlock_scope}，下一步建议 {next_action}。"

              safe_output = {
                  "user_id": t(user_id_out),
                  "cycle_id": t(cycle_id_out),
                  "workflow_status": t(workflow_status, "success"),
                  "unlock_scope": t(unlock_scope),
                  "module_unlocks_json": t(module_unlocks_json, "{}"),
                  "next_route": t(next_route),
                  "next_action": t(next_action),
                  "user_message": user_message,
                  "manager_message": manager_message,
                  "panel_summary": panel_summary,
                  "recommended_actions_json": json.dumps(recommended_actions, ensure_ascii=False),
                  "unlock_diff_json": t(unlock_diff_json, "{}"),
                  "should_notify_user": n(should_notify_user, 0),
                  "should_notify_manager": n(should_notify_manager, 0),
                  "invalid_reason": "",
                  "normalized_snapshot_json": t(normalized_snapshot_json_out, "{}"),
                  "policy_snapshot_json": t(policy_snapshot_json, "{}"),
                  "raw_output": t(raw_output),
                }

              return {
                  "workflow_status": safe_output["workflow_status"],
                  "unlock_scope": safe_output["unlock_scope"],
                  "module_unlocks_json": safe_output["module_unlocks_json"],
                  "next_route": safe_output["next_route"],
                  "next_action": safe_output["next_action"],
                  "user_message": safe_output["user_message"],
                  "manager_message": safe_output["manager_message"],
                  "panel_summary": safe_output["panel_summary"],
                  "recommended_actions_json": safe_output["recommended_actions_json"],
                  "unlock_diff_json": safe_output["unlock_diff_json"],
                  "should_notify_user": safe_output["should_notify_user"],
                  "should_notify_manager": safe_output["should_notify_manager"],
                  "invalid_reason": safe_output["invalid_reason"],
                  "normalized_snapshot_json": safe_output["normalized_snapshot_json"],
                  "policy_snapshot_json": safe_output["policy_snapshot_json"],
                  "raw_output": safe_output["raw_output"],
                  "safe_output_json": json.dumps(safe_output, ensure_ascii=False),
                }
        code_language: python3
        desc: 规则结果优先，LLM 只补文案，最终输出安全收口
        outputs:
          invalid_reason: {type: string}
          manager_message: {type: string}
