      targetPosition: left
      type: custom
      width: 242
    - data:
        code: |-
          import json
          def t(v, d=""):
              s = str(v or "").strip()
              return s if s else d
          def n(v, d=0):
              try:
                  if v is None or str(v).strip() == "":
                      return int(d)
                  return int(float(v))
              except:
                  return int(d)
          def j(raw, default):
              if isinstance(raw, (dict, list)):
                  return raw
              s = t(raw)
              if not s:
                  return default
              try:
                  obj = json.loads(s)
                  return obj
              except:
                  return default
          def route_for(scope, next_cycle_id):
              if scope == "retry_required":
                  return "/frontend/#/daily-tasks"
              if scope in {"onboarding_only", "stage1_locked"}:
                  return "/frontend/#/growth-plan"
              if scope == "stage1_passed":
                  return "/frontend/#/free-practice"
              if scope == "stage2_passed":
                  return "/frontend/#/exam-center"
              return "/frontend/#/growth-plan"
          def main(user_id_out="", cycle_id_out="", cycle_type_out="", stage_no_out=0, stage_name_out="", review_score_out=0, is_pass_out=0, stage_status_out="", has_growth_plan_out=1, passed_stage1_final=0, passed_stage2_final=0, next_cycle_id_out="", retry_task_count_out=0, trigger_source_out="", unlock_matrix_version_out="v1", current_unlocks_out="{}", normalized_snapshot_json=""):
              stage_no = n(stage_no_out, 0)
              is_pass = n(is_pass_out, 0)
              has_growth_plan = n(has_growth_plan_out, 1)
              passed_stage1 = n(passed_stage1_final, 0)
              passed_stage2 = n(passed_stage2_final, 0)
              retry_task_count = n(retry_task_count_out, 0)
              current_unlocks = j(current_unlocks_out, {})
              if not isinstance(current_unlocks, dict):
                  current_unlocks = {}

              if not has_growth_plan:
                  unlock_scope = "onboarding_only"
                  module_unlocks = {
                      "growth_plan": True,
                      "daily_tasks": False,
                      "free_practice": False,
                      "exam_center": False,
                      "on_job_assistant": False,
                      "competition_dashboard": False,
                      "business_workspace": False,
                  }
                  next_action = "generate_growth_plan"
                  rule_reason = "用户尚未生成成长计划，仅允许进入成长计划入口。"
              elif is_pass == 0 and trigger_source_out == "review_stage":
                  unlock_scope = "retry_required"
                  module_unlocks = {
                      "growth_plan": True,
                      "daily_tasks": True,
                      "free_practice": False,
                      "exam_center": False,
                      "on_job_assistant": False,
                      "competition_dashboard": False,
                      "business_workspace": False,
                  }
                  next_action = "complete_retry_tasks"
                  rule_reason = "阶段评审未通过，需要补训，权限不扩张。"
              elif passed_stage2 == 1:
                  unlock_scope = "stage2_passed"
                  module_unlocks = {
                      "growth_plan": True,
                      "daily_tasks": True,
                      "free_practice": True,
                      "exam_center": True,
                      "on_job_assistant": True,
                      "competition_dashboard": True,
                      "business_workspace": True,
                  }
                  next_action = "enter_exam_center"
                  rule_reason = "已通过阶段2，解锁考试中心、竞赛看板和完整业务工作区。"
              elif passed_stage1 == 1:
                  unlock_scope = "stage1_passed"
                  module_unlocks = {
                      "growth_plan": True,
                      "daily_tasks": True,
                      "free_practice": True,
                      "exam_center": False,
                      "on_job_assistant": True,
                      "competition_dashboard": False,
                      "business_workspace": False,
                  }
                  next_action = "enter_free_practice"
                  rule_reason = "已通过阶段1，解锁自由练习与在岗助手。"
              else:
                  unlock_scope = "stage1_locked"
                  module_unlocks = {
                      "growth_plan": True,
                      "daily_tasks": True,
                      "free_practice": False,
                      "exam_center": False,
                      "on_job_assistant": False,
                      "competition_dashboard": False,
                      "business_workspace": False,
                  }
                  next_action = "complete_current_stage"
                  rule_reason = "尚未通过阶段1，仅开放成长计划与当日任务。"

              unlock_diff = {}
              for key, value in module_unlocks.items():
                  old_value = bool(current_unlocks.get(key, False))
                  new_value = bool(value)
                  if old_value != new_value:
                      unlock_diff[key] = {"from": old_value, "to": new_value}

              next_route = route_for(unlock_scope, next_cycle_id_out)
              should_notify_user = 1 if unlock_scope in {"retry_required", "stage1_passed", "stage2_passed"} else 0
              should_notify_manager = 1 if unlock_scope in {"retry_required", "stage2_passed"} else 0

              recommended_actions = []
              if unlock_scope == "onboarding_only":
                  recommended_actions = ["进入成长计划页面并生成个人成长计划"]
              elif unlock_scope == "stage1_locked":
                  recommended_actions = ["继续完成当前阶段每日任务", "完成阶段评审后再解锁更多模块"]
              elif unlock_scope == "stage1_passed":
                  recommended_actions = ["进入自由练习巩固能力", "开始使用在岗助手处理真实业务问题"]
              elif unlock_scope == "stage2_passed":
                  recommended_actions = ["进入考试中心参加正式考核", "查看竞赛看板追踪进度", "使用完整业务工作区开展实战"]
              elif unlock_scope == "retry_required":
                  recommended_actions = ["优先完成系统下发的补训任务", "补训完成后重新参加阶段评审"]

              return {
                  "workflow_status": "success",
                  "unlock_scope": unlock_scope,
                  "module_unlocks_json": json.dumps(module_unlocks, ensure_ascii=False),
                  "next_route": next_route,
