        code: "def main(final_scope_status: str = \"\",\n         final_scope_reason: str = \"\",\n         miss_message: str = \"\",\n         confidence_level: str = \"medium\",\n         raw_output: str = \"\",\n         fallback_llm_text: str = \"\") -> dict:\n    final_scope_status = str(final_scope_status or \"out_of_scope\").strip()\n    final_scope_reason = str(final_scope_reason or \"\").strip()\n    miss_message = str(miss_message or \"当前没有命中系统可直接查询的数据口径。\\n\\n你可以把问题改成更具体的对象、时间范围和指标后再查。\").strip()\n    fallback_llm_text = str(fallback_llm_text or \"\").strip()\n    summary_text = miss_message\n    if final_scope_status == \"blocked\":\n        route_type = \"blocked\"\n    elif final_scope_status == \"out_of_scope\":\n        route_type = \"out_of_scope\"\n    else:\n        route_type = \"unsupported\"\n    problem_note = final_scope_reason or (\"命中安全拦截\" if route_type == \"blocked\" else \"当前问题暂不支持直接查询\")\n    if route_type != \"blocked\" and fallback_llm_text:\n        summary_text = fallback_llm_text\n    return {\n        \"workflow_status\": \"unsupported\",\n        \"route_type\": route_type,\n        \"query_type\": \"unsupported\",\n        \"params_json\": \"{}\",\n        \"rewritten_query\": \"\",\n        \"fastapi_payload_json\": \"{}\",\n        \"summary_text\": summary_text,\n        \"confidence_level\": str(confidence_level or \"medium\").strip(),\n        \"can_query\": 0,\n        \"problem_note\": problem_note,\n        \"raw_output\": str(fallback_llm_text or raw_output or summary_text)\n    }\n"
