          code_scope_reason:
            type: string
          hint_keywords:
            type: string
          manager_role_out:
            type: string
          normalized_query:
            type: string
          query_length:
            type: number
          store_id_out:
            type: string
          time_anchor_out:
            type: string
        selected: false
        title: 输入规范化与规则预判
