    - data:
        code: "import json\nimport re\n\ndef extract_json(text: str):\n    text = str(text or \"\").strip()\n    if not text:\n        return {}\n\n    text = re.sub(r\"<think>[\\s\\S]*?</think>\", \"\", text, flags=re.I)\n    text = re.sub(r\"^```json\\s*\", \"\", text, flags=re.I)\n    text = re.sub(r\"^```\\s*\", \"\", text)\n    text = re.sub(r\"\\s*```$\", \"\", text)\n    text = text.strip()\n\n    try:\n        obj = json.loads(text)\n        return obj if isinstance(obj, dict) else {}\n    except Exception:\n        pass\n\n    m = re.search(r\"\\{[\\s\\S]*\\}\", text)\n    if m:\n        try:\n            obj = json.loads(m.group(0))\n            return obj if isinstance(obj, dict) else {}\n        except Exception:\n            pass\n\n    return {}\n\ndef main(\n    store_id_out: str = \"\",\n    normalized_query: str = \"\",\n    code_scope_flag = 1,\n    code_scope_reason: str = \"\",\n    code_risk_flag = 0,\n    code_risk_reason: str = \"\",\n    llm_text: str = \"\"\n) -> dict:\n    data = extract_json(llm_text)\n\n    scope_status = str(data.get(\"scope_status\") or \"out_of_scope\").strip()\n    scope_reason = str(data.get(\"scope_reason\") or \"\").strip()\n    template_hit = str(data.get(\"template_hit\") or \"no\").strip().lower()\n    query_type = str(data.get(\"query_type\") or \"unsupported\").strip()\n    rewritten_query = str(data.get(\"rewritten_query\") or normalized_query).strip()\n    confidence = str(data.get(\"confidence\") or \"medium\").strip().lower()\n    sql_query = str(data.get(\"sql_query\") or \"\").strip()\n    sql_params_json = data.get(\"sql_params_json\") or []\n    if not isinstance(sql_params_json, list):\n        sql_params_json = []\n\n    params = data.get(\"params\") or {}\n    if not isinstance(params, dict):\n        params = {}\n\n    try:\n        threshold_value = int(float(params.get(\"threshold_value\") or 0))\n    except Exception:\n        threshold_value = 0\n\n    params_final = {\n        \"time_range\": str(params.get(\"\
          time_range\") or \"unspecified\"),\n        \"threshold_op\": str(params.get(\"threshold_op\") or \"unspecified\"),\n        \"threshold_value\": threshold_value,\n        \"trend_direction\": str(params.get(\"trend_direction\") or \"unspecified\"),\n        \"risk_level\": str(params.get(\"risk_level\") or \"unspecified\"),\n        \"knowledge_tag\": str(params.get(\"knowledge_tag\") or \"\").strip(),\n        \"target_group\": str(params.get(\"target_group\") or \"unspecified\")\n    }\n\n    if str(code_risk_flag) in {\"1\", \"true\", \"True\"}:\n        final_scope_status = \"blocked\"\n        final_scope_reason = code_risk_reason or \"命中敏感/越权/注入类风险\"\n    elif str(code_scope_flag) in {\"0\", \"false\", \"False\"}:\n        final_scope_status = \"out_of_scope\"\n        final_scope_reason = code_scope_reason or \"超出门店一句话查询支持范围\"\n    else:\n        final_scope_status = scope_status if scope_status in {\"in_scope\", \"out_of_scope\", \"blocked\"} else \"out_of_scope\"\n        final_scope_reason = scope_reason or \"已完成范围识别\"\n\n    final_template_hit = \"yes\" if template_hit == \"yes\" and query_type != \"unsupported\" else \"no\"\n    can_query = 1 if final_scope_status == \"in_scope\" and (final_template_hit == \"yes\" or bool(sql_query)) else 0\n\n    miss_message = \"当前没有直接命中固定查询模板，我可以继续引导你改成更具体的门店数据问题。\"\n    if final_scope_status == \"blocked\":\n        miss_message = \"该请求涉及敏感、越权或不安全内容，系统不支持处理。\"\n    elif final_scope_status == \"out_of_scope\":\n        miss_message = \"这个问题和当前系统的一句话查询范围不太匹配。现在更适合查询：新人培训未完成、合规分偏低、陪练成绩下滑、近期高风险、重点跟进、知识点高频提问这几类问题。\"\n\n    fastapi_payload = {\n        \"store_id\": store_id_out,\n        \"query_type\": query_type if can_query == 1 else \"unsupported\",\n        \"rewritten_query\": rewritten_query,\n        \"query_params\": params_final,\n        \"scope_status\": final_scope_status,\n        \"confidence\": confidence,\n        \"sql\": sql_query,\n        \"sql_params_json\": sql_params_json\n    }\n\n    return\
          \ {\n        \"final_scope_status\": final_scope_status,\n        \"final_scope_reason\": final_scope_reason,\n        \"final_template_hit\": final_template_hit,\n        \"final_query_type\": query_type if can_query == 1 else \"unsupported\",\n        \"final_params_json\": json.dumps(params_final, ensure_ascii=False),\n        \"rewritten_query\": rewritten_query,\n        \"confidence_level\": confidence,\n        \"fastapi_payload_json\": json.dumps(fastapi_payload, ensure_ascii=False),\n        \"can_query\": can_query,\n        \"scope_blocked_flag\": 1 if final_scope_status == \"blocked\" else 0,\n        \"miss_message\": miss_message,\n        \"raw_output\": str(llm_text or \"\")\n    }\n"
