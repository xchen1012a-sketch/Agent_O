    - data:
        code: "import json\nimport re\n\ndef _parse_json(text: str, default):\n    try:\n        obj = json.loads(str(text or \"\").strip())\n        return obj\n    except Exception:\n        return default\n\ndef _extract_threshold(query: str):\n    q = str(query or \"\")\n    m = re.search(r'低于\\s*(\\d{1,3})', q)\n    if m:\n        try:\n            return int(m.group(1))\n        except Exception:\n            return 0\n    m = re.search(r'小于\\s*(\\d{1,3})', q)\n    if m:\n        try:\n            return int(m.group(1))\n        except Exception:\n            return 0\n    return 0\n\ndef _infer_time_range(query: str, current_value: str):\n    q = str(query or \"\")\n    cur = str(current_value or \"unspecified\").strip() or \"unspecified\"\n    if cur != \"unspecified\":\n        return cur\n    if \"这个月\" in q or \"本月\" in q:\n        return \"this_month\"\n    if \"最近7天\" in q or \"近7天\" in q or \"一周\" in q or \"最近一周\" in q:\n        return \"recent_7d\"\n    if \"最近90天\" in q or \"近90天\" in q or \"三个月\" in q or \"最近三个月\" in q:\n        return \"recent_90d\"\n    if \"最近\" in q or \"近期\" in q:\n        return \"recent_30d\"\n    return \"unspecified\"\n\ndef main(final_query_type: str = \"\",\n         final_params_json: str = \"{}\",\n         fastapi_payload_json: str = \"{}\",\n         rewritten_query: str = \"\") -> dict:\n    query_type = str(final_query_type or \"\").strip()\n    rewritten_query = str(rewritten_query or \"\").strip()\n\n    params = _parse_json(final_params_json, {})\n    if not isinstance(params, dict):\n        params = {}\n\n    payload = _parse_json(fastapi_payload_json, {})\n    if not isinstance(payload, dict):\n        payload = {}\n\n    normalized = {\n        \"time_range\": str(params.get(\"time_range\") or \"unspecified\"),\n        \"threshold_op\": str(params.get(\"threshold_op\") or \"unspecified\"),\n        \"threshold_value\": int(params.get(\"threshold_value\") or 0),\n        \"trend_direction\": str(params.get(\"trend_direction\"\
          ) or \"unspecified\"),\n        \"risk_level\": str(params.get(\"risk_level\") or \"unspecified\"),\n        \"knowledge_tag\": str(params.get(\"knowledge_tag\") or \"\").strip(),\n        \"target_group\": str(params.get(\"target_group\") or \"unspecified\")\n    }\n\n    normalized[\"time_range\"] = _infer_time_range(rewritten_query, normalized[\"time_range\"])\n\n    if query_type == \"training_unfinished_newcomer\":\n        if normalized[\"time_range\"] == \"unspecified\":\n            normalized[\"time_range\"] = \"this_month\"\n        normalized[\"target_group\"] = \"newcomer\"\n\n    elif query_type == \"low_compliance_staff\":\n        if normalized[\"threshold_op\"] == \"unspecified\":\n            normalized[\"threshold_op\"] = \"lt\"\n        if normalized[\"threshold_value\"] <= 0:\n            extracted = _extract_threshold(rewritten_query)\n            normalized[\"threshold_value\"] = extracted if extracted > 0 else 60\n        if normalized[\"target_group\"] == \"unspecified\":\n            normalized[\"target_group\"] = \"all_staff\"\n\n    elif query_type == \"practice_decline_staff\":\n        if normalized[\"time_range\"] == \"unspecified\":\n            normalized[\"time_range\"] = \"recent_30d\"\n        if normalized[\"trend_direction\"] == \"unspecified\":\n            normalized[\"trend_direction\"] = \"down\"\n        if normalized[\"target_group\"] == \"unspecified\":\n            normalized[\"target_group\"] = \"all_staff\"\n\n    elif query_type == \"recent_high_risk_staff\":\n        if normalized[\"time_range\"] == \"unspecified\":\n            normalized[\"time_range\"] = \"recent_30d\"\n        if normalized[\"risk_level\"] == \"unspecified\":\n            normalized[\"risk_level\"] = \"high\"\n        if normalized[\"target_group\"] == \"unspecified\":\n            normalized[\"target_group\"] = \"all_staff\"\n\n    elif query_type == \"followup_priority_staff\":\n        if normalized[\"time_range\"] == \"unspecified\":\n\
          \            normalized[\"time_range\"] = \"recent_30d\"\n        if normalized[\"target_group\"] == \"unspecified\":\n            normalized[\"target_group\"] = \"all_staff\"\n\n    elif query_type == \"high_freq_knowledge_tag_staff\":\n        if normalized[\"time_range\"] == \"unspecified\":\n            normalized[\"time_range\"] = \"recent_30d\"\n        if normalized[\"target_group\"] == \"unspecified\":\n            normalized[\"target_group\"] = \"all_staff\"\n\n    payload[\"query_type\"] = query_type\n    payload[\"rewritten_query\"] = rewritten_query\n    if payload.get(\"sql\"):\n        if isinstance(payload.get(\"params\"), list):\n            payload[\"sql_params_json\"] = payload.get(\"params\")\n        elif not isinstance(payload.get(\"sql_params_json\"), list):\n            payload[\"sql_params_json\"] = []\n    else:\n        payload[\"params\"] = normalized\n\n    completion_note = \"已完成参数兜底修正\"\n    return {\n        \"fixed_query_type\": query_type,\n        \"fixed_params_json\": json.dumps(normalized, ensure_ascii=False),\n        \"fixed_fastapi_payload_json\": json.dumps(payload, ensure_ascii=False),\n        \"fixed_rewritten_query\": rewritten_query,\n        \"completion_note\": completion_note\n    }\n"
