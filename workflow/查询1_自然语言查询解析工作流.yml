    - data:
        code: "import json\nimport re\n\ndef _extract_json(text: str):\n    text = str(text or \"\").strip()\n    if not text:\n        return {}\n    text = re.sub(r\"<think>[\\s\\S]*?</think>\", \"\", text, flags=re.I)\n    text = re.sub(r\"^```json\\s*\", \"\", text, flags=re.I)\n    text = re.sub(r\"^```\\s*\", \"\", text)\n    text = re.sub(r\"\\s*```$\", \"\", text)\n    text = text.strip()\n    try:\n        obj = json.loads(text)\n        return obj if isinstance(obj, dict) else {}\n    except Exception:\n        pass\n    m = re.search(r\"\\{[\\s\\S]*\\}\", text)\n    if m:\n        try:\n            obj = json.loads(m.group(0))\n            return obj if isinstance(obj, dict) else {}\n        except Exception:\n            pass\n    return {}\n\ndef main(llm_text: str = \"\", normalized_query: str = \"\") -> dict:\n    data = _extract_json(llm_text)\n    standardized_query = str(data.get(\"standardized_query\") or normalized_query or \"\").strip()\n    core_intent = str(data.get(\"core_intent\") or \"\").strip()\n    time_range_hint = str(data.get(\"time_range_hint\") or \"unspecified\").strip()\n    metric_hint = str(data.get(\"metric_hint\") or \"\").strip()\n    target_group_hint = str(data.get(\"target_group_hint\") or \"unspecified\").strip()\n    odd_query_flag = str(data.get(\"odd_query_flag\") or \"no\").strip().lower()\n    odd_query_reason = str(data.get(\"odd_query_reason\") or \"\").strip()\n    suggested_reask = str(data.get(\"suggested_reask\") or \"\").strip()\n\n    if not suggested_reask:\n        suggested_reask = \"例如：最近30天哪些员工合规分低于60分？\"\n\n    packed = standardized_query\n    extras = []\n    if core_intent:\n        extras.append(f\"意图={core_intent}\")\n    if time_range_hint and time_range_hint != \"unspecified\":\n        extras.append(f\"时间={time_range_hint}\")\n    if metric_hint:\n        extras.append(f\"指标={metric_hint}\")\n    if target_group_hint and target_group_hint != \"unspecified\":\n        extras.append(f\"对象={target_group_hint}\"\
          )\n    if extras:\n        packed = standardized_query + \" | \" + \" | \".join(extras)\n\n    return {\n        \"standardized_query_text\": standardized_query,\n        \"standardized_query_packed\": packed,\n        \"odd_query_flag_num\": 1 if odd_query_flag == \"yes\" else 0,\n        \"odd_query_reason\": odd_query_reason,\n        \"suggested_reask\": suggested_reask,\n        \"time_range_hint\": time_range_hint,\n        \"target_group_hint\": target_group_hint,\n        \"metric_hint\": metric_hint,\n        \"raw_normalizer_output\": str(llm_text or \"\")\n    }\n"
        code_language: python3
        desc: 解析标准化 LLM 输出 JSON，产出稳定的标准查询文本与奇怪问题标记
        outputs:
