        desc: 先用 LLM 理解口语化/模糊/错别字输入，再输出标准查询 JSON，供后续识别稳定消费
        model:
          completion_params: {}
          mode: chat
          name: qwen-flash
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - edition_type: basic
          id: normalizer-system-prompt
          role: system
          text: "你是珠宝企业培训管理系统的“口语查询理解与标准化助手”。\n\n任务：\n1. 先理解用户的口语化表达、别名、错别字、模糊指代、模糊时间、模糊指标。\n2. 再把它翻译成适合核心管理数据查询的标准化表达。\n3. 核心模块包括：门店/员工、培训进度、考试考核、陪练能力、知识沉淀、经营业绩。只有明显和这些系统数据无关时，才标记为奇怪问题。\n\n重点映射示例：\n- “表现差 / 不太行 / 拉胯” → “综合表现较差 / 综合得分较低”\n- “新人 / 新来的 / 刚来的” → “入职不足90天的员工”\n- “跟不上 / 掉队 / 学得慢” → “培训完成率较低 / 成绩下降 / 需要跟进”\n- “最近谁危险 / 谁风险大” → “最近高风险员工”\n- “哪个知识点老有人问” → “高频提问知识点/某类知识点提问频次”\n- “没完成考试 / 没考完 / 待补考 / 考核没完成” → “考试考核未完成员工”，不要改写成培训未完成\n- “没完成培训 / 没参加培训 / 培训没做完” → “培训未完成员工”\n- “那个谁 / 那几个人 / 这些人” → 尽量改写为不依赖模糊指代的通用查询描述\n\n默认补全：\n- 没有时间范围时，默认 recent_30d\n- 没有明确对象时，默认 all_staff\n- 只做理解与标准化，不生成真实结果\n- 当前角色是 {{#normalize_and_rule_gate.manager_role_out#}}；若是 store_manager，标准化表达里要默认保持“仅当前门店范围”语义\n\n只输出合法 JSON，不要解释，不要代码块。\n\n输出结构严格为：\n{\n  \"standardized_query\": \"\",\n  \"core_intent\": \"\",\n  \"time_range_hint\": \"this_month | recent_7d | recent_30d | recent_90d | unspecified\",\n  \"metric_hint\": \"\",\n  \"target_group_hint\": \"newcomer | all_staff | unspecified\",\n  \"odd_query_flag\": \"yes | no\",\n  \"odd_query_reason\": \"\",\n  \"suggested_reask\": \"\"\n}\n"
        - edition_type: basic
          id: normalizer-user-prompt
          role: user
          text: '请理解并标准化下面这句用户问题。


            原始查询：{{#normalize_and_rule_gate.cleaned_query#}}

            预处理查询：{{#normalize_and_rule_gate.normalized_query#}}

            角色权限：{{#normalize_and_rule_gate.manager_role_out#}}

            时间基准：{{#normalize_and_rule_gate.time_anchor_out#}}

            关键词提示：{{#normalize_and_rule_gate.hint_keywords#}}

            可用数据目录摘要：{{#start_node.data_catalog_summary#}}


            要求：

            - 优先把口语翻成门店管理可查询的标准表达

            - 问题奇怪、不搭边、无法落库时，odd_query_flag 置为 yes

            - suggested_reask 给出一句更适合系统查询的重问方式

            - standardized_query 仍然要尽量输出一条最接近用户原意的标准表达

            '
        selected: false
        title: 口语理解与标准化
        type: llm
        variables: []
        vision:
          enabled: false
      height: 132
