        code: "import json\nimport re\n\n\ndef _extract_json(text: str) -> dict:\n    raw = str(text or '').strip()\n    raw = re.sub(r'^```json\\s*', '', raw, flags=re.I)\n    raw = re.sub(r'^```\\s*', '', raw)\n    raw = re.sub(r'\\s*```$', '', raw)\n    if not raw:\n        return {}\n    try:\n        data = json.loads(raw)\n        return data if isinstance(data, dict) else {}\n    except Exception:\n        pass\n    m = re.search(r'\\{[\\s\\S]*\\}', raw)\n    if m:\n        try:\n            data = json.loads(m.group(0))\n            return data if isinstance(data, dict) else {}\n        except Exception:\n            pass\n    return {}\n\n\ndef _to_list(v):\n    if isinstance(v, list):\n        return [str(x).strip() for x in v if str(x).strip()]\n    if isinstance(v, str) and v.strip():\n        parts = re.split(r'[,，；;、|]+', v)\n        return [p.strip() for p in parts if p.strip()]\n    return []\n\n\ndef main(precheck_text: str = '', original_query: str = '', focus_modules_hint: str = '') -> dict:\n    data = _extract_json(precheck_text)\n    retrieval_needed = str(data.get('retrieval_needed') or 'yes').strip().lower()\n    if retrieval_needed not in {'yes', 'no'}:\n        retrieval_needed = 'yes'\n\n    optimized_query = str(data.get('optimized_query') or '').strip() or str(original_query or '').strip()\n    knowledge_focus_tags = _to_list(data.get('knowledge_focus_tags'))\n    focus_modules = _to_list(data.get('focus_modules'))\n    if not focus_modules:\n        focus_modules = _to_list(focus_modules_hint)\n    if not focus_modules:\n        focus_modules = ['产品知识', '合规表达', '销售沟通', '客户应答']\n\n    precheck_reason = str(data.get('precheck_reason') or '已使用默认检索策略。').strip()\n    kb_match_expectation = 'high' if retrieval_needed == 'yes' else 'low'\n\n    return {\n        'knowledge_gate': retrieval_needed,\n        'retrieval_query_final': optimized_query,\n        'input_topic': '成长计划生成',\n        'kb_match_expectation': kb_match_expectation,\n        'precheck_reason': precheck_reason,\n        'knowledge_focus_tags': json.dumps(knowledge_focus_tags, ensure_ascii=False),\n        'focus_modules_final': json.dumps(focus_modules, ensure_ascii=False)\n    }\n"
