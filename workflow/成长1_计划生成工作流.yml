    - data:
        code: "import json\nimport re\n\n\ndef _extract_json(text: str) -> dict:\n    raw = str(text or '').strip()\n    raw = re.sub(r'^```json\\s*', '', raw, flags=re.I)\n    raw = re.sub(r'^```\\s*', '', raw)\n    raw = re.sub(r'\\s*```$', '', raw)\n    raw = re.sub(r'<think>[\\s\\S]*?</think>', '', raw, flags=re.I)\n    if not raw:\n        return {}\n    try:\n        data = json.loads(raw)\n        return data if isinstance(data, dict) else {}\n    except Exception:\n        pass\n    m = re.search(r'\\{[\\s\\S]*\\}', raw)\n    if m:\n        try:\n            data = json.loads(m.group(0))\n            return data if isinstance(data, dict) else {}\n        except Exception:\n            pass\n    return {}\n\n\ndef _safe_list(v, default=None):\n    default = default or []\n    if isinstance(v, list):\n        arr = [str(x).strip() for x in v if str(x).strip()]\n        return arr or default\n    return default\n\n\ndef _safe_text(v, default=''):\n    if v is None:\n        return default\n    s = str(v).strip()\n    return s if s else default\n\n\ndef _fallback_plan(focus_modules):\n    stage1_days = []\n    stage2_days = []\n    s1_themes = ['岗位与产品基础', '黄金/K金/铂金基础', '证书与材质表达', '合规禁语与替代表达', '标准接待开场', '高频问答训练', '阶段1复盘']\n    s2_themes = ['价格异议处理', '真假质疑应答', '犹豫顾客推进', '连带销售与客单提升', '真实话术复练', '模拟顾客对练', '阶段2总结']\n    for i, theme in enumerate(s1_themes, 1):\n        stage1_days.append({\n            'day_no': i, 'day_label': f'Day{i}', 'theme': theme,\n            'learning_task': f'围绕“{theme}”完成知识学习与要点记录。',\n            'practice_task': f'完成 1 次与“{theme}”相关的口头复述或书面演练。',\n            'checkpoint': f'能用 1 分钟说清“{theme}”的核心表达。'\n        })\n    for idx, theme in enumerate(s2_themes, 8):\n        stage2_days.append({\n            'day_no': idx, 'day_label': f'Day{idx}', 'theme': theme,\n            'learning_task': f'围绕“{theme}”完成场景化学习与错题复盘。',\n            'practice_task': f'完成 1 次“{theme}”相关模拟对练或情景作答。',\n            'checkpoint': f'在对应场景下给出自然、合规、可成交的回应。'\n        })\n    return {\n        'profile_summary': {\n            '岗位定位': '珠宝门店销售',\n            '当前阶段': '基础成长阶段',\n            '主要优势': ['愿意学习', '具备基础服务意识'],\n            '主要短板': ['产品知识体系不稳', '高频场景表达不够成熟'],\n            '培养重点': focus_modules[:3] or ['产品知识', '合规表达', '销售沟通']\n        },\n        'stage_plans': [\n            {\n                'stage_no': 1,\n                'stage_name': '阶段1 基础建构',\n                'days_range': 'Day1-Day7',\n                'stage_goal': '先补基础知识与标准表达，建立门店接待底盘。',\n                'focus_modules': focus_modules[:3] or ['产品知识', '合规表达', '销售沟通'],\n                'daily_plan': stage1_days,\n                'stage_checkpoint': '能完成基础接待与高频问答。'\n            },\n            {\n                'stage_no': 2,\n                'stage_name': '阶段2 实战强化',\n                'days_range': 'Day8-Day14',\n                'stage_goal': '围绕真实顾客场景做异议处理与成交推进训练。',\n                'focus_modules': focus_modules[:4] or ['客户应答', '销售沟通', '合规表达'],\n                'daily_plan': stage2_days,\n                'stage_checkpoint': '能在关键异议场景中稳定应答并推进下一步。'\n            }\n        ],\n        'focus_modules': focus_modules[:4] or ['产品知识', '合规表达', '销售沟通', '客户应答'],\n        'first_round_focus': focus_modules[:2] or ['产品知识', '合规表达'],\n        'plan_summary': '先夯实基础、再进入场景强化，形成14天闭环训练节奏。'\n    }\n\n\ndef main(\n    knowledge_plan_text: str = '',\n    fallback_plan_text: str = '',\n    normalized_profile: str = '',\n    data_quality_label: str = '',\n    retrieved_count = 0,\n    knowledge_hit_status: str = 'miss',\n    source_strategy: str = 'llm_fallback',\n    focus_modules_out: str = '[]',\n    plan_cycle_days = 14,\n    stage_count_default = 2\n) -> dict:\n    data = _extract_json(knowledge_plan_text) or _extract_json(fallback_plan_text)\n    focus_modules = []\n    try:\n        focus_modules = json.loads(str(focus_modules_out or '[]'))\n        if not isinstance(focus_modules, list):\n            focus_modules = []\n    except Exception:\n        focus_modules = []\n    focus_modules = [str(x).strip() for x in focus_modules if str(x).strip()]\n\n    if not data:\n        data = _fallback_plan(focus_modules)\n\n    profile = data.get('profile_summary') or {}\n    stage_plans = data.get('stage_plans') or []\n    if not isinstance(stage_plans, list) or len(stage_plans) != 2:\n        data = _fallback_plan(focus_modules)\n        profile = data.get('profile_summary') or {}\n        stage_plans = data.get('stage_plans') or []\n\n    # Ensure 14 days total\n    normalized_stage_plans = []\n    all_days = []\n    for idx, stage in enumerate(stage_plans[:2], 1):\n        daily_plan = stage.get('daily_plan') if isinstance(stage, dict) else []\n        if not isinstance(daily_plan, list):\n            daily_plan = []\n        expected_start = 1 if idx == 1 else 8\n        normalized_days = []\n        for day_index in range(7):\n            source_item = daily_plan[day_index] if day_index < len(daily_plan) and isinstance(daily_plan[day_index], dict) else {}\n            day_no = expected_start + day_index\n            normalized_days.append({\n                'day_no': day_no,\n                'day_label': f'Day{day_no}',\n                'theme': _safe_text(source_item.get('theme'), f'训练主题{day_no}'),\n                'learning_task': _safe_text(source_item.get('learning_task'), '完成当日知识学习。'),\n                'practice_task': _safe_text(source_item.get('practice_task'), '完成当日练习任务。'),\n                'checkpoint': _safe_text(source_item.get('checkpoint'), '完成当日复盘与自查。')\n            })\n            all_days.append(day_no)\n        normalized_stage_plans.append({\n            'stage_no': idx,\n            'stage_name': _safe_text(stage.get('stage_name'), '阶段1 基础建构' if idx == 1 else '阶段2 实战强化'),\n            'days_range': _safe_text(stage.get('days_range'), 'Day1-Day7' if idx == 1 else 'Day8-Day14'),\n            'stage_goal': _safe_text(stage.get('stage_goal'), '完成本阶段重点训练目标。'),\n            'focus_modules': _safe_list(stage.get('focus_modules'), focus_modules[:3] if idx == 1 else focus_modules[:4]),\n            'daily_plan': normalized_days,\n            'stage_checkpoint': _safe_text(stage.get('stage_checkpoint'), '完成本阶段检查点。')\n        })\n\n    final_focus_modules = _safe_list(data.get('focus_modules'), focus_modules or ['产品知识', '合规表达', '销售沟通', '客户应答'])\n    first_round_focus = _safe_list(data.get('first_round_focus'), final_focus_modules[:2])\n    plan_summary = _safe_text(data.get('plan_summary'), '本计划采用14天2阶段结构，先打基础再练场景。')\n\n    markdown_lines = []\n    markdown_lines.append('# 成长计划')\n    markdown_lines.append('## 画像概览')\n    markdown_lines.append(f\"- 岗位定位：{_safe_text(profile.get('岗位定位'), '珠宝门店销售')}\")\n    markdown_lines.append(f\"- 当前阶段：{_safe_text(profile.get('当前阶段'), '成长阶段')}\")\n    markdown_lines.append(f\"- 主要优势：{'；'.join(_safe_list(profile.get('主要优势'), ['愿意学习']))}\")\n    markdown_lines.append(f\"- 主要短板：{'；'.join(_safe_list(profile.get('主要短板'), ['需要进一步观察']))}\")\n    markdown_lines.append(f\"- 培养重点：{'；'.join(_safe_list(profile.get('培养重点'), final_focus_modules[:3]))}\")\n    markdown_lines.append('')\n    markdown_lines.append('## 阶段重点模块')\n    for item in final_focus_modules:\n        markdown_lines.append(f'- {item}')\n    markdown_lines.append('')\n\n    for stage in normalized_stage_plans:\n        markdown_lines.append(f\"## {stage['stage_name']}（{stage['days_range']}）\")\n        markdown_lines.append(f\"- 阶段目标：{stage['stage_goal']}\")\n        markdown_lines.append(f\"- 阶段重点：{'、'.join(stage['focus_modules'])}\")\n        markdown_lines.append(f\"- 阶段检查点：{stage['stage_checkpoint']}\")\n        markdown_lines.append('')\n        for day in stage['daily_plan']:\n            markdown_lines.append(f\"### {day['day_label']}｜{day['theme']}\")\n            markdown_lines.append(f\"- 学习任务：{day['learning_task']}\")\n            markdown_lines.append(f\"- 练习任务：{day['practice_task']}\")\n            markdown_lines.append(f\"- 自查点：{day['checkpoint']}\")\n            markdown_lines.append('')\n\n    markdown_lines.append('## 首轮训练重点')\n    for item in first_round_focus:\n        markdown_lines.append(f'- {item}')\n    markdown_lines.append('')\n    markdown_lines.append('## 计划说明')\n    markdown_lines.append(f'- {plan_summary}')\n\n    final_markdown = '\\n'.join(markdown_lines).strip()\n    workflow_result = {\n        'growth_plan_markdown': final_markdown,\n        'stage_count': 2,\n        'stage_plans': normalized_stage_plans,\n        'focus_modules': final_focus_modules,\n        'plan_cycle_days': int(plan_cycle_days or 14),\n        'plan_summary': plan_summary,\n        'first_round_focus': first_round_focus,\n        'knowledge_hit_status': str(knowledge_hit_status or 'miss'),\n        'retrieved_count': int(retrieved_count or 0),\n        'source_strategy': str(source_strategy or 'llm_fallback'),\n        'data_quality_label': data_quality_label,\n        'normalized_profile': json.loads(normalized_profile) if str(normalized_profile or '').strip().startswith('{') else normalized_profile,\n    }\n\n    return {\n        'final_markdown': final_markdown,\n        'stage_count': 2,\n        'stage_plans_json': json.dumps(normalized_stage_plans, ensure_ascii=False),\n        'focus_modules_json': json.dumps(final_focus_modules, ensure_ascii=False),\n        'plan_cycle_days': int(plan_cycle_days or 14),\n        'plan_summary': plan_summary,\n        'workflow_result': json.dumps(workflow_result, ensure_ascii=False),\n        'normalized_profile_out': normalized_profile\n    }\n"
