    - data:
        code: "import json\nimport re\n\n\ndef _clean(v, default='未提供'):\n    if v is None:\n        return default\n    s = str(v).strip()\n    return s if s else default\n\n\ndef _safe_source(v: str) -> str:\n    s = str(v or '').strip()\n    return s if s else 'fastapi'\n\n\ndef _safe_trace(v: str) -> str:\n    s = str(v or '').strip()\n    return s if s else 'trace_growth_plan_auto'\n\n\ndef _classify_stage(employee_stage: str, reset_mode: str, historical_learning: str, current_performance: str) -> str:\n    text = ' '.join([str(employee_stage or ''), str(reset_mode or ''), str(historical_learning or ''), str(current_performance or '')]).lower()\n    retrain_keys = ['重训', '老员工', '返训', '补训', 'retrain', 'force_reset']\n    if any(k in text for k in retrain_keys):\n        return '老员工重训'\n    return '新人首训'\n\n\ndef _normalize_job(job_title: str) -> str:\n    t = str(job_title or '').strip()\n    if not t:\n        return '珠宝门店销售'\n    mapping = {\n        '黄金导购': '黄金导购',\n        '珠宝顾问': '珠宝顾问',\n        '店员': '珠宝门店销售',\n        '导购': '珠宝门店销售',\n        '销售': '珠宝门店销售',\n    }\n    for k, v in mapping.items():\n        if k in t:\n            return v\n    return t\n\n\ndef _data_quality(fields):\n    score = 0\n    for item in fields:\n        t = str(item or '').strip()\n        if t and t not in {'未提供', '无'}:\n            score += 1\n    if score >= 7:\n        return 'high'\n    if score >= 4:\n        return 'medium'\n    return 'low'\n\n\ndef _focus_modules(target_direction: str, initial_ability: str, self_intro: str):\n    text = ' '.join([str(target_direction or ''), str(initial_ability or ''), str(self_intro or '')])\n    modules = []\n    rules = [\n        ('产品知识', ['产品', '材质', '工艺', '证书', '黄金', 'k金', '钻石', '翡翠']),\n        ('合规表达', ['合规', '禁语', '红线', '承诺', '保值', '升值']),\n        ('销售沟通', ['销售', '沟通', '接待', '成交', '连带', '客单价']),\n        ('客户应答', ['应答', '异议', '嫌贵', '真假', '犹豫', '先看看']),\n    ]\n    lower = text.lower()\n    for name, keywords in rules:\n        if any(k.lower() in lower for k in keywords):\n            modules.append(name)\n    if not modules:\n        modules = ['产品知识', '合规表达', '销售沟通', '客户应答']\n    return modules[:4]\n\n\ndef main(\n    user_id: str = '',\n    source: str = '',\n    trace_id: str = '',\n    employee_name: str = '',\n    job_title: str = '',\n    self_intro: str = '',\n    historical_learning: str = '',\n    initial_ability: str = '',\n    employee_stage: str = '',\n    target_direction: str = '',\n    current_performance: str = '',\n    target_performance: str = '',\n    reset_mode: str = ''\n) -> dict:\n    user_id = _clean(user_id, 'UNKNOWN_USER')\n    source = _safe_source(source)\n    trace_id = _safe_trace(trace_id)\n    employee_name = _clean(employee_name)\n    job_title_raw = _clean(job_title, '珠宝门店销售')\n    job_title_norm = _normalize_job(job_title_raw)\n    self_intro = _clean(self_intro, '未提供自我介绍')\n    historical_learning = _clean(historical_learning)\n    initial_ability = _clean(initial_ability)\n    employee_stage_input = _clean(employee_stage)\n    employee_stage_norm = _classify_stage(employee_stage_input, reset_mode, historical_learning, current_performance)\n    target_direction = _clean(target_direction)\n    current_performance = _clean(current_performance)\n    target_performance = _clean(target_performance)\n    reset_mode = str(reset_mode or 'auto').strip() or 'auto'\n\n    data_quality = _data_quality([\n        employee_name, job_title_norm, self_intro, historical_learning, initial_ability,\n        employee_stage_input, target_direction, current_performance, target_performance\n    ])\n    data_quality_label = {\n        'high': '信息完整，可做强个性化计划',\n        'medium': '信息中等，采用半个性化计划',\n        'low': '信息有限，采用稳妥模板计划',\n    }[data_quality]\n\n    focus_modules = _focus_modules(target_direction, initial_ability, self_intro)\n    plan_cycle_days = 14\n    stage_count = 2\n    template_name = '14天2阶段成长计划'\n\n    normalized_profile = {\n        'user_id': user_id,\n        'source': source,\n        'trace_id': trace_id,\n        'employee_name': employee_name,\n        'job_title': job_title_norm,\n        'self_intro': self_intro,\n        'historical_learning': historical_learning,\n        'initial_ability': initial_ability,\n        'employee_stage': employee_stage_norm,\n        'target_direction': target_direction,\n        'current_performance': current_performance,\n        'target_performance': target_performance,\n        'reset_mode': reset_mode,\n        'data_quality': data_quality,\n        'stage_count': stage_count,\n        'plan_cycle_days': plan_cycle_days,\n        'focus_modules': focus_modules,\n        'template_name': template_name,\n    }\n\n    profile_card = f\"\"\"【员工基础信息】\nuser_id：{user_id}\nsource：{source}\ntrace_id：{trace_id}\n员工姓名：{employee_name}\n岗位：{job_title_norm}\n员工阶段：{employee_stage_norm}\nreset_mode：{reset_mode}\n\n【员工画像】\n自我介绍：{self_intro}\n历史学习记录：{historical_learning}\n初始能力：{initial_ability}\n目标方向：{target_direction}\n当前表现：{current_performance}\n目标表现：{target_performance}\n\n【计划硬约束】\n固定模板：{template_name}\n阶段数：2\n总天数：14\n重点模块：{'、'.join(focus_modules)}\n数据质量：{data_quality_label}\n\"\"\"\n\n    retrieval_query = (\n        f\"珠宝门店 培训计划 14天 2阶段 岗位 {job_title_norm} 阶段 {employee_stage_norm} \"\n        f\"重点 {' '.join(focus_modules)} 目标 {target_direction}\"\n    )\n\n    fallback_knowledge = \"\"\"【成长计划兜底框架】\n1. 本工作流必须固定输出 14 天、2 阶段结构：阶段1 为基础建构（Day1-Day7），阶段2 为实战强化（Day8-Day14）。\n2. 阶段1优先夯实产品知识、合规表达、标准接待与高频问答；阶段2优先强化异议处理、成交推进、连带销售和复盘改进。\n3. 对新人首训，应先补基础、再上实战；对老员工重训，应优先围绕历史薄弱项、近期问题和目标业绩做针对性补强。\n4. 每天都要有学习主题、学习任务、练习任务和验证方式，不能只写空泛目标。\n5. 输出必须兼容前端展示和后端落库，不能夹带思考过程。\"\"\"\n\n    return {\n        'profile_card': profile_card,\n        'normalized_profile': json.dumps(normalized_profile, ensure_ascii=False),\n        'retrieval_query': retrieval_query,\n        'fallback_knowledge': fallback_knowledge,\n        'data_quality_label': data_quality_label,\n        'employee_stage_norm': employee_stage_norm,\n        'plan_cycle_days': plan_cycle_days,\n        'stage_count_default': stage_count,\n        'focus_modules_hint': json.dumps(focus_modules, ensure_ascii=False)\n    }\n"
        code_language: python3
        desc: 清洗输入、识别新人/重训、固定14天2阶段模板，并输出标准化画像。
