    - data:
        code: "import json\n\n\ndef _safe_text(v, default=''):\n    if v is None:\n        return default\n    s = str(v).strip()\n    return s if s else default\n\n\ndef _parse_list_text(v):\n    try:\n        data = json.loads(str(v or '[]'))\n        if isinstance(data, list):\n            return [str(x).strip() for x in data if str(x).strip()]\n    except Exception:\n        pass\n    return []\n\n\ndef main(\n    profile_card: str = '',\n    normalized_profile: str = '',\n    fallback_knowledge: str = '',\n    data_quality_label: str = '',\n    knowledge_gate: str = 'yes',\n    kb_match_expectation: str = 'medium',\n    precheck_reason: str = '',\n    focus_modules_final: str = '[]',\n    stage_count_default = 2,\n    plan_cycle_days = 14,\n    retrieved_docs=None\n) -> dict:\n    docs = retrieved_docs or []\n    blocks = []\n    effective_count = 0\n    total_len = 0\n    for idx, doc in enumerate(docs[:4], 1):\n        title = ''\n        content = ''\n        if isinstance(doc, dict):\n            title = str(doc.get('title') or doc.get('name') or '')\n            content = str(doc.get('content') or doc.get('segment') or doc.get('text') or '')\n            if not content:\n                metadata = doc.get('metadata') or {}\n                doc_meta = metadata.get('doc_metadata') or {}\n                content = str(doc_meta.get('content') or '')\n        else:\n            content = str(doc or '')\n        title = title.strip()\n        content = content.strip()\n        if content:\n            effective_count += 1\n            total_len += len(content)\n        block = f\"[知识片段{idx}]\"\n        if title:\n            block += f\"\\n标题：{title}\"\n        if content:\n            block += f\"\\n内容：{content}\"\n        blocks.append(block)\n\n    knowledge_gate = _safe_text(knowledge_gate, 'yes').lower()\n    if knowledge_gate == 'no':\n        knowledge_hit_status = 'skip'\n        route_reason = '检索前预判认为无需依赖知识库，直接走通用训练框架。'\n    elif effective_count >= 2 and total_len >= 300:\n        knowledge_hit_status = 'hit'\n        route_reason = f'命中 {effective_count} 条有效知识片段，适合做知识增强成长计划。'\n    elif effective_count >= 1 and total_len >= 100:\n        knowledge_hit_status = 'weak_hit'\n        route_reason = '命中知识片段有限，采用知识片段 + 通用框架联合生成。'\n    else:\n        knowledge_hit_status = 'miss'\n        route_reason = '知识片段不足，转入通用训练框架兜底。'\n\n    source_strategy = 'knowledge_base' if knowledge_hit_status == 'hit' else ('hybrid' if knowledge_hit_status == 'weak_hit' else 'llm_fallback')\n    focus_modules = _parse_list_text(focus_modules_final)\n    if not focus_modules:\n        focus_modules = ['产品知识', '合规表达', '销售沟通', '客户应答']\n\n    return {\n        'profile_card': profile_card,\n        'normalized_profile_out': normalized_profile,\n        'fallback_knowledge': fallback_knowledge,\n        'data_quality_label_out': data_quality_label,\n        'knowledge_hit_status': knowledge_hit_status,\n        'route_reason': route_reason,\n        'knowledge_context': '\\n\\n'.join(blocks) if blocks else '未命中有效知识片段。',\n        'retrieved_count': effective_count,\n        'source_strategy': source_strategy,\n        'precheck_reason_out': precheck_reason,\n        'focus_modules_out': json.dumps(focus_modules, ensure_ascii=False),\n        'stage_count_default_out': int(stage_count_default or 2),\n        'plan_cycle_days_out': int(plan_cycle_days or 14)\n    }\n"
        code_language: python3
        desc: 判断知识命中质量，输出命中状态、上下文与路由原因。
