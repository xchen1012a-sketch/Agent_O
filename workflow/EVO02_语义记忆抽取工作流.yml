app:
  description: Evo Phase 2 semantic memory extraction workflow. Converts a corrected or disliked answer into one structured memory candidate.
  icon: 🧠
  icon_background: '#E6F4FF'
  mode: workflow
  name: EVO02 语义记忆抽取工作流
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.1.32@20a5454088fa017b72490e1cbaeebff21094d11b13e41197591734d1c08cdbb5
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      image:
        enabled: false
        number_limits: 3
        transfer_methods: []
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: semantic-start-to-llm
      source: semantic_start
      sourceHandle: source
      target: semantic_llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: code
      id: semantic-llm-to-normalize
      source: semantic_llm
      sourceHandle: source
      target: semantic_normalize
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: semantic-normalize-to-end
      source: semantic_normalize
      sourceHandle: source
      target: semantic_end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: Inputs supplied by backend.evo.semantic_extractor._extract_with_dify.
        selected: false
        title: Start
        type: start
        variables:
        - label: User ID
          max_length: 64
          options: []
          required: false
          type: text-input
          variable: user_id
        - label: Store ID
          max_length: 64
          options: []
          required: false
          type: text-input
          variable: store_id
        - label: Original customer/user query
          max_length: 2000
          options: []
          required: false
          type: paragraph
          variable: query_text
        - label: Wrong answer
          max_length: 4000
          options: []
          required: false
          type: paragraph
          variable: wrong
        - label: Corrected answer or correction
          max_length: 4000
          options: []
          required: false
          type: paragraph
          variable: correct
        - label: Feedback signal
          max_length: 64
          options: []
          required: false
          type: text-input
          variable: feedback_signal
      height: 320
      id: semantic_start
      position:
        x: 30
        y: 250
      positionAbsolute:
        x: 30
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Extract one stable memory candidate.
        model:
          completion_params:
            enable_thinking: false
            temperature: 0.1
          mode: chat
          name: qwen-flash
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - edition_type: basic
          id: semantic-system
          role: system
          text: "You extract reusable memory for a jewelry retail training assistant. Output JSON only. Do not include markdown. The memory must be specific, safe, and useful for future answers. Do not create a memory if the correction is vague; instead still output the best concise rule. JSON schema: {\"trigger\":\"when this memory should be recalled\",\"content\":\"what the assistant must remember or avoid\",\"scope_suggestion\":\"user|store|global\",\"confidence\":0.1}"
        - edition_type: basic
          id: semantic-user
          role: user
          text: "user_id: {{#semantic_start.user_id#}}\nstore_id: {{#semantic_start.store_id#}}\nfeedback_signal: {{#semantic_start.feedback_signal#}}\n\nOriginal query:\n{{#semantic_start.query_text#}}\n\nWrong answer:\n{{#semantic_start.wrong#}}\n\nCorrection:\n{{#semantic_start.correct#}}\n\nReturn one JSON object with trigger, content, scope_suggestion, confidence."
        selected: false
        title: Extract Semantic Memory
        type: llm
        variables: []
        vision:
          enabled: false
      height: 132
      id: semantic_llm
      position:
        x: 360
        y: 250
      positionAbsolute:
        x: 360
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "import json\nimport re\n\ndef _extract_json(text):\n    raw = str(text or '').strip()\n    raw = re.sub(r'<think>[\\s\\S]*?</think>', '', raw, flags=re.I).strip()\n    raw = re.sub(r'^```json\\s*', '', raw, flags=re.I)\n    raw = re.sub(r'^```\\s*', '', raw)\n    raw = re.sub(r'\\s*```$', '', raw)\n    try:\n        data = json.loads(raw)\n        return data if isinstance(data, dict) else {}\n    except Exception:\n        pass\n    m = re.search(r'\\{[\\s\\S]*\\}', raw)\n    if m:\n        try:\n            data = json.loads(m.group(0))\n            return data if isinstance(data, dict) else {}\n        except Exception:\n            pass\n    return {}\n\ndef _text(value, default=''):\n    s = str(value or '').strip()\n    return s if s else default\n\ndef _scope(value):\n    s = _text(value, 'user').lower()\n    if s in {'store', '门店'}:\n        return 'store'\n    if s in {'global', 'company', '全局', '公司'}:\n        return 'global'\n    return 'user'\n\ndef _confidence(value):\n    try:\n        n = float(value)\n    except Exception:\n        n = 0.6\n    return max(0.1, min(1.0, n))\n\ndef main(text: str, query_text: str = '', correct: str = '', wrong: str = '') -> dict:\n    data = _extract_json(text)\n    content = _text(data.get('content') or data.get('memory_content') or correct)\n    trigger = _text(data.get('trigger') or data.get('trigger_text') or query_text or wrong)\n    result = {\n        'trigger': trigger[:500],\n        'trigger_text': trigger[:500],\n        'content': content[:1200],\n        'memory_content': content[:1200],\n        'scope_suggestion': _scope(data.get('scope_suggestion') or data.get('scope_type')),\n        'confidence': _confidence(data.get('confidence')),\n    }\n    result['semantic_json'] = json.dumps(result, ensure_ascii=False)\n    return result\n"
        code_language: python3
        desc: Normalize LLM output into the exact fields parsed by backend.
        outputs:
          confidence:
            children: null
            type: number
          content:
            children: null
            type: string
          memory_content:
            children: null
            type: string
          scope_suggestion:
            children: null
            type: string
          semantic_json:
            children: null
            type: string
          trigger:
            children: null
            type: string
          trigger_text:
            children: null
            type: string
        selected: false
        title: Normalize Semantic JSON
        type: code
        variables:
        - value_selector:
          - semantic_llm
          - text
          variable: text
        - value_selector:
          - semantic_start
          - query_text
          variable: query_text
        - value_selector:
          - semantic_start
          - correct
          variable: correct
        - value_selector:
          - semantic_start
          - wrong
          variable: wrong
      height: 96
      id: semantic_normalize
      position:
        x: 690
        y: 250
      positionAbsolute:
        x: 690
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        desc: Outputs consumed by backend.evo.semantic_extractor.
        outputs:
        - value_selector:
          - semantic_normalize
          - trigger
          variable: trigger
        - value_selector:
          - semantic_normalize
          - trigger_text
          variable: trigger_text
        - value_selector:
          - semantic_normalize
          - content
          variable: content
        - value_selector:
          - semantic_normalize
          - memory_content
          variable: memory_content
        - value_selector:
          - semantic_normalize
          - scope_suggestion
          variable: scope_suggestion
        - value_selector:
          - semantic_normalize
          - confidence
          variable: confidence
        - value_selector:
          - semantic_normalize
          - semantic_json
          variable: semantic_json
        selected: false
        title: End
        type: end
      height: 260
      id: semantic_end
      position:
        x: 1020
        y: 250
      positionAbsolute:
        x: 1020
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport:
      x: 0
      y: 0
      zoom: 0.9
  rag_pipeline_variables: []
