              char_count: int = 0,
              round_count: int = 0,
              sample_status: str = "",
              llm_text: str = ""
          ) -> dict:
              import json
              import re

              def clamp_score(v, default=0):
                  try:
                      n = int(round(float(v)))
                  except Exception:
                      n = int(default)
                  return max(0, min(100, n))

              def non_negative_int(v, default=0):
                  try:
                      n = int(round(float(v)))
                  except Exception:
                      n = int(default)
                  return max(0, n)

              def ensure_list(v):
                  if isinstance(v, list):
                      return [str(i).strip() for i in v if str(i).strip()]
                  if isinstance(v, str) and v.strip():
                      return [v.strip()]
                  return []

              def ensure_text(v, default=""):
                  if v is None:
                      return default
                  s = str(v).strip()
                  return s if s else default

              def parse_llm_payload(raw_text):
                  if raw_text is None:
                      return {}

                  text = str(raw_text).strip()
                  if not text or text.lower() == "null":
                      return {}

                  fence_match = re.search(r"```(?:json)?\s*(.*?)\s*```", text, flags=re.S)
                  if fence_match:
                      text = fence_match.group(1).strip()

                  try:
                      parsed = json.loads(text)
                      if isinstance(parsed, dict):
                          return parsed
                      if isinstance(parsed, list):
                          if parsed and isinstance(parsed[0], dict):
                              return parsed[0]
                          return {}
                      return {}
                  except Exception:
                      pass

                  obj_match = re.search(r"\{[\s\S]*\}", text)
                  if obj_match:
                      candidate = obj_match.group(0).strip()
                      try:
                          parsed = json.loads(candidate)
                          if isinstance(parsed, dict):
                              return parsed
                      except Exception:
                          pass

                  return {}

              raw = llm_text
              payload = parse_llm_payload(raw)

              ds = payload.get("dimension_scores", {})
              if not isinstance(ds, dict):
                  ds = {}

              need_score = clamp_score(ds.get("需求洞察", 0), 0)
              product_score = clamp_score(ds.get("专业准确", 0), 0)
              objection_score = clamp_score(ds.get("异议处理", 0), 0)
              closing_score = clamp_score(ds.get("成交推进", 0), 0)
              expression_score = clamp_score(ds.get("表达自然", 0), 0)
              compliance_score = clamp_score(ds.get("合规安全", 0), 0)

              overall_score = clamp_score(payload.get("overall_score", 0), 0)

              level = ensure_text(payload.get("level"), "待加强")
              if level not in ["待加强", "合格", "良好", "优秀"]:
                  level = "待加强"

              weak_dimension = ensure_text(payload.get("weak_dimension"), "异议处理")
              risk_tags = ensure_list(payload.get("risk_tags"))
              highlights = ensure_list(payload.get("highlights"))[:3]
              problem_points = ensure_list(payload.get("problem_points"))[:4]
              storage_tags = ensure_list(payload.get("storage_tags"))[:6]

              concise_feedback = ensure_text(payload.get("concise_feedback"), "本次陪练已完成评估。")
              improvement_advice = ensure_text(
                  payload.get("improvement_advice"),
                  "下一轮请先回应客户顾虑，再推进成交。"
              )
              followup_training = ensure_text(payload.get("followup_training"), "加强异议处理训练")

              try:
                  confidence = float(payload.get("confidence", 0.7))
              except Exception:
                  confidence = 0.7
              confidence = max(0.0, min(1.0, confidence))

              sample_char_count = non_negative_int(payload.get("sample_char_count", char_count), char_count)
              sample_round_count = non_negative_int(payload.get("sample_round_count", round_count), round_count)
              final_sample_status = ensure_text(payload.get("sample_status"), ensure_text(sample_status, "adequate"))

              if "合规表达风险" in risk_tags or compliance_score < 60 or overall_score < 60:
                  risk_level = "high"
              elif overall_score < 75:
                  risk_level = "medium"
              else:
                  risk_level = "low"

              pass_flag = 1
              if overall_score < 70:
                  pass_flag = 0
              if "合规表达风险" in risk_tags:
                  pass_flag = 0
              if final_sample_status == "insufficient" and overall_score < 75:
                  pass_flag = 0

              result = {
                  "evaluation_status": "success",
                  "score_branch": "practice",
                  "practice_id": ensure_text(practice_id),
                  "user_id": ensure_text(user_id),
                  "module_code": ensure_text(module_code),
                  "module_name": ensure_text(module_name),
                  "cycle_id": ensure_text(cycle_id),
                  "stage_no": non_negative_int(stage_no, 0),
                  "trainee_name": ensure_text(trainee_name),
                  "scenario_type": ensure_text(payload.get("scenario_type"), ensure_text(scenario_type)),
                  "sample_status": final_sample_status,
                  "sample_char_count": sample_char_count,
                  "sample_round_count": sample_round_count,
                  "overall_score": overall_score,
                  "pass_flag": pass_flag,
                  "level": level,
                  "risk_level": risk_level,
                  "dimension_scores": {
                      "需求洞察": need_score,
                      "专业准确": product_score,
                      "异议处理": objection_score,
                      "成交推进": closing_score,
                      "表达自然": expression_score,
                      "合规安全": compliance_score
                  },
                  "weak_dimension": weak_dimension,
                  "risk_tags": risk_tags,
                  "highlights": highlights,
                  "problem_points": problem_points,
                  "improvement_advice": improvement_advice,
                  "concise_feedback": concise_feedback,
                  "followup_training": followup_training,
                  "storage_tags": storage_tags,
                  "confidence": confidence
              }

              return {
                  "evaluation_result": json.dumps(result, ensure_ascii=False),
                  "evaluation_status": result["evaluation_status"],
                  "score_branch": result["score_branch"],
                  "practice_id": result["practice_id"],
                  "user_id": result["user_id"],
                  "module_code": result["module_code"],
                  "module_name": result["module_name"],
                  "cycle_id": result["cycle_id"],
                  "stage_no": result["stage_no"],
                  "trainee_name": result["trainee_name"],
                  "scenario_type": result["scenario_type"],
                  "sample_status": result["sample_status"],
                  "sample_char_count": result["sample_char_count"],
                  "sample_round_count": result["sample_round_count"],
                  "overall_score": result["overall_score"],
                  "pass_flag": result["pass_flag"],
                  "level": result["level"],
                  "risk_level": result["risk_level"],
                  "need_insight_score": need_score,
                  "product_accuracy_score": product_score,
                  "objection_handling_score": objection_score,
                  "closing_push_score": closing_score,
                  "expression_natural_score": expression_score,
                  "compliance_safety_score": compliance_score,
                  "weak_dimension": result["weak_dimension"],
                  "risk_tags": result["risk_tags"],
                  "highlights": result["highlights"],
                  "problem_points": result["problem_points"],
                  "improvement_advice": result["improvement_advice"],
                  "concise_feedback": result["concise_feedback"],
                  "followup_training": result["followup_training"],
                  "storage_tags": result["storage_tags"],
                  "raw_llm_output": "" if raw is None else str(raw)
              }
