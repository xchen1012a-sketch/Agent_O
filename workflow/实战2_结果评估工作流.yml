    - data:
        code: |-
          def main(
              practice_id: str = "",
              user_id: str = "",
              module_code: str = "",
              module_name: str = "",
              cycle_id: str = "",
              stage_no = 0,
              trainee_name: str = "",
              scenario_type: str = "",
              target_focus: str = "",
              performance_gap_summary: str = "",
              target_metric: str = "",
              recommended_action: str = "",
              dialogue_text: str = ""
          ) -> dict:
              import re

              module_name_map = {
                  "product_basics": "产品基础",
                  "compliance_expression": "合规表达",
                  "customer_opening": "接待开场",
                  "needs_discovery": "需求挖掘",
                  "objection_handling": "异议处理",
                  "combo_recommendation": "搭配推荐",
                  "closing_conversion": "成交推进",
                  "independent_service": "独立上岗",
                  "final_review": "综合复盘"
              }

              module_focus_map = {
                  "product_basics": "重点检查产品知识是否准确、材质证书是否说得清楚。",
                  "compliance_expression": "重点检查表达是否稳妥合规，是否出现绝对化或无法核实承诺。",
                  "customer_opening": "重点检查开场是否自然、是否快速建立信任并接住顾客。",
                  "needs_discovery": "重点检查是否主动追问预算、用途、偏好、送礼对象等关键需求。",
                  "objection_handling": "重点检查是否正面回应嫌贵、真假、犹豫等异议并保持自然。",
                  "combo_recommendation": "重点检查是否能做基于场景的搭配推荐，而不是生硬加购。",
                  "closing_conversion": "重点检查是否识别成交信号、能否自然推进试戴/下单/留资。",
                  "independent_service": "重点检查是否完成完整接待闭环，能否独立接待真实顾客。",
                  "final_review": "重点检查综合能力是否平衡，包括专业、合规、沟通和推进。"
              }

              def clean(v):
                  return str(v or "").strip()

              def to_int(v, default=0):
                  try:
                      if v is None or str(v).strip() == "":
                          return default
                      return int(round(float(v)))
                  except Exception:
                      return default

              def infer_module_code(raw_code, raw_name, raw_scenario, raw_focus, raw_gap, raw_action):
                  code = clean(raw_code)
                  name = clean(raw_name)
                  if code in module_name_map:
                      return code
                  reverse_map = {v: k for k, v in module_name_map.items()}
                  if name in reverse_map:
                      return reverse_map[name]
                  text = " ".join(
                      [
                          clean(raw_scenario),
                          clean(raw_focus),
                          clean(raw_gap),
                          clean(raw_action),
                      ]
                  )
                  rules = [
                      ("product_basics", ["产品", "材质", "工艺", "证书", "真假", "参数"]),
                      ("compliance_expression", ["合规", "禁语", "承诺", "保值", "升值", "绝对"]),
                      ("customer_opening", ["开场", "接待", "迎宾", "破冰"]),
                      ("needs_discovery", ["需求", "预算", "用途", "送礼", "偏好"]),
                      ("objection_handling", ["异议", "嫌贵", "犹豫", "反对", "质疑"]),
                      ("combo_recommendation", ["连带", "搭配", "客单", "组合"]),
                      ("closing_conversion", ["成交", "下单", "推进", "转化", "留资"]),
                      ("independent_service", ["独立接待", "独立服务", "完整闭环"]),
                  ]
                  for inferred_code, keywords in rules:
                      if any(keyword in text for keyword in keywords):
                          return inferred_code
                  return "final_review"

              text = str(dialogue_text or "").replace("\r\n", "\n").replace("\r", "\n").strip()
              lines = [line.strip() for line in text.split("\n") if line.strip()]
              char_count = len(text)
              round_count = len(lines) if lines else (1 if text else 0)

              module_code = infer_module_code(
                  module_code,
                  module_name,
                  scenario_type,
                  target_focus,
                  performance_gap_summary,
                  recommended_action,
              )
              module_name = clean(module_name) or module_name_map.get(module_code, "")
              cycle_id = clean(cycle_id)
              stage_no = max(0, to_int(stage_no, 0))
              target_focus = clean(target_focus)
              scenario_type = clean(scenario_type)
              performance_gap_summary = clean(performance_gap_summary)
              target_metric = clean(target_metric)
              recommended_action = clean(recommended_action)

              invalid_reasons = []
              if not user_id:
                  invalid_reasons.append("缺少用户ID")
              if not module_code:
                  invalid_reasons.append("缺少训练模块编码")
              elif module_code not in module_name_map:
                  invalid_reasons.append("训练模块编码不在允许范围内")
              if char_count == 0:
                  invalid_reasons.append("对话为空")
              elif char_count < 20:
                  invalid_reasons.append("对话内容过短，无法评估")
              elif round_count < 2:
                  invalid_reasons.append("对话轮次不足，至少需要2轮")

              is_valid = 0 if invalid_reasons else 1
              invalid_reason = "；".join(invalid_reasons)

              if char_count < 100 or round_count < 4:
                  sample_status = "insufficient"
              else:
                  sample_status = "adequate"

              cleaned = re.sub(r"[ \t]+", " ", text)
              module_focus = module_focus_map.get(module_code, "重点检查本次训练模块对应能力是否达标。")
              final_target_focus = target_focus or performance_gap_summary or target_metric or recommended_action or module_focus

              return {
                  "practice_id": clean(practice_id),
                  "user_id": clean(user_id),
                  "module_code": module_code,
                  "module_name": module_name,
                  "cycle_id": cycle_id,
                  "stage_no": stage_no,
                  "module_focus": module_focus,
                  "trainee_name": clean(trainee_name),
                  "scenario_type": scenario_type,
                  "target_focus": final_target_focus,
                  "clean_dialogue": cleaned,
                  "char_count": char_count,
                  "round_count": round_count,
                  "sample_status": sample_status,
                  "is_valid": is_valid,
                  "invalid_reason": invalid_reason
              }
        code_language: python3
        desc: 输入预检，补齐模块/周期/阶段元信息，并阻止缺少 module_code 的评估请求
