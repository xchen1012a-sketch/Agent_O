            本次训练重点：{{#practice_eval_precheck.target_focus#}}
            样本状态：{{#practice_eval_precheck.sample_status#}}
            对话字数：{{#practice_eval_precheck.char_count#}}
            估算轮次：{{#practice_eval_precheck.round_count#}}

            完整陪练对话：
            {{#practice_eval_precheck.clean_dialogue#}}
