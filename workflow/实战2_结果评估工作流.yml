    - data:
        code: |-
          def main(practice_id: str = "",
                   user_id: str = "",
                   module_code: str = "",
                   module_name: str = "",
                   cycle_id: str = "",
                   stage_no = 0,
                   trainee_name: str = "",
                   scenario_type: str = "",
                   char_count: int = 0,
                   round_count: int = 0,
                   sample_status: str = "",
                   invalid_reason: str = "") -> dict:
              import json

              def to_int(v, default=0):
                  try:
                      if v is None or str(v).strip() == "":
                          return default
                      return int(round(float(v)))
                  except Exception:
                      return default

              result = {
                  "evaluation_status": "invalid_input",
                  "score_branch": "practice",
                  "practice_id": practice_id or "",
                  "user_id": user_id or "",
                  "module_code": module_code or "",
                  "module_name": module_name or "",
                  "cycle_id": cycle_id or "",
                  "stage_no": max(0, to_int(stage_no, 0)),
                  "trainee_name": trainee_name or "",
                  "scenario_type": scenario_type or "",
                  "sample_status": sample_status or "insufficient",
                  "sample_char_count": int(char_count or 0),
                  "sample_round_count": int(round_count or 0),
                  "overall_score": 0,
                  "pass_flag": 0,
                  "level": "待加强",
                  "risk_level": "medium",
                  "dimension_scores": {
                      "需求洞察": 0,
                      "专业准确": 0,
                      "异议处理": 0,
                      "成交推进": 0,
                      "表达自然": 0,
                      "合规安全": 0
                  },
                  "weak_dimension": "对话样本不足",
                  "risk_tags": [],
                  "highlights": [],
                  "problem_points": [invalid_reason or "输入不满足评估条件"],
                  "improvement_advice": "请至少提供2轮、20字以上的完整陪练对话，并确认已传训练模块编码后再评估。",
                  "concise_feedback": "当前对话样本或模块信息不足，无法进行有效评分。",
                  "followup_training": "补充完整对话后重新评估",
                  "storage_tags": ["评估失败", "样本不足"],
                  "confidence": 0.0
              }

              return {
                  "evaluation_result": json.dumps(result, ensure_ascii=False),
                  "evaluation_status": result["evaluation_status"],
                  "score_branch": result["score_branch"],
                  "practice_id": result["practice_id"],
                  "user_id": result["user_id"],
                  "module_code": result["module_code"],
                  "module_name": result["module_name"],
                  "cycle_id": result["cycle_id"],
                  "stage_no": result["stage_no"],
                  "trainee_name": result["trainee_name"],
                  "scenario_type": result["scenario_type"],
                  "sample_status": result["sample_status"],
                  "sample_char_count": result["sample_char_count"],
                  "sample_round_count": result["sample_round_count"],
                  "overall_score": result["overall_score"],
                  "pass_flag": result["pass_flag"],
                  "level": result["level"],
                  "risk_level": result["risk_level"],
                  "need_insight_score": 0,
                  "product_accuracy_score": 0,
                  "objection_handling_score": 0,
                  "closing_push_score": 0,
                  "expression_natural_score": 0,
                  "compliance_safety_score": 0,
                  "weak_dimension": result["weak_dimension"],
                  "risk_tags": result["risk_tags"],
                  "highlights": result["highlights"],
                  "problem_points": result["problem_points"],
                  "improvement_advice": result["improvement_advice"],
                  "concise_feedback": result["concise_feedback"],
                  "followup_training": result["followup_training"],
                  "storage_tags": result["storage_tags"],
                  "raw_llm_output": ""
              }
