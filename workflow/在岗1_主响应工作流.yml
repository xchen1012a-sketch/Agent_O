    nodes:
    - data:
        desc: 只保留一个输入，供一线员工快速描述顾客问题或现场情况。
        selected: false
        title: 开始
        type: start
        variables:
        - label: 顾客问题或现场情况
          max_length: 3000
          options: []
          required: true
          type: paragraph
          variable: scene_input
      height: 153
      id: start_node
      position:
        x: 0
        y: 427
      positionAbsolute:
        x: 0
        y: 427
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "def main(scene_input: str = \"\") -> dict:\n    import re\n\n    def\
          \ clean(v):\n        return str(v or \"\").replace(\"\\r\\n\", \"\\n\").replace(\"\
          \\r\", \"\\n\").strip()\n\n    text = clean(scene_input)\n    text = re.sub(r\"\
          \\s+\", \" \", text).strip()\n\n    if not text:\n        text = \"顾客没有明确说明问题，请给一个稳妥的接待开场与追问话术。\"\
          \n\n    lower_text = text.lower()\n\n    # 只拦截“要求违规说法/要求编造/要求绝对化承诺”本身。\n\
          \    # 若是在问“哪些不能说/这样说合不合规”，不拦截。\n    safe_training_patterns = [\n      \
          \  r\"不能说\", r\"合规\", r\"违规\", r\"红线\", r\"禁语\", r\"这样说可以吗\", r\"这话术行吗\"\
          \n    ]\n    is_training_question = any(re.search(p, text, flags=re.I) for\
          \ p in safe_training_patterns)\n\n    redline_patterns = [\n        r\"\
          帮我编\", r\"帮我造\", r\"伪造\", r\"假的证书\", r\"随便说是真的\", r\"保证保值\", r\"保证升值\",\n\
          \        r\"稳赚\", r\"稳赚不赔\", r\"100%真\", r\"绝对保真\", r\"全国最低价\", r\"闭眼买\"\
          , r\"假一赔十\",\n        r\"怎么说顾客才会相信.*保值\", r\"怎么忽悠\", r\"怎么误导\", r\"掩盖事实\"\
          \n    ]\n\n    hit_terms = []\n    if not is_training_question:\n      \
          \  for p in redline_patterns:\n            if re.search(p, text, flags=re.I):\n\
          \                hit_terms.append(p)\n\n    code_redline_flag = 1 if hit_terms\
          \ else 0\n    code_redline_reason = \"涉及违规承诺、编造信息或误导顾客的诉求。\" if hit_terms\
          \ else \"\"\n\n    question_type = \"通用咨询\"\n    scene_tag = \"门店接待\"\n\n\
          \    if re.search(r\"贵|便宜|打折|优惠|活动|比价|价格\", text):\n        question_type\
          \ = \"价格异议\"\n        scene_tag = \"异议处理\"\n    elif re.search(r\"真假|真的吗|保真|材质|纯度|是不是金|钻石|翡翠|证书|鉴定\"\
          , text):\n        question_type = \"真假/证书\"\n        scene_tag = \"信任建立\"\
          \n    elif re.search(r\"售后|保养|退换|维修|改圈|清洗\", text):\n        question_type\
          \ = \"售后咨询\"\n        scene_tag = \"售后解释\"\n    elif re.search(r\"送人|送礼|适合|佩戴|款式|怎么选\"\
          , text):\n        question_type = \"推荐咨询\"\n        scene_tag = \"产品推荐\"\
          \n    elif re.search(r\"犹豫|再看看|考虑一下|不想买|下次再来\", text):\n        question_type\
          \ = \"犹豫不决\"\n        scene_tag = \"成交推进\"\n\n    retrieval_query = f\"\
          珠宝门店 {question_type} {scene_tag} {text}\"\n\n    return {\n        \"cleaned_input\"\
          : text,\n        \"user_context\": f\"顾客问题或现场情况：{text}\",\n        \"question_type_pre\"\
          : question_type,\n        \"scene_tag_pre\": scene_tag,\n        \"retrieval_query\"\
          : retrieval_query,\n        \"code_redline_flag\": code_redline_flag,\n\
          \        \"code_redline_reason\": code_redline_reason,\n        \"hit_terms\"\
          : \"；\".join(hit_terms)\n    }\n"
        code_language: python3
        desc: 单输入清洗、红线检测与粗分类；真实检索 query 在下一节点进一步提炼。
        outputs:
          cleaned_input:
            type: string
          code_redline_flag:
            type: number
          code_redline_reason:
            type: string
          hit_terms:
            type: string
          question_type_pre:
            type: string
          retrieval_query:
            type: string
          scene_tag_pre:
            type: string
          user_context:
            type: string
        selected: false
        title: 输入规范化与红线检测
        type: code
        variables:
        - value_selector:
          - start_node
          - scene_input
          variable: scene_input
