    - data:
        code: "def main(llm_text: str = \"\", question_type_out: str = \"\", scene_tag_out:\
          \ str = \"\", knowledge_hit_in: str = \"\", knowledge_points_seed: str =\
          \ \"\", reply_focus_out: str = \"\") -> dict:\n    import json\n    import\
          \ re\n\n    def extract_json(text: str):\n        raw = str(text or \"\"\
          ).strip()\n        if not raw:\n            return {}\n        raw = re.sub(r\"\
          ^```json\\s*\", \"\", raw, flags=re.I)\n        raw = re.sub(r\"^```\\s*\"\
          , \"\", raw)\n        raw = re.sub(r\"\\s*```$\", \"\", raw)\n        m\
          \ = re.search(r\"\\{[\\s\\S]*\\}\", raw)\n        if m:\n            raw\
          \ = m.group(0)\n        try:\n            data = json.loads(raw)\n     \
          \       return data if isinstance(data, dict) else {}\n        except Exception:\n\
          \            return {}\n\n    def s(v, d=\"\"):\n        txt = str(v if\
          \ v is not None else d).strip()\n        return txt if txt else d\n\n  \
          \  def parse_seed(seed: str):\n        try:\n            data = json.loads(seed\
          \ or \"[]\")\n            if isinstance(data, list):\n                out\
          \ = [str(x).strip() for x in data if str(x).strip()]\n                return\
          \ out[:4] if out else [\"现场应答\", \"合规表达\"]\n        except Exception:\n\
          \            pass\n        return [\"现场应答\", \"合规表达\"]\n\n    data = extract_json(llm_text)\n\
          \    kh = s(knowledge_hit_in, \"no\").lower()\n    if kh not in {\"yes\"\
          , \"no\"}:\n        kh = \"no\"\n\n    reply_script = s(data.get(\"reply_script\"\
          ), \"我理解您的顾虑，这个问题我们可以结合实物细节和门店保障一起看，我给您说得更直白一点。\")\n    followup_question\
          \ = s(data.get(\"followup_question\"), \"您更在意价格还是佩戴感觉？\")\n\n    return\
          \ {\n        \"reply_script\": reply_script,\n        \"compliance_tip\"\
          : \"避免绝对化承诺，涉及材质、证书、价格和售后时以门店规则为准。\",\n        \"risk_level\": \"low\" if\
          \ kh == \"yes\" else \"medium\",\n        \"question_type\": s(question_type_out,\
          \ \"通用咨询\"),\n        \"scene_tag\": s(scene_tag_out, \"门店接待\"),\n     \
          \   \"knowledge_points\": parse_seed(knowledge_points_seed),\n        \"\
          followup_question\": followup_question,\n        \"confidence_level\": \"\
          high\" if kh == \"yes\" else \"medium\",\n        \"answer_mode\": \"knowledge\"\
          \ if kh == \"yes\" else \"fallback\",\n        \"refuse_flag\": \"no\",\n\
          \        \"knowledge_hit\": kh,\n        \"hit_strategy\": \"direct\" if\
          \ kh == \"yes\" else \"fallback\",\n        \"problem_note\": s(reply_focus_out,\
          \ \"\"),\n        \"raw_output\": str(llm_text or \"\")\n    }"
