    - data:
        code: "def main(user_context: str = \"\", cleaned_input: str = \"\", intent_type_refined:\
          \ str = \"\", scene_tag_refined: str = \"\", customer_focus: str = \"\"\
          , emotion_state: str = \"\", reply_focus: str = \"\", retrieved_docs=None)\
          \ -> dict:\n    import json\n\n    docs = retrieved_docs or []\n    blocks\
          \ = []\n    points = []\n\n    for idx, doc in enumerate(docs[:2], 1):\n\
          \        title = \"\"\n        content = \"\"\n        try:\n          \
          \  if isinstance(doc, dict):\n                title = str(doc.get(\"title\"\
          ) or doc.get(\"name\") or \"\").strip()\n                content = str(doc.get(\"\
          content\") or doc.get(\"segment\") or doc.get(\"text\") or \"\").strip()\n\
          \                if not content:\n                    metadata = doc.get(\"\
          metadata\") or {}\n                    doc_metadata = metadata.get(\"doc_metadata\"\
          ) or {}\n                    content = str(doc_metadata.get(\"content\"\
          ) or \"\").strip()\n            else:\n                content = str(doc).strip()\n\
          \        except Exception:\n            content = str(doc).strip()\n\n \
          \       if content:\n            brief = content[:180]\n            block\
          \ = f\"[知识片段{idx}]\"\n            if title:\n                block += f\"\
          \\n标题：{title}\"\n                points.append(title)\n            block\
          \ += f\"\\n内容：{brief}\"\n            blocks.append(block)\n\n    knowledge_hit\
          \ = \"yes\" if blocks else \"no\"\n    kb_context = \"\\n\\n\".join(blocks)\n\
          \    if not kb_context:\n        kb_context = \"未检索到强相关知识片段，请按珠宝门店通用稳妥说法生成。\"\
          \n        if not points:\n            points = [\"知识未命中\", \"稳妥应答\"]\n\n\
          \    intent_brief = f\"意图：{intent_type_refined or '通用咨询'}；关注点：{customer_focus\
          \ or '顾客当前顾虑'}；情绪：{emotion_state or '待判断'}；回复重点：{reply_focus or '先回应顾虑再追问'}\"\
          \n\n    return {\n        \"user_context_out\": user_context,\n        \"\
          cleaned_input_out\": cleaned_input,\n        \"question_type_out\": intent_type_refined\
          \ or \"通用咨询\",\n        \"scene_tag_out\": scene_tag_refined or \"门店接待\"\
          ,\n        \"knowledge_hit\": knowledge_hit,\n        \"kb_context\": kb_context,\n\
          \        \"knowledge_points_seed\": json.dumps(points[:3], ensure_ascii=False),\n\
          \        \"intent_brief\": intent_brief,\n        \"reply_focus_out\": reply_focus\
          \ or \"先回应顾虑再追问\"\n    }"
        code_language: python3
        desc: 把检索结果压缩成极少上下文，并补充意图摘要给主 LLM。
