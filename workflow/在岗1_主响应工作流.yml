    - data:
        code: "def main(cleaned_input: str = \"\", question_type_pre: str = \"\",\
          \ scene_tag_pre: str = \"\") -> dict:\n    import re\n\n    text = str(cleaned_input\
          \ or \"\").strip()\n    raw = text\n\n    price_patterns = [r\"贵\", r\"\
          便宜\", r\"多少钱\", r\"价格\", r\"打折\", r\"优惠\", r\"活动\", r\"值不值\", r\"划算\", r\"\
          差不多\", r\"网上\", r\"别家\", r\"比价\", r\"贵这么多\"]\n    style_patterns = [r\"\
          没感觉\", r\"没有感觉\", r\"没有情绪价值\", r\"显老\", r\"土\", r\"不好看\", r\"不日常\", r\"\
          不好搭\", r\"不适合\", r\"不喜欢\", r\"夸张\"]\n    hesitate_patterns = [r\"再看看\",\
          \ r\"考虑\", r\"回去商量\", r\"先看看\", r\"下次再来\", r\"没想好\", r\"再说吧\", r\"暂时\"]\n\
          \    trust_patterns = [r\"真假\", r\"保真\", r\"证书\", r\"靠谱吗\", r\"可信\", r\"\
          材质\", r\"纯度\", r\"是不是金\", r\"是不是钻\", r\"鉴定\"]\n    aftersale_patterns =\
          \ [r\"售后\", r\"保养\", r\"清洗\", r\"改圈\", r\"维修\", r\"退换\"]\n    gift_patterns\
          \ = [r\"送人\", r\"送礼\", r\"送妈妈\", r\"送女朋友\", r\"求婚\", r\"纪念日\", r\"结婚\",\
          \ r\"自己戴\", r\"佩戴\", r\"怎么选\"]\n\n    def hit(patterns):\n        return\
          \ any(re.search(p, text, flags=re.I) for p in patterns)\n\n    intent_type\
          \ = question_type_pre or \"通用咨询\"\n    scene_tag = scene_tag_pre or \"门店接待\"\
          \n    emotion_state = \"平静\"\n    customer_focus = []\n    reply_focus =\
          \ \"先顺着顾客当前顾虑回应，再给一个轻追问。\"\n\n    if hit(price_patterns):\n        intent_type\
          \ = \"价格异议\"\n        scene_tag = \"异议处理\"\n        emotion_state = \"比较/怀疑\"\
          \n        customer_focus += [\"价格对比\", \"值不值\", \"门店差异\"]\n        reply_focus\
          \ = \"先认同比价和价格顾虑，再解释价值差异，不要空讲术语。\"\n    if hit(style_patterns):\n      \
          \  intent_type = \"风格/感觉顾虑\"\n        scene_tag = \"产品推荐\"\n        emotion_state\
          \ = \"无感/犹豫\"\n        customer_focus += [\"佩戴感觉\", \"风格适配\", \"情绪价值\"]\n\
          \        reply_focus = \"先接住顾客的感觉，再转到风格、佩戴效果或纪念意义。\"\n    if hit(hesitate_patterns):\n\
          \        intent_type = \"犹豫不决\"\n        scene_tag = \"成交推进\"\n        emotion_state\
          \ = \"观望\"\n        customer_focus += [\"还没心动\", \"想再比较\", \"暂缓决策\"]\n \
          \       if \"先接住顾客\" not in reply_focus:\n            reply_focus = \"先接住犹豫，再缩小选择或轻推进，不要硬逼单。\"\
          \n    if hit(trust_patterns):\n        intent_type = \"真假/证书\"\n       \
          \ scene_tag = \"信任建立\"\n        emotion_state = \"怀疑\"\n        customer_focus\
          \ += [\"材质依据\", \"证书可信度\", \"门店保障\"]\n        reply_focus = \"先回应真假或证书顾虑，再给可验证的信息。\"\
          \n    if hit(aftersale_patterns):\n        intent_type = \"售后咨询\"\n    \
          \    scene_tag = \"售后解释\"\n        emotion_state = \"谨慎\"\n        customer_focus\
          \ += [\"保养售后\", \"维修清洗\", \"门店规则\"]\n        reply_focus = \"先给清晰规则，再补一句稳妥说明。\"\
          \n    if hit(gift_patterns):\n        if intent_type == \"通用咨询\":\n    \
          \        intent_type = \"送礼/佩戴咨询\"\n            scene_tag = \"产品推荐\"\n \
          \       if \"送礼场景\" not in customer_focus:\n            customer_focus +=\
          \ [\"送礼场景\", \"佩戴对象\", \"使用场合\"]\n        if reply_focus == \"先顺着顾客当前顾虑回应，再给一个轻追问。\"\
          :\n            reply_focus = \"先明确用途或对象，再顺势推荐。\"\n\n    # 默认兜底：尽量不要让 query\
          \ 太泛\n    if not customer_focus:\n        customer_focus = [\"顾客原话\", \"\
          当前顾虑\"]\n        emotion_state = \"待判断\"\n\n    # 去重\n    uniq = []\n  \
          \  for item in customer_focus:\n        if item not in uniq:\n         \
          \   uniq.append(item)\n    customer_focus = uniq[:4]\n\n    normalized_user_input\
          \ = f\"顾客原话：{raw}；判断为：{intent_type}；主要关注：{'、'.join(customer_focus)}；情绪状态：{emotion_state}。\"\
          \n    retrieval_query_refined = f\"珠宝门店 {intent_type} {scene_tag} {' '.join(customer_focus)}\
          \ {raw}\"\n    if len(retrieval_query_refined) > 220:\n        retrieval_query_refined\
          \ = retrieval_query_refined[:220]\n\n    return {\n        \"normalized_user_input\"\
          : normalized_user_input,\n        \"intent_type_refined\": intent_type,\n\
          \        \"scene_tag_refined\": scene_tag,\n        \"customer_focus\":\
          \ \"、\".join(customer_focus),\n        \"emotion_state\": emotion_state,\n\
          \        \"reply_focus\": reply_focus,\n        \"retrieval_query_refined\"\
          : retrieval_query_refined\n    }"
