          \ scene_tag_pre: str = \"\", code_redline_reason: str = \"\", hit_terms:\
          \ str = \"\") -> dict:\n    import json\n    reply_script = \"这个说法我不能直接帮你这么表达。更稳妥的做法是回到材质依据、证书信息、门店规则和真实卖点上，我可以马上帮你改成合规又自然的话术。\"\
          \n    followup_question = \"你把顾客真实顾虑发我，比如嫌贵、质疑真假、问售后或犹豫不下单，我直接给你能说出口的版本。\"\
          \n    payload = {\n        \"reply_script\": reply_script,\n        \"compliance_tip\"\
          : \"禁止编造材质、证书、政策或保值升值承诺，必须以实物、证书和门店规则为准。\",\n        \"risk_level\": \"\
          high\",\n        \"question_type\": question_type_pre or \"通用咨询\",\n   \
          \     \"scene_tag\": scene_tag_pre or \"门店接待\",\n        \"knowledge_points\"\
          : [\"红线拦截\", \"合规拒答\"],\n        \"followup_question\": followup_question,\n\
          \        \"confidence_level\": \"high\",\n        \"answer_mode\": \"refusal\"\
          ,\n        \"refuse_flag\": \"yes\",\n        \"knowledge_hit\": \"no\"\
          ,\n        \"hit_strategy\": \"refusal\",\n        \"problem_note\": code_redline_reason\
          \ or hit_terms or \"命中违规诉求\",\n        \"raw_output\": json.dumps({\n  \
          \          \"reason\": code_redline_reason,\n            \"hit_terms\":\
          \ hit_terms,\n            \"cleaned_input\": cleaned_input\n        }, ensure_ascii=False)\n\
          \    }\n    return payload\n"
