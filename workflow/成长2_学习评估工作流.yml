    - data:
        code: "import json\nimport re\n\n\ndef _extract_json(text: str) -> dict:\n    raw = str(text or '').strip()\n    raw = re.sub(r'^```json\\s*', '', raw, flags=re.I)\n    raw = re.sub(r'^```\\s*', '', raw)\n    raw = re.sub(r'\\s*```$', '', raw)\n    raw = re.sub(r'<think>[\\s\\S]*?</think>', '', raw, flags=re.I)\n    if not raw:\n        return {}\n    try:\n        data = json.loads(raw)\n        return data if isinstance(data, dict) else {}\n    except Exception:\n        pass\n    m = re.search(r'\\{[\\s\\S]*\\}', raw)\n    if m:\n        try:\n            data = json.loads(m.group(0))\n            return data if isinstance(data, dict) else {}\n        except Exception:\n            pass\n    return {}\n\n\ndef _clamp(n, low=-5, high=5):\n    try:\n        val = int(round(float(n)))\n    except Exception:\n        return 0\n    return max(low, min(high, val))\n\n\ndef _safe_text(v, default=''):\n    if v is None:\n        return default\n    s = str(v).strip()\n    return s if s else default\n\n\ndef _safe_score(v, default=60):\n    try:\n        return max(0, min(100, int(round(float(v)))))\n    except Exception:\n        return default\n\n\ndef main(eval_text_hit: str = '', eval_text_fallback: str = '', knowledge_hit: str = 'no', hit_retrieved_count = 0, fallback_hit_reason: str = '', answer_score_init = 60, mastery_level_init: str = '部分掌握', weak_dimension_guess: str = '产品知识') -> dict:\n    chosen_text = eval_text_hit if str(knowledge_hit or 'no').strip().lower() == 'yes' else eval_text_fallback\n    data = _extract_json(chosen_text)\n\n    answer_score = _safe_score(data.get('answer_score'), int(answer_score_init or 60)) if data else _safe_score(answer_score_init, 60)\n    if answer_score >= 85:\n        mastery_level = '掌握较好'\n    elif answer_score >= 70:\n        mastery_level = '基本掌握'\n    elif answer_score >= 50:\n        mastery_level = '部分掌握'\n    else:\n        mastery_level = '未掌握'\n    mastery_level = _safe_text(data.get('mastery_level') if data else '', mastery_level)\n    weak_dimension = _safe_text(data.get('weak_dimension') if data else '', weak_dimension_guess or '产品知识')\n    evaluation_text = _safe_text(data.get('evaluation_text') if data else '', '本题存在关键点遗漏，需要继续补学。')\n    followup_suggestion = _safe_text(data.get('followup_suggestion') if data else '', '先补相关知识点，再做1道同类题，最后复述标准表达。')\n    module_recommendation = _safe_text(data.get('module_recommendation') if data else '', f'优先补学【{weak_dimension}】相关模块。')\n    is_effective_completion = bool(data.get('is_effective_completion')) if data else (answer_score >= 60)\n    ability_delta = data.get('ability_delta') if data else {}\n    if not isinstance(ability_delta, dict):\n        ability_delta = {}\n    ability_delta_norm = {\n        '产品知识': _clamp(ability_delta.get('产品知识', 0)),\n        '合规表达': _clamp(ability_delta.get('合规表达', 0)),\n        '销售沟通': _clamp(ability_delta.get('销售沟通', 0)),\n        '客户应答': _clamp(ability_delta.get('客户应答', 0)),\n    }\n\n    final = {\n        'answer_score': answer_score,\n        'mastery_level': mastery_level,\n        'weak_dimension': weak_dimension,\n        'evaluation_text': evaluation_text,\n        'followup_suggestion': followup_suggestion,\n        'module_recommendation': module_recommendation,\n        'is_effective_completion': is_effective_completion,\n        'ability_delta': ability_delta_norm,\n        'knowledge_source': 'knowledge_base' if str(knowledge_hit or 'no').strip().lower() == 'yes' else 'llm_fallback',\n        'retrieved_count': int(hit_retrieved_count or 0) if str(knowledge_hit or 'no').strip().lower() == 'yes' else 0,\n        'fallback_hit_reason': _safe_text(fallback_hit_reason)\n    }\n    return {\n        'final_result_json': json.dumps(final, ensure_ascii=False),\n        'answer_score': answer_score,\n        'weak_dimension': weak_dimension,\n        'knowledge_source': final['knowledge_source'],\n        'retrieved_count': final['retrieved_count']\n    }\n"
        code_language: python3
