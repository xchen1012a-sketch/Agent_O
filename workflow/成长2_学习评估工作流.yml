    - data:
        code: "import json\nimport re\n\n\ndef _safe_text(v, default=''):\n    if v is None:\n        return default\n    s = str(v).strip()\n    return s if s else default\n\n\ndef _extract_keywords(text: str):\n    raw = re.split(r\"[\\s，,。；;、：:（）()【】\\[\\]“”/\\\\|]+\", str(text or '').lower())\n    stop = {'珠宝', '培训', '学习', '评估', '模块', '标准', '答案', '题目', '员工', '阶段'}\n    return [w for w in raw if len(w) >= 2 and w not in stop]\n\n\ndef main(retrieval_needed: str = 'yes', fallback_hint: str = '', retrieved_docs=None, question_text: str = '', knowledge_tag: str = '', standard_answer: str = '') -> dict:\n    docs = retrieved_docs or []\n    blocks = []\n    effective_count = 0\n    total_len = 0\n    merged_text = ''\n    for idx, doc in enumerate(docs[:4], 1):\n        title = ''\n        content = ''\n        if isinstance(doc, dict):\n            title = str(doc.get('title') or doc.get('name') or '')\n            content = str(doc.get('content') or doc.get('segment') or doc.get('text') or '')\n            if not content:\n                metadata = doc.get('metadata') or {}\n                doc_meta = metadata.get('doc_metadata') or {}\n                content = str(doc_meta.get('content') or '')\n        else:\n            content = str(doc or '')\n        title = title.strip()\n        content = content.strip()\n        if content:\n            effective_count += 1\n            total_len += len(content)\n            merged_text += ' ' + content.lower()\n        block = f\"[知识片段{idx}]\"\n        if title:\n            block += f\"\\n标题：{title}\"\n        if content:\n            block += f\"\\n内容：{content}\"\n        blocks.append(block)\n\n    if str(retrieval_needed or 'yes').lower() == 'no':\n        knowledge_hit = 0\n        hit_reason = '预判为无需检索，直接走通用评估兜底。'\n    else:\n        kws = _extract_keywords(question_text) + _extract_keywords(knowledge_tag) + _extract_keywords(standard_answer)\n        overlap = sum(1 for kw in kws[:15] if kw in merged_text)\n        if effective_count >= 2 and total_len >= 180 and overlap >= 1:\n            knowledge_hit = 1\n            hit_reason = f'命中 {effective_count} 条有效知识片段，且与题目存在关键词交集。'\n        elif effective_count >= 1 and total_len >= 90:\n            knowledge_hit = 0\n            hit_reason = '命中片段较弱，未达到知识增强阈值，转入兜底建议。'\n        else:\n            knowledge_hit = 0\n            hit_reason = '知识片段不足，转入兜底建议。'\n\n    return {\n        'knowledge_hit': knowledge_hit,\n        'knowledge_hit_text': 'yes' if knowledge_hit == 1 else 'no',\n        'knowledge_hit_count': effective_count,\n        'knowledge_blocks_text': '\\n\\n'.join(blocks) if blocks else '未命中有效知识片段。',\n        'hit_reason': hit_reason,\n        'fallback_hint_out': _safe_text(fallback_hint, '若未命中，则按标准答案和通用培训原则保守评估。')\n    }\n"
        code_language: python3
