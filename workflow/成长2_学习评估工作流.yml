    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 判断是否需要知识增强，并输出更稳的检索 query。
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            temperature: 0.1
            max_tokens: 320
          mode: chat
          name: qwen-plus
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: precheck-system
          role: system
          text: "你是“成长学习评估工作流”的知识检索预判节点。\n\n任务：\n1. 判断本题是否需要调用知识库补充评分上下文。\n2. 生成更适合命中的检索 query。\n3. 给出最核心知识焦点和未命中兜底方向。\n\n只输出 JSON，不要解释，不要代码块。\n\nJSON Schema：\n{\n  \"retrieval_needed\": \"yes | no\",\n  \"optimized_query\": \"\",\n  \"knowledge_focus\": \"\",\n  \"precheck_reason\": \"\",\n  \"fallback_hint\": \"\"\n}"
        - id: precheck-user
          role: user
          text: '请对以下学习结果输入做检索前预判：


            【学习结果输入】

            {{#normalize_result.profile_input#}}


            【原始检索查询】

            {{#normalize_result.retrieval_query#}}


            【兜底原则】

            {{#normalize_result.fallback_knowledge#}}'
        selected: false
        title: 知识检索预判
        type: llm
        variables: []
