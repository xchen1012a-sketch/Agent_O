    - data:
        code: "import json\nimport re\n\n\ndef _clean(v, default='未提供'):\n    if v is None:\n        return default\n    s = str(v).strip()\n    return s if s else default\n\n\ndef _safe_source(v: str) -> str:\n    s = str(v or '').strip()\n    return s if s else 'fastapi'\n\n\ndef _safe_trace(v: str) -> str:\n    s = str(v or '').strip()\n    return s if s else 'trace_growth_evaluate_auto'\n\n\ndef parse_scores(text: str):\n    defaults = {'产品知识': 70, '合规表达': 70, '销售沟通': 70, '客户应答': 70}\n    raw = str(text or '').strip()\n    if not raw:\n        return defaults.copy()\n    result = defaults.copy()\n    for k, v in re.findall(r'(产品知识|合规表达|销售沟通|客户应答)\\s*[:：]?\\s*(-?\\d{1,3})', raw):\n        try:\n            result[k] = max(0, min(100, int(v)))\n        except Exception:\n            pass\n    return result\n\n\ndef _tokenize(text: str):\n    words = re.split(r\"[\\s，,。；;、：:（）()【】\\[\\]“”/\\\\|]+\", str(text or ''))\n    return [w.strip().lower() for w in words if len(w.strip()) >= 2]\n\n\ndef base_score(user_answer: str, standard_answer: str):\n    ua = str(user_answer or '').strip()\n    sa = str(standard_answer or '').strip()\n    if not ua:\n        return 0\n    ua_tokens = _tokenize(ua)\n    sa_tokens = _tokenize(sa)\n    overlap = 0\n    for tk in sa_tokens[:20]:\n        if tk in ua_tokens or tk in ua.lower():\n            overlap += 1\n    length_bonus = 0\n    if len(ua) >= 20:\n        length_bonus += 10\n    if len(ua) >= 50:\n        length_bonus += 10\n    if len(ua) >= 100:\n        length_bonus += 5\n    score = 35 + min(40, overlap * 5) + length_bonus\n    return max(0, min(100, int(score)))\n\n\ndef mastery_from_score(score: int) -> str:\n    if score >= 85:\n        return '掌握较好'\n    if score >= 70:\n        return '基本掌握'\n    if score >= 50:\n        return '部分掌握'\n    return '未掌握'\n\n\ndef infer_weak_dimension(knowledge_tag: str, module_name: str, question_text: str) -> str:\n    text = ' '.join([str(knowledge_tag or ''), str(module_name or ''), str(question_text or '')]).lower()\n    if any(k in text for k in ['合规', '禁语', '红线', '承诺', '保值', '升值']):\n        return '合规表达'\n    if any(k in text for k in ['异议', '犹豫', '嫌贵', '成交', '接待', '沟通']):\n        return '销售沟通'\n    if any(k in text for k in ['应答', '真假', '证书', '材质', '售后']):\n        return '客户应答'\n    return '产品知识'\n\n\ndef main(\n    user_id: str = '',\n    source: str = '',\n    trace_id: str = '',\n    plan_id: str = '',\n    stage_no: str = '',\n    module_code: str = '',\n    module_name: str = '',\n    question_text: str = '',\n    user_answer: str = '',\n    standard_answer: str = '',\n    knowledge_tag: str = '',\n    current_profile: str = '',\n    current_scores: str = ''\n) -> dict:\n    user_id = _clean(user_id, 'UNKNOWN_USER')\n    source = _safe_source(source)\n    trace_id = _safe_trace(trace_id)\n    plan_id = _clean(plan_id)\n    stage_no = str(stage_no or '').strip() or '1'\n    if stage_no not in {'1', '2'}:\n        stage_no = '1'\n    module_code = _clean(module_code)\n    module_name = _clean(module_name)\n    question_text = _clean(question_text)\n    user_answer = str(user_answer or '').strip()\n    standard_answer = _clean(standard_answer)\n    knowledge_tag = _clean(knowledge_tag)\n    current_profile = _clean(current_profile)\n    current_scores = str(current_scores or '').strip()\n\n    parsed_scores = parse_scores(current_scores)\n    answer_score_init = base_score(user_answer, standard_answer)\n    mastery_level_init = mastery_from_score(answer_score_init)\n    weak_dimension_guess = infer_weak_dimension(knowledge_tag, module_name, question_text)\n\n    normalized_answer = {\n        'user_id': user_id,\n        'source': source,\n        'trace_id': trace_id,\n        'plan_id': plan_id,\n        'stage_no': stage_no,\n        'module_code': module_code,\n        'module_name': module_name,\n        'question_text': question_text,\n        'user_answer': user_answer,\n        'standard_answer': standard_answer,\n        'knowledge_tag': knowledge_tag,\n        'current_profile': current_profile,\n        'current_scores': parsed_scores,\n        'answer_score_init': answer_score_init,\n        'mastery_level_init': mastery_level_init,\n        'weak_dimension_guess': weak_dimension_guess,\n    }\n\n    profile_input = f\"\"\"【链路信息】\nuser_id：{user_id}\nsource：{source}\ntrace_id：{trace_id}\nplan_id：{plan_id}\nstage_no：{stage_no}\n\n【模块信息】\nmodule_code：{module_code}\nmodule_name：{module_name}\nknowledge_tag：{knowledge_tag}\n\n【题目信息】\n题目：{question_text}\n员工答案：{user_answer if user_answer else '未作答'}\n标准答案：{standard_answer}\n\n【当前画像】\n{current_profile}\n\n【当前能力分】\n- 产品知识：{parsed_scores['产品知识']}\n- 合规表达：{parsed_scores['合规表达']}\n- 销售沟通：{parsed_scores['销售沟通']}\n- 客户应答：{parsed_scores['客户应答']}\n\n【规则初评】\n基础分数预估：{answer_score_init}\n掌握等级预估：{mastery_level_init}\n薄弱维度猜测：{weak_dimension_guess}\n\"\"\"\n\n    retrieval_query = (\n        f\"珠宝培训 学习结果评估 模块 {module_name} 标签 {knowledge_tag} 阶段 {stage_no} \"\n        f\"题目 {question_text} 标准答案 {standard_answer}\"\n    )\n\n    fallback_knowledge = \"\"\"【学习评估兜底原则】\n1. 本流负责单个学习任务的结果评估，不做训练周期推进。\n2. 评估必须给出：答题结论、掌握程度、薄弱维度、补学建议、模块推荐。\n3. 补学建议要具体到“先补什么、再练什么、如何验证”，不能只写空泛鼓励。\n4. 能力调整建议必须保守，单次波动不宜过大。\n5. 输出要适合后端落库和前端直接展示。\"\"\"\n\n    return {\n        'normalized_answer': json.dumps(normalized_answer, ensure_ascii=False),\n        'profile_input': profile_input,\n        'retrieval_query': retrieval_query,\n        'fallback_knowledge': fallback_knowledge,\n        'answer_score_init': answer_score_init,\n        'mastery_level_init': mastery_level_init,\n        'weak_dimension_guess': weak_dimension_guess,\n        'current_scores_json': json.dumps(parsed_scores, ensure_ascii=False)\n    }\n"
        code_language: python3
        desc: 统一答题文本、做基础分数预估，并输出结构化学习结果输入。
        outputs:
          normalized_answer:
            children: null
            type: string
