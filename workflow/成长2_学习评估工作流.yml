    - data:
        code: "import json\nimport re\n\n\ndef _extract_json(text: str) -> dict:\n    raw = str(text or '').strip()\n    raw = re.sub(r'^```json\\s*', '', raw, flags=re.I)\n    raw = re.sub(r'^```\\s*', '', raw)\n    raw = re.sub(r'\\s*```$', '', raw)\n    if not raw:\n        return {}\n    try:\n        data = json.loads(raw)\n        return data if isinstance(data, dict) else {}\n    except Exception:\n        pass\n    m = re.search(r'\\{[\\s\\S]*\\}', raw)\n    if m:\n        try:\n            data = json.loads(m.group(0))\n            return data if isinstance(data, dict) else {}\n        except Exception:\n            pass\n    return {}\n\n\ndef _safe_text(v, default=''):\n    if v is None:\n        return default\n    s = str(v).strip()\n    return s if s else default\n\n\ndef main(llm_text: str = '', retrieval_query: str = '', weak_dimension_guess: str = '', module_name: str = '', knowledge_tag: str = '', question_text: str = '', standard_answer: str = '') -> dict:\n    data = _extract_json(llm_text)\n    retrieval_needed = _safe_text(data.get('retrieval_needed'), 'yes').lower()\n    if retrieval_needed not in {'yes', 'no'}:\n        retrieval_needed = 'yes'\n    default_query = f\"珠宝培训 学习评估 模块 {module_name} 标签 {knowledge_tag} 维度 {weak_dimension_guess} 题目 {question_text} 标准答案 {standard_answer}\"\n    optimized_query = _safe_text(data.get('optimized_query'), '') or _safe_text(retrieval_query, default_query)\n    knowledge_focus = _safe_text(data.get('knowledge_focus'), weak_dimension_guess or knowledge_tag or module_name)\n    precheck_reason = _safe_text(data.get('precheck_reason'), '已采用默认检索预判。')\n    fallback_hint = _safe_text(data.get('fallback_hint'), '若未命中，则基于标准答案、知识标签和通用培训原则做保守评估。')\n    return {\n        'retrieval_needed': retrieval_needed,\n        'optimized_query': optimized_query,\n        'knowledge_focus': knowledge_focus,\n        'precheck_reason': precheck_reason,\n        'fallback_hint': fallback_hint\n    }\n"
        code_language: python3
        desc: 将检索前预判结果解析成可执行检索关键词和兜底提示。
