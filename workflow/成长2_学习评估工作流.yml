    - data:
        code: "import json\n\n\ndef _safe_text(v, default=''):\n    if v is None:\n        return default\n    s = str(v).strip()\n    return s if s else default\n\n\ndef main(final_result_json: str = '', normalized_answer: str = '', knowledge_hit: str = 'no', knowledge_source: str = 'llm_fallback') -> dict:\n    try:\n        result = json.loads(str(final_result_json or '{}'))\n        if not isinstance(result, dict):\n            result = {}\n    except Exception:\n        result = {}\n\n    try:\n        normalized_answer = json.loads(str(normalized_answer or '{}'))\n        if not isinstance(normalized_answer, dict):\n            normalized_answer = {}\n    except Exception:\n        normalized_answer = {}\n\n    answer_score = int(result.get('answer_score', 60))\n    mastery_level = _safe_text(result.get('mastery_level'), '部分掌握')\n    weak_dimension = _safe_text(result.get('weak_dimension'), '产品知识')\n    evaluation_text = _safe_text(result.get('evaluation_text'), '本题存在关键点遗漏，需要继续补学。')\n    followup_suggestion = _safe_text(result.get('followup_suggestion'), '先补相关知识点，再做同类题验证。')\n    module_recommendation = _safe_text(result.get('module_recommendation'), f'优先补学【{weak_dimension}】相关模块。')\n    is_effective_completion = bool(result.get('is_effective_completion', answer_score >= 60))\n\n    evaluation_markdown = f\"\"\"# 学习结果评估\n- 答题得分：{answer_score}\n- 掌握程度：{mastery_level}\n- 主要薄弱维度：{weak_dimension}\n- 评估结论：{evaluation_text}\n\n# 补学建议\n- {followup_suggestion}\n\n# 模块推荐\n- {module_recommendation}\n\n# 有效完成判断\n- {'是' if is_effective_completion else '否'}\n\"\"\"\n\n    workflow_result = {\n        'user_id': normalized_answer.get('user_id', ''),\n        'source': normalized_answer.get('source', ''),\n        'trace_id': normalized_answer.get('trace_id', ''),\n        'plan_id': normalized_answer.get('plan_id', ''),\n        'stage_no': normalized_answer.get('stage_no', ''),\n        'module_code': normalized_answer.get('module_code', ''),\n        'module_name': normalized_answer.get('module_name', ''),\n        'knowledge_tag': normalized_answer.get('knowledge_tag', ''),\n        'answer_score': answer_score,\n        'mastery_level': mastery_level,\n        'weak_dimension': weak_dimension,\n        'evaluation_text': evaluation_text,\n        'followup_suggestion': followup_suggestion,\n        'module_recommendation': module_recommendation,\n        'is_effective_completion': is_effective_completion,\n        'knowledge_hit': str(knowledge_hit or 'no'),\n        'knowledge_source': str(knowledge_source or 'llm_fallback'),\n        'ability_delta': result.get('ability_delta', {}),\n    }\n\n    return {\n        'final_markdown': evaluation_markdown,\n        'answer_score': answer_score,\n        'mastery_level': mastery_level,\n        'weak_dimension': weak_dimension,\n        'evaluation_text': evaluation_text,\n        'followup_suggestion': followup_suggestion,\n        'module_recommendation': module_recommendation,\n        'workflow_result': json.dumps(workflow_result, ensure_ascii=False)\n    }\n"
