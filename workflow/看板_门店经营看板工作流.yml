          ,\n    \"compliance_expression\": \"合规表达\",\n    \"customer_opening\": \"\
          接待开场\",\n    \"needs_discovery\": \"需求挖掘\",\n    \"objection_handling\"\
          : \"异议处理\",\n    \"combo_recommendation\": \"搭配推荐\",\n    \"closing_conversion\"\
          : \"成交推进\",\n    \"independent_service\": \"独立上岗\",\n    \"final_review\"\
          : \"综合复盘\",\n}\n\ndef _main_tag(text: str) -> str:\n    t = str(text or\
          \ \"\")\n    if any(k in t for k in [\"真假\", \"材质\", \"证书\", \"工艺\"]):\n\
          \        return \"产品知识\"\n    if any(k in t for k in [\"价格\", \"比价\", \"\
          嫌贵\", \"折扣\"]):\n        return \"价格异议\"\n    if any(k in t for k in [\"\
          售后\", \"保养\", \"维修\"]):\n        return \"售后说明\"\n    if any(k in t for\
          \ k in [\"推荐\", \"送礼\", \"搭配\", \"款式\"]):\n        return \"款式推荐\"\n   \
          \ if any(k in t for k in [\"合规\", \"禁语\", \"违规\"]):\n        return \"合规表达\"\
          \n    return \"通用训练\"\n\ndef main(\n    training_completion_rate = -1,\n\
          \    compliance_pass_rate = -1,\n    overall_score = -1,\n    product_knowledge_score\
          \ = -1,\n    compliance_score = -1,\n    sales_communication_score = -1,\n\
          \    response_score = -1,\n    recent_practice_avg_score = -1,\n    recent_practice_trend:\
          \ str = \"flat\",\n    recent_high_risk_count: int = 0,\n    recent_assistant_question_tags:\
          \ str = \"\",\n    core_weak_dimension: str = \"\",\n    manager_focus_hint:\
          \ str = \"\",\n    data_quality: str = \"medium\",\n    cycle_type: str\
          \ = \"\",\n    stage_no = 0,\n    stage_name: str = \"\",\n    stage_review_present\
          \ = 0,\n    stage_review_score = -1,\n    stage_review_pass = -1,\n    stage_review_summary:\
          \ str = \"\",\n    stage_review_action_hint: str = \"\",\n    module_low_count\
          \ = 0,\n    module_medium_count = 0,\n    module_focus_name: str = \"\"\
          ,\n    module_focus_score = -1,\n    module_risk_notes: str = \"\",\n  \
          \  latest_assessment_score = -1,\n    latest_assessment_is_pass = -1,\n\
          \    assessment_avg_score = -1\n) -> dict:\n    def num(v):\n        try:\n\
          \            return float(v)\n        except Exception:\n            return\
          \ -1.0\n\n    tc = num(training_completion_rate)\n    cp = num(compliance_pass_rate)\n\
          \    os = num(overall_score)\n    pks = num(product_knowledge_score)\n \
          \   cs = num(compliance_score)\n    scs = num(sales_communication_score)\n\
