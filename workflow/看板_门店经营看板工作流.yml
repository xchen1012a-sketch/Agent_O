            6. 管理建议必须可执行，优先使用“复盘 / 补训 / 复练 / 观察 / 跟进”这类动作。\n7. 模块指数、阶段评估、考核分数已经由上游聚合，你只负责判断与表达，不重新做复杂统计。\n\
            8. 输出要适合 FastAPI 入库与前端看板直接展示。\n\n只输出 JSON，不要 markdown，不要解释文字。\n\nJSON\
