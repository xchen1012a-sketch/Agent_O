          \     risk_score = max(risk_score, 45)\n\n    risk_reason = _sanitize(data.get(\"\
          risk_reason\") or rule_reason or \"当前存在待跟进的训练风险。\")\n    followup_advice\
          \ = _sanitize(data.get(\"followup_advice\") or \"建议结合最近训练记录安排一次针对性复练。\"\
          )\n    next_action_final = _sanitize(data.get(\"next_action\") or next_action\
          \ or \"持续观察\")\n    action_window_final = _safe_text(data.get(\"action_window\"\
