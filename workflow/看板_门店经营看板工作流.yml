    - data:
        code: "\nimport json\nimport re\n\ndef _clean_text(v):\n    if v is None:\n\
          \        return \"\"\n    return str(v).strip()\n\ndef _to_float(v, default=-1.0):\n\
          \    try:\n        if v is None or str(v).strip() == \"\":\n           \
          \ return float(default)\n        return float(v)\n    except Exception:\n\
          \        return float(default)\n\ndef _to_int(v, default=0):\n    try:\n\
          \        if v is None or str(v).strip() == \"\":\n            return int(default)\n\
          \        return int(round(float(v)))\n    except Exception:\n        return\
          \ int(default)\n\ndef _to_bool_flag(v):\n    s = str(v or \"\").strip().lower()\n\
          \    if s in {\"1\", \"true\", \"yes\", \"y\", \"是\", \"通过\", \"pass\"}:\n\
          \        return 1\n    if s in {\"0\", \"false\", \"no\", \"n\", \"否\",\
          \ \"未通过\", \"fail\"}:\n        return 0\n    return -1\n\ndef _clamp_score(v,\
          \ default=-1.0):\n    n = _to_float(v, default)\n    if n < 0:\n       \
          \ return -1.0\n    return max(0.0, min(100.0, n))\n\ndef _safe_rate(explicit_rate,\
          \ completed, total):\n    rate = _clamp_score(explicit_rate, -1)\n    c\
          \ = _to_int(completed, 0)\n    t = _to_int(total, 0)\n    if rate >= 0:\n\
          \        return round(rate, 2)\n    if t > 0:\n        return round(max(0.0,\
          \ min(100.0, c * 100.0 / t)), 2)\n    return -1.0\n\ndef _data_quality_score(fields):\n\
          \    score = 0\n    for v in fields:\n        if isinstance(v, (int, float)):\n\
          \            if v >= 0:\n                score += 1\n        elif str(v).strip():\n\
          \            score += 1\n    return score\n\ndef _extract_json(text):\n\
          \    raw = _clean_text(text)\n    if not raw:\n        return None\n   \
          \ raw = re.sub(r\"<think>[\\s\\S]*?</think>\", \"\", raw, flags=re.I)\n\
          \    raw = re.sub(r\"^```json\\s*\", \"\", raw, flags=re.I)\n    raw = re.sub(r\"\
          ^```\\s*\", \"\", raw)\n    raw = re.sub(r\"\\s*```$\", \"\", raw)\n   \
          \ raw = raw.strip()\n    if not raw:\n        return None\n    try:\n  \
          \      return json.loads(raw)\n    except Exception:\n        pass\n   \
          \ m = re.search(r\"(\\{[\\s\\S]*\\}|\\[[\\s\\S]*\\])\", raw)\n    if m:\n\
          \        try:\n            return json.loads(m.group(1))\n        except\
          \ Exception:\n            return None\n    return None\n\nMODULE_NAME_MAP\
          \ = {\n    \"product_basics\": \"产品基础\",\n    \"compliance_expression\"\
          : \"合规表达\",\n    \"customer_opening\": \"接待开场\",\n    \"needs_discovery\"\
          : \"需求挖掘\",\n    \"objection_handling\": \"异议处理\",\n    \"combo_recommendation\"\
          : \"搭配推荐\",\n    \"closing_conversion\": \"成交推进\",\n    \"independent_service\"\
          : \"独立上岗\",\n    \"final_review\": \"综合复盘\",\n}\n\ndef _module_index_digest(obj):\n\
          \    if obj is None:\n        return {\n            \"module_index_present\"\
          : 0,\n            \"module_low_count\": 0,\n            \"module_medium_count\"\
          : 0,\n            \"module_focus_code\": \"\",\n            \"module_focus_name\"\
          : \"\",\n            \"module_focus_score\": -1.0,\n            \"module_risk_notes\"\
          : \"\",\n            \"module_index_card\": \"模块指数：未提供\",\n            \"\
          module_index_summary_json_out\": \"\",\n        }\n\n    items = []\n  \
          \  if isinstance(obj, dict):\n        # dict[module_code] = {...}\n    \
          \    if all(isinstance(v, dict) for v in obj.values()):\n            for\
          \ code, detail in obj.items():\n                row = dict(detail)\n   \
          \             row.setdefault(\"module_code\", str(code))\n             \
          \   items.append(row)\n        else:\n            items = [obj]\n    elif\
          \ isinstance(obj, list):\n        items = [x for x in obj if isinstance(x,\
          \ dict)]\n\n    parsed = []\n    for row in items:\n        code = _clean_text(row.get(\"\
          module_code\"))\n        name = _clean_text(row.get(\"module_name\")) or\
          \ MODULE_NAME_MAP.get(code, code)\n        overall = _clamp_score(row.get(\"\
          overall_index\"), -1)\n        practice = _clamp_score(row.get(\"practice_index\"\
          ), -1)\n        learning = _clamp_score(row.get(\"learning_index\"), -1)\n\
          \        assessment = _clamp_score(row.get(\"assessment_index\"), -1)\n\
          \        if overall >= 0 or practice >= 0 or learning >= 0 or assessment\
          \ >= 0:\n            parsed.append({\n                \"module_code\": code,\n\
          \                \"module_name\": name or \"未命名模块\",\n                \"\
          overall_index\": overall,\n                \"practice_index\": practice,\n\
          \                \"learning_index\": learning,\n                \"assessment_index\"\
          : assessment,\n            })\n\n    if not parsed:\n        return {\n\
          \            \"module_index_present\": 0,\n            \"module_low_count\"\
          : 0,\n            \"module_medium_count\": 0,\n            \"module_focus_code\"\
          : \"\",\n            \"module_focus_name\": \"\",\n            \"module_focus_score\"\
          : -1.0,\n            \"module_risk_notes\": \"\",\n            \"module_index_card\"\
          : \"模块指数：未提供\",\n            \"module_index_summary_json_out\": _clean_text(json.dumps(obj,\
