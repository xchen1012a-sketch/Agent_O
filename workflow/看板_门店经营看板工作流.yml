          \        \"module_index_present\": 1,\n        \"module_low_count\": len(low),\n\
          \        \"module_medium_count\": len(medium),\n        \"module_focus_code\"\
          : focus[\"module_code\"],\n        \"module_focus_name\": focus[\"module_name\"\
          ],\n        \"module_focus_score\": focus[\"overall_index\"],\n        \"\
          module_risk_notes\": \"；\".join(top_notes),\n        \"module_index_card\"\
          : (\n            f'模块指数低分模块数：{len(low)}\\n'\n            f'模块指数观察模块数：{len(medium)}\\\
          n'\n            f'最低模块：{focus[\"module_name\"]}（{focus[\"overall_index\"\
          ] if focus[\"overall_index\"] >= 0 else \"未提供\"}）\\n'\n            f'重点模块摘要：{\"\
          ；\".join(top_notes) if top_notes else \"未提供\"}'\n        ),\n        \"\
          module_index_summary_json_out\": json.dumps(parsed, ensure_ascii=False),\n\
          \    }\n\ndef _stage_review_digest(obj):\n    if obj is None:\n        return\
          \ {\n            \"stage_review_present\": 0,\n            \"stage_review_score_out\"\
          : -1.0,\n            \"stage_review_pass_out\": -1,\n            \"stage_review_summary_out\"\
          : \"\",\n            \"stage_review_action_hint_out\": \"\",\n         \
          \   \"stage_review_card\": \"阶段评估：未提供\",\n            \"latest_stage_review_json_out\"\
          : \"\",\n        }\n\n    review = obj[0] if isinstance(obj, list) and obj\
          \ and isinstance(obj[0], dict) else obj\n    if not isinstance(review, dict):\n\
          \        return {\n            \"stage_review_present\": 0,\n          \
          \  \"stage_review_score_out\": -1.0,\n            \"stage_review_pass_out\"\
          : -1,\n            \"stage_review_summary_out\": \"\",\n            \"stage_review_action_hint_out\"\
          : \"\",\n            \"stage_review_card\": \"阶段评估：未提供\",\n            \"\
          latest_stage_review_json_out\": _clean_text(str(obj))[:6000],\n        }\n\
          \n    score = _clamp_score(review.get(\"review_score\"), -1)\n    is_pass\
          \ = review.get(\"is_pass\")\n    if isinstance(is_pass, bool):\n       \
          \ pass_flag = 1 if is_pass else 0\n    else:\n        pass_flag = _to_bool_flag(is_pass)\n\
          \    summary = _clean_text(review.get(\"review_summary\"))\n    next_stage_rec\
          \ = _clean_text(review.get(\"next_stage_recommendation\"))\n    rec_actions\
          \ = review.get(\"recommended_actions_json\")\n    if isinstance(rec_actions,\
          \ str):\n        try:\n            parsed_actions = json.loads(rec_actions)\n\
          \        except Exception:\n            parsed_actions = []\n    else:\n\
          \        parsed_actions = rec_actions if isinstance(rec_actions, list) else\
          \ []\n    action_hint = next_stage_rec or (\"；\".join([_clean_text(x) for\
          \ x in parsed_actions[:3] if _clean_text(x)]))\n\n    return {\n       \
          \ \"stage_review_present\": 1 if (score >= 0 or pass_flag in {0,1} or summary\
          \ or action_hint) else 0,\n        \"stage_review_score_out\": score,\n\
          \        \"stage_review_pass_out\": pass_flag,\n        \"stage_review_summary_out\"\
          : summary,\n        \"stage_review_action_hint_out\": action_hint,\n   \
          \     \"stage_review_card\": (\n            f'阶段评估分：{score if score >= 0\
