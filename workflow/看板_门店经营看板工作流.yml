          s*', '', raw)\n    raw = re.sub(r'\\s*```$', '', raw)\n    try:\n      \
          \  obj = json.loads(raw)\n        return obj if isinstance(obj, dict) else\
          \ {}\n    except Exception:\n        pass\n    m = re.search(r'\\{[\\s\\\
          S]*\\}', raw)\n    if m:\n        try:\n            obj = json.loads(m.group(0))\n\
          \            return obj if isinstance(obj, dict) else {}\n        except\
          \ Exception:\n            pass\n    return {}\n\ndef _safe_text(v, default=\"\
          \"):\n    if v is None:\n        return default\n    s = str(v).strip()\n\
          \    return s if s else default\n\ndef _safe_list(v):\n    if isinstance(v,\
          \ list):\n        return [str(x).strip() for x in v if str(x).strip()]\n\
          \    if isinstance(v, str) and v.strip():\n        return [v.strip()]\n\
          \    return []\n\ndef _sanitize(text: str) -> str:\n    s = _safe_text(text)\n\
          \    replacements = [\n        (r'必须辞退|直接开除|立刻淘汰|一律淘汰', '建议由店长进一步复核岗位适配'),\n\
          \        (r'一定要|必须要|绝对要', '建议优先'),\n        (r'彻底不行|完全不适合|明显不适合销售', '当前表现仍需重点跟进'),\n\
          \        (r'100%|绝对|保证', '尽量'),\n    ]\n    for p, r in replacements:\n\
          \        s = re.sub(p, r, s)\n    return s[:180]\n\ndef main(\n    llm_text:\
          \ str = \"\",\n    rule_risk_level: str = \"medium\",\n    rule_risk_score\
          \ = 0,\n    rule_reason: str = \"\",\n    coaching_focus: str = \"综合稳定性\"\
          ,\n    next_action: str = \"持续观察\",\n    action_window: str = \"本周内回看\"\
          ,\n    manager_attention_needed = False,\n    dashboard_tags=None,\n   \
          \ employee_name: str = \"\",\n    job_title: str = \"\",\n    data_quality:\
