          \ = -1\n) -> dict:\n    data = _extract_json(llm_text)\n    allowed_risk\
          \ = {\"low\", \"medium\", \"high\"}\n    risk_level = _safe_text(data.get(\"\
          risk_level\"), rule_risk_level).lower()\n    if risk_level not in allowed_risk:\n\
          \        risk_level = rule_risk_level if str(rule_risk_level) in allowed_risk\
          \ else \"medium\"\n\n    try:\n        risk_score = int(round(float(data.get(\"\
          risk_score\", rule_risk_score))))\n    except Exception:\n        risk_score\
          \ = int(round(float(rule_risk_score or 0)))\n    risk_score = max(0, min(100,\
          \ risk_score))\n\n    if str(rule_risk_level) == \"high\" and risk_level\
          \ == \"low\":\n        risk_level = \"medium\"\n    if str(rule_risk_level)\
          \ == \"high\" and risk_score < 60:\n        risk_score = max(60, int(rule_risk_score))\n\
          \    if str(rule_risk_level) == \"medium\" and risk_level == \"low\" and\
          \ int(rule_risk_score) >= 50:\n        risk_level = \"medium\"\n\n    if\
          \ int(stage_review_pass) == 0 and risk_level == \"low\":\n        risk_level\
