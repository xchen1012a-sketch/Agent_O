          \ (\"未通过\" if pass_flag == 0 else \"未提供\"))}\\n'\n            f'阶段评估总结：{summary\
          \ or \"未提供\"}\\n'\n            f'阶段建议：{action_hint or \"未提供\"}'\n      \
