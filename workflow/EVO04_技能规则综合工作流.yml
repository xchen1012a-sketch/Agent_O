app:
  description: Evo Phase 4 procedural synthesis workflow. Converts repeated reflective lessons into one reusable skill rule.
  icon: 🧩
  icon_background: '#F6FFED'
  mode: workflow
  name: EVO04 技能规则综合工作流
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.1.32@20a5454088fa017b72490e1cbaeebff21094d11b13e41197591734d1c08cdbb5
    version: null
