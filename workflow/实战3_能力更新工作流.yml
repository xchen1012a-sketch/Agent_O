    - data:
        code: "import json\nimport re\n\nMODULE_META = {\n    \"product_basics\": {\n        \"name\": \"产品基础\",\n        \"primary_dims\": [\"product_knowledge\"],\n        \"secondary_dims\": [\"response\"],\n        \"training_hint\": \"优先复训产品材质、证书、工艺与基础卖点说明。\"\n    },\n    \"compliance_expression\": {\n        \"name\": \"合规表达\",\n        \"primary_dims\": [\"compliance\"],\n        \"secondary_dims\": [\"response\"],\n        \"training_hint\": \"优先复训合规表达红线、替代表达与风险规避。\"\n    },\n    \"customer_opening\": {\n        \"name\": \"接待开场\",\n        \"primary_dims\": [\"sales_communication\"],\n        \"secondary_dims\": [\"response\"],\n        \"training_hint\": \"优先复训开场破冰、需求探询与自然衔接。\"\n    },\n    \"needs_discovery\": {\n        \"name\": \"需求挖掘\",\n        \"primary_dims\": [\"sales_communication\"],\n        \"secondary_dims\": [\"response\"],\n        \"training_hint\": \"优先复训需求追问、预算识别与购买动机判断。\"\n    },\n    \"objection_handling\": {\n        \"name\": \"异议处理\",\n        \"primary_dims\"\
          : [\"sales_communication\", \"response\"],\n        \"secondary_dims\": [\"compliance\"],\n        \"training_hint\": \"优先复训价格异议、真假质疑与犹豫拖延应对。\"\n    },\n    \"combo_recommendation\": {\n        \"name\": \"搭配推荐\",\n        \"primary_dims\": [\"sales_communication\"],\n        \"secondary_dims\": [\"product_knowledge\"],\n        \"training_hint\": \"优先复训场景化推荐、搭配逻辑与利益点表达。\"\n    },\n    \"closing_conversion\": {\n        \"name\": \"成交推进\",\n        \"primary_dims\": [\"sales_communication\"],\n        \"secondary_dims\": [\"response\"],\n        \"training_hint\": \"优先复训试探成交、缩小选择与温和推进。\"\n    },\n    \"independent_service\": {\n        \"name\": \"独立上岗\",\n        \"primary_dims\": [\"response\", \"sales_communication\"],\n        \"secondary_dims\": [\"compliance\"],\n        \"training_hint\": \"优先复训独立接待完整链路与临场稳定性。\"\n    },\n    \"final_review\": {\n        \"name\": \"综合复盘\",\n        \"primary_dims\": [\"sales_communication\", \"response\"],\n        \"secondary_dims\": [\"\
          product_knowledge\", \"compliance\"],\n        \"training_hint\": \"优先做综合复盘，针对最薄弱环节定向补训。\"\n    }\n}\n\nMODULE_ALIAS = {\n    \"产品基础\": \"product_basics\",\n    \"合规表达\": \"compliance_expression\",\n    \"接待开场\": \"customer_opening\",\n    \"需求挖掘\": \"needs_discovery\",\n    \"异议处理\": \"objection_handling\",\n    \"搭配推荐\": \"combo_recommendation\",\n    \"成交推进\": \"closing_conversion\",\n    \"独立上岗\": \"independent_service\",\n    \"综合复盘\": \"final_review\",\n}\n\nDIMENSION_ALIAS = {\n    \"product_knowledge\": \"product_knowledge\",\n    \"产品知识\": \"product_knowledge\",\n    \"专业准确\": \"product_knowledge\",\n    \"产品准确\": \"product_knowledge\",\n\n    \"compliance\": \"compliance\",\n    \"合规表达\": \"compliance\",\n    \"合规安全\": \"compliance\",\n\n    \"sales_communication\": \"sales_communication\",\n    \"销售沟通\": \"sales_communication\",\n    \"需求洞察\": \"sales_communication\",\n    \"异议处理\": \"sales_communication\",\n    \"成交推进\": \"sales_communication\",\n\n    \"response\"\
          : \"response\",\n    \"应变回应\": \"response\",\n    \"表达自然\": \"response\",\n    \"客户应答\": \"response\",\n    \"回应不清\": \"response\",\n}\n\nDIMENSION_LABEL = {\n    \"product_knowledge\": \"产品知识\",\n    \"compliance\": \"合规表达\",\n    \"sales_communication\": \"销售沟通\",\n    \"response\": \"应变回应\",\n}\n\ndef safe_text(v):\n    return \"\" if v is None else str(v).strip()\n\ndef clamp_num(v, low=0, high=100, default=60):\n    try:\n        if v is None or str(v).strip() == \"\":\n            return float(default)\n        n = float(v)\n    except Exception:\n        return float(default)\n    return round(max(float(low), min(float(high), n)), 2)\n\ndef clamp_int(v, low=-10, high=10, default=0):\n    try:\n        if v is None or str(v).strip() == \"\":\n            return int(default)\n        n = int(round(float(v)))\n    except Exception:\n        return int(default)\n    return max(int(low), min(int(high), n))\n\ndef non_negative_int(v, default=0):\n    try:\n        if v is None\
          \ or str(v).strip() == \"\":\n            return int(default)\n        n = int(round(float(v)))\n    except Exception:\n        return int(default)\n    return max(0, n)\n\ndef parse_json_obj(raw):\n    text = safe_text(raw)\n    if not text:\n        return {}\n    text = re.sub(r\"^```json\\s*\", \"\", text, flags=re.I)\n    text = re.sub(r\"^```\\s*\", \"\", text)\n    text = re.sub(r\"\\s*```$\", \"\", text)\n    try:\n        data = json.loads(text)\n        return data if isinstance(data, dict) else {}\n    except Exception:\n        pass\n    match = re.search(r\"\\{[\\s\\S]*\\}\", text)\n    if match:\n        try:\n            data = json.loads(match.group(0))\n            return data if isinstance(data, dict) else {}\n        except Exception:\n            pass\n    return {}\n\ndef parse_list(raw):\n    if isinstance(raw, list):\n        return [safe_text(x) for x in raw if safe_text(x)]\n    text = safe_text(raw)\n    if not text:\n        return []\n    try:\n    \
          \    data = json.loads(text)\n        if isinstance(data, list):\n            return [safe_text(x) for x in data if safe_text(x)]\n    except Exception:\n        pass\n    parts = re.split(r\"[，,、；;|\\n]+\", text)\n    return [p.strip() for p in parts if p.strip()]\n\ndef normalize_module_code(module_code, module_name=\"\"):\n    mc = safe_text(module_code)\n    mn = safe_text(module_name)\n    if mc in MODULE_META:\n        return mc\n    if mc in MODULE_ALIAS:\n        return MODULE_ALIAS[mc]\n    if mn in MODULE_ALIAS:\n        return MODULE_ALIAS[mn]\n    low = mc.lower()\n    if low in MODULE_META:\n        return low\n    return mc or \"final_review\"\n\ndef normalize_module_name(module_code, module_name=\"\"):\n    mc = normalize_module_code(module_code, module_name)\n    if safe_text(module_name):\n        return safe_text(module_name)\n    return MODULE_META.get(mc, {}).get(\"name\", \"综合复盘\")\n\ndef normalize_dimension(value):\n    text = safe_text(value)\n    if text\
          \ in DIMENSION_ALIAS:\n        return DIMENSION_ALIAS[text]\n    low = text.lower()\n    if low in DIMENSION_ALIAS:\n        return DIMENSION_ALIAS[low]\n    return \"\"\n\ndef normalize_risk_level(value, risk_tags=None, score=None):\n    text = safe_text(value).lower()\n    if text in {\"high\", \"高风险\"}:\n        return \"high\"\n    if text in {\"medium\", \"中风险\"}:\n        return \"medium\"\n    if text in {\"low\", \"低风险\"}:\n        return \"low\"\n\n    tags = risk_tags or []\n    tag_text = \" \".join(tags)\n    if (\"合规表达风险\" in tag_text or \"过度承诺\" in tag_text or \"产品表述错误\" in tag_text):\n        return \"high\"\n    if (\"逼单\" in tag_text or \"回应不清\" in tag_text):\n        return \"medium\"\n\n    numeric = clamp_num(score, 0, 100, 0)\n    if numeric < 60:\n        return \"high\"\n    if numeric < 75:\n        return \"medium\"\n    return \"low\"\n\ndef risk_level_label(level):\n    return {\"high\":\"高风险\",\"medium\":\"中风险\",\"low\":\"低风险\"}.get(level, \"中风险\")\n\
          \ndef detect_focus_dimension(explicit_dim, eval_dim, module_code, risk_level, risk_tags, scenario_type, feedback):\n    for candidate in [explicit_dim, eval_dim]:\n        dim = normalize_dimension(candidate)\n        if dim:\n            return dim\n\n    tag_text = \" \".join(risk_tags or [])\n    if \"合规表达风险\" in tag_text or \"过度承诺\" in tag_text:\n        return \"compliance\"\n    if \"产品表述错误\" in tag_text:\n        return \"product_knowledge\"\n    if \"逼单\" in tag_text:\n        return \"sales_communication\"\n    if \"回应不清\" in tag_text:\n        return \"response\"\n\n    feedback_text = safe_text(feedback)\n    compliance_keywords = [\"绝对\", \"保值\", \"升值\", \"承诺\", \"全国最低价\", \"100%真\", \"保真\"]\n    product_keywords = [\"真假\", \"材质\", \"证书\", \"工艺\", \"纯度\", \"参数\", \"克重\"]\n    sales_keywords = [\"需求\", \"异议\", \"价格\", \"成交\", \"推进\", \"转化\", \"下单\"]\n    response_keywords = [\"表达\", \"回应\", \"逻辑\", \"含糊\", \"接不住\", \"生硬\"]\n\n    for kw in compliance_keywords:\n    \
          \    if kw in feedback_text:\n            return \"compliance\"\n    for kw in product_keywords:\n        if kw in feedback_text:\n            return \"product_knowledge\"\n    for kw in sales_keywords:\n        if kw in feedback_text:\n            return \"sales_communication\"\n    for kw in response_keywords:\n        if kw in feedback_text:\n            return \"response\"\n\n    meta = MODULE_META.get(module_code, {})\n    primary = meta.get(\"primary_dims\") or []\n    if primary:\n        return primary[0]\n\n    st = safe_text(scenario_type)\n    if \"真假\" in st or \"材质\" in st:\n        return \"product_knowledge\"\n    if \"嫌贵\" in st or \"犹豫\" in st:\n        return \"sales_communication\"\n\n    if risk_level == \"high\":\n        return \"compliance\"\n    return \"response\"\n\ndef score_band(score):\n    if score >= 85:\n        return 2\n    if score >= 70:\n        return 1\n    if score >= 60:\n        return 0\n    if score >= 50:\n        return -1\n    return\
          \ -2\n\ndef build_deltas(module_code, focus_dimension, score, risk_level, risk_tags, practice_turns):\n    base = score_band(score)\n    deltas = {\n        \"product_knowledge\": base,\n        \"compliance\": base,\n        \"sales_communication\": base,\n        \"response\": base,\n    }\n\n    meta = MODULE_META.get(module_code, {})\n    primary_dims = meta.get(\"primary_dims\") or []\n    secondary_dims = meta.get(\"secondary_dims\") or []\n\n    primary_bump = 1 if score >= 70 else -1 if score < 60 else 0\n    secondary_bump = 1 if score >= 80 else -1 if score < 50 else 0\n\n    for dim in primary_dims:\n        deltas[dim] = deltas.get(dim, 0) + primary_bump\n\n    for dim in secondary_dims:\n        deltas[dim] = deltas.get(dim, 0) + secondary_bump\n\n    if focus_dimension in deltas:\n        deltas[focus_dimension] += (1 if score >= 75 else -1 if score < 65 else 0)\n\n    if non_negative_int(practice_turns, 0) >= 6 and score >= 75:\n        deltas[\"response\"] += 1\n\
          \n    tag_text = \" \".join(risk_tags or [])\n    if \"合规表达风险\" in tag_text or \"过度承诺\" in tag_text:\n        deltas[\"compliance\"] -= 3\n        deltas[\"response\"] -= 1\n    if \"产品表述错误\" in tag_text:\n        deltas[\"product_knowledge\"] -= 3\n        deltas[\"compliance\"] -= 1\n    if \"逼单\" in tag_text:\n        deltas[\"sales_communication\"] -= 2\n        deltas[\"response\"] -= 1\n    if \"回应不清\" in tag_text:\n        deltas[\"response\"] -= 2\n\n    if risk_level == \"high\":\n        deltas[focus_dimension] -= 1\n\n    return {k: clamp_int(v) for k, v in deltas.items()}\n\ndef build_training_direction(module_code, focus_dimension, followup_training, risk_level):\n    meta = MODULE_META.get(module_code, {})\n    parts = []\n    if meta.get(\"training_hint\"):\n        parts.append(meta[\"training_hint\"])\n    dim_cn = DIMENSION_LABEL.get(focus_dimension, \"重点维度\")\n    parts.append(f\"下一轮优先围绕“{dim_cn}”安排针对性复训。\")\n    if safe_text(followup_training):\n        parts.append(f\"\
          评估侧建议：{safe_text(followup_training)}\")\n    if risk_level == \"high\":\n        parts.append(\"当前风险偏高，建议补训完成后再进入进阶陪练。\")\n    elif risk_level == \"medium\":\n        parts.append(\"建议连续完成 2 次同模块复练后再观察分数变化。\")\n    else:\n        parts.append(\"当前可在保持节奏的前提下进入下一轮训练。\")\n    return \" \".join(parts)\n\ndef build_manager_tip(risk_level, focus_dimension, module_name):\n    dim_cn = DIMENSION_LABEL.get(focus_dimension, \"该维度\")\n    if risk_level == \"high\":\n        return f\"建议店长 24 小时内复盘“{module_name}”，重点检查“{dim_cn}”短板与合规稳定性。\"\n    if risk_level == \"medium\":\n        return f\"建议班组长安排 1 次“{module_name}”复练，重点跟进“{dim_cn}”是否回升。\"\n    return f\"当前可继续常规训练，后续关注“{dim_cn}”表现是否持续稳定。\"\n\ndef build_summary(user_id, module_name, scenario_type, score, focus_dimension, deltas, updated_scores, risk_level):\n    dim_cn = DIMENSION_LABEL.get(focus_dimension, \"重点维度\")\n    return (\n        f\"用户 {user_id} 在“{module_name}”模块（场景：{scenario_type or '未提供'}）\"\n        f\"评分 {int(round(score))}\
          \ 分，重点更新维度为“{dim_cn}”。\"\n        f\"本次能力变化：产品知识 {deltas['product_knowledge']:+d}，\"\n        f\"合规表达 {deltas['compliance']:+d}，\"\n        f\"销售沟通 {deltas['sales_communication']:+d}，\"\n        f\"应变回应 {deltas['response']:+d}。\"\n        f\"更新后能力：产品知识 {int(round(updated_scores['product_knowledge']))}，\"\n        f\"合规表达 {int(round(updated_scores['compliance']))}，\"\n        f\"销售沟通 {int(round(updated_scores['sales_communication']))}，\"\n        f\"应变回应 {int(round(updated_scores['response']))}。\"\n        f\"综合风险等级：{risk_level_label(risk_level)}。\"\n    )\n\ndef build_invalid_output(\n    practice_id, user_id, module_code, module_name, cycle_id, stage_no,\n    scenario_type, current_scores, reason\n):\n    updated_scores = {k: round(v, 2) for k, v in current_scores.items()}\n    result = {\n        \"update_status\": \"invalid\",\n        \"score_branch\": \"practice\",\n        \"update_source\": \"practice\",\n        \"practice_id\": safe_text(practice_id),\n        \"user_id\"\
